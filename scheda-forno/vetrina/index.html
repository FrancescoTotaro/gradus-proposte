<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141413">
<meta name="color-scheme" content="dark">
<title>CRATOS · Proposta 2, vetrina</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* Layout (da reference Solar Screen): titoli enormi in peso regolare, griglia di filetti con etichetta a sinistra e contenuto a destra, slider orizzontale dei forni, fisarmonica soluzioni, sezione rossa piena, foto tecnologia a tutta pagina */
:root{--red:#c2063a;--red-hover:#a40531;--red-on-dark:#ff6b87;--ink:#1d1d1c;--ink-2:#262625;--ink-3:#141413;--hair:rgba(255,255,255,.16);--text-2:#b8b5b2;--text-1:#ffffff;--ease:cubic-bezier(.2,.8,.2,1);--ease-out:cubic-bezier(.2,.8,.2,1);--ease-in:cubic-bezier(.4,0,1,1);--ease-inout:cubic-bezier(.4,0,.2,1);--dur-fast:150ms;--dur-base:250ms;--dur-slow:400ms;--dur-page:450ms}
body{margin:0;font-family:'Montserrat',system-ui,sans-serif;color:#fff;background:#1d1d1c}
a{color:inherit;text-decoration:none}
a:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:3px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));box-sizing:border-box}
.label{font-size:14px;line-height:1.5;font-weight:500;color:#b8b5b2}
.big{margin:0;font-size:clamp(32px,3.9vw,56px);line-height:1.12;font-weight:400;letter-spacing:-.03em;text-wrap:balance}
.lnk{color:#fff;font-weight:600;text-decoration:underline;text-decoration-color:#c2063a;text-decoration-thickness:2px;text-underline-offset:6px;transition:color var(--dur-fast) var(--ease-out)}


/* Pulsanti */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border-radius:999px;font-size:15px;font-weight:600;transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.pill-red{background:#c2063a;color:#fff}
.pill-white{background:#fff;color:#1d1d1c}
.pill-line{border:1.5px solid rgba(255,255,255,.7);color:#fff}
.round{flex:0 0 auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#1d1d1c;transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-base) var(--ease-out)}


/* Header: logo al centro */
.site-head{position:sticky;top:0;z-index:20;border-bottom:1px solid transparent}
.bar{height:80px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
.nav-d{display:flex;gap:28px;font-size:14px;font-weight:500}
.nav-d a{opacity:.85;transition:opacity var(--dur-fast) var(--ease-out)}
.nav-m{display:none}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}

/* Hero */
.hero{position:relative;min-height:750px;margin-top:-80px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:linear-gradient(180deg,rgb(203,2,81) 0%,rgb(165,2,66) 12.5%,rgb(130,2,53) 25%,rgb(100,2,42) 37.5%,rgb(73,1,31) 50%,rgb(52,2,23) 62.5%,rgb(31,1,13) 75%,rgb(17,0,7) 87.5%,rgb(7,0,3) 100%)}
.hero-art{position:absolute;top:0;right:max(0px,calc((100% - 1440px)/2));bottom:0;width:min(62%,900px);background:url(../img/567dbd4cf36b2d59ad67c55a733d8764.webp) right center/auto 100% no-repeat}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,19,0) 40%,rgba(20,20,19,.55) 70%,rgba(20,20,19,.92) 100%)}
.hero h1{position:relative;margin:0 0 40px;font-size:clamp(48px,8vw,124px);line-height:.98;font-weight:500;letter-spacing:-.045em}
.ln{display:block;overflow:hidden;padding-bottom:.08em}.ln>span{display:block}
.strip{position:relative;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);border-top:1px solid var(--hair)}
.strip>div{padding:28px 0 40px}
.strip>div+div{border-left:1px solid var(--hair);padding-left:40px}

/* Mini carosello nell'hero */
.mini{position:relative;height:150px;margin-right:40px}
.mini-item{position:absolute;inset:0;display:flex;gap:20px;align-items:stretch;opacity:0;visibility:hidden}
.mini-item:first-child{opacity:1;visibility:visible}
.mini-thumb{flex:0 0 120px;border-radius:10px;background:radial-gradient(90% 60% at 50% 100%,rgba(194,6,58,.75),rgba(194,6,58,0) 75%),#262625;display:flex;align-items:flex-end;justify-content:center;padding:10px 8px 6px;box-sizing:border-box;overflow:hidden}
.mini-thumb img{height:100%;max-width:100%;object-fit:contain;object-position:center bottom}
.mini-txt{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:4px 0}
.mini-txt b{font-size:18px;font-weight:600;letter-spacing:.06em}
.mini-txt span{font-size:14px;line-height:1.45;color:#b8b5b2}
.segs{display:flex;gap:6px;margin:0 40px 14px 0}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
.segs i::after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.segs i:first-child::after{transform:scaleX(1)}

/* Gamma: slider orizzontale */
.grid2{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);border-top:1px solid var(--hair)}
.grid2>.label{padding:28px 40px 0 0}
.grid2>.content{padding:28px 0 0 40px;min-width:0;border-left:1px solid var(--hair)}
.rail{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:56px 0 24px;scrollbar-width:thin;scrollbar-color:#c2063a rgba(255,255,255,.12)}
.card{flex:0 0 340px;scroll-snap-align:start;height:520px;border-radius:14px;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:28px;box-sizing:border-box;background:radial-gradient(90% 55% at 50% 100%,rgba(194,6,58,.7),rgba(194,6,58,0) 72%),linear-gradient(180deg,#2c2b2a,#1d1d1c)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(117% 72% at 50% 100%,rgba(194,6,58,.91),rgba(194,6,58,0) 72%);opacity:0;transition:opacity var(--dur-slow) var(--ease-out);pointer-events:none}
.card:focus-visible::before{opacity:1}
.card>h3,.card>p{position:relative}
.card h3{margin:0;font-size:28px;font-weight:500;letter-spacing:.02em}
.card p{margin:10px 0 0;font-size:15px;line-height:1.5;color:#b8b5b2;max-width:250px}
.card img{position:absolute;left:50%;bottom:28px;height:300px;max-width:72%;object-fit:contain;object-position:center bottom;transform:translateX(-50%);transition:transform var(--dur-slow) var(--ease-out)}

.card .round{position:absolute;right:20px;bottom:20px}
.card-all{background:#c2063a;justify-content:space-between}
.card-all h3{font-size:36px;line-height:1.1;letter-spacing:-.02em}

/* Soluzioni: fisarmonica */
.acc details{border-bottom:1px solid var(--hair)}
.acc details:first-child{border-top:1px solid var(--hair)}
.acc summary{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:26px 0;font-size:clamp(26px,2.6vw,36px);font-weight:400;letter-spacing:-.02em;transition:color var(--dur-fast) var(--ease-out)}

.plus{position:relative;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);flex:0 0 auto;transition:transform var(--dur-base) var(--ease-out),background var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:2px;margin:-1px 0 0 -8px;background:currentColor;border-radius:1px}
.plus::after{transform:rotate(90deg)}
details[open] .plus{transform:rotate(45deg);background:#c2063a;border-color:#c2063a}
.acc-body{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:16px 40px;padding:0 0 32px}
.acc-body p{margin:0;font-size:18px;line-height:1.6;color:#b8b5b2;max-width:520px}

/* Applicazioni: sezione rossa */
.red{background:#c2063a}
.red .grid2{border-top-color:rgba(255,255,255,.35)}
.red .grid2>.label{color:#fff}
.red .grid2>.content{border-left-color:rgba(255,255,255,.35)}
.red .label{color:#fff}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-top:56px}
.apps>.gcard{height:540px}

/* Tecnologia a tutta pagina */
.tech{position:relative;min-height:860px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;background:#141413}
.tech-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%}
.tech-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,19,.75) 0%,rgba(20,20,19,0) 30%,rgba(20,20,19,0) 60%,rgba(20,20,19,.9) 100%),linear-gradient(90deg,rgba(20,20,19,.55),rgba(20,20,19,0) 55%)}
.tech h2:not(.big){position:relative;margin:0;padding-top:96px;font-size:clamp(44px,7vw,108px);line-height:1;font-weight:500;letter-spacing:-.045em}
.tech .strip{margin-top:auto}

/* Motion */
@media (prefers-reduced-motion:no-preference){
.ln>span{animation:lineUp var(--dur-page) var(--ease-out) both}
.ln:nth-child(2)>span{animation-delay:60ms}
.hero-art{animation:artIn 600ms var(--ease-out) both}
.strip.hero-strip{animation:fadeUp var(--dur-slow) var(--ease-out) 180ms both}
.mini-item{animation:cycle 16s linear infinite}
.mini-item:nth-child(2){animation-delay:-12s}.mini-item:nth-child(3){animation-delay:-8s}.mini-item:nth-child(4){animation-delay:-4s}
.segs i::after{animation:seg 16s linear infinite}
.segs i:nth-child(2)::after{animation-delay:-12s}.segs i:nth-child(3)::after{animation-delay:-8s}.segs i:nth-child(4)::after{animation-delay:-4s}
details[open] .acc-body{animation:fadeUp var(--dur-base) var(--ease-out) both}
@supports (animation-timeline:scroll()){
.site-head{animation:headIn linear both;animation-timeline:scroll();animation-range:0 240px}
}
@supports (animation-timeline:view()){
.tech-img{height:116%;top:-8%;animation:par linear both;animation-timeline:view()}
}
}
@keyframes lineUp{from{transform:translateY(105%)}to{transform:none}}
@keyframes artIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes cycle{0%{opacity:0;visibility:visible}2%,23%{opacity:1;visibility:visible}25%,100%{opacity:0;visibility:hidden}}
@keyframes seg{0%{transform:scaleX(0)}25%{transform:scaleX(1)}25.01%,100%{transform:scaleX(0)}}
@keyframes headIn{from{background:rgba(20,20,19,0);border-bottom-color:transparent}to{background:rgba(20,20,19,.88);border-bottom-color:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}}
@keyframes par{from{transform:translateY(-5%)}to{transform:translateY(5%)}}

@media (max-width:900px){
.nav-d{display:none}.nav-m{display:block}
.hero{min-height:0;justify-content:flex-start;padding-top:120px}
.hero-art{top:auto;left:0;width:100%;height:min(520px,120vw);background-position:center bottom;background-size:auto 100%;-webkit-mask-image:linear-gradient(180deg,transparent,#000 22%);mask-image:linear-gradient(180deg,transparent,#000 22%)}
.hero-shade{display:none}
.hero .hero-in{padding-bottom:calc(min(520px,120vw) - 40px)}
.strip,.grid2{grid-template-columns:minmax(0,1fr)}
.strip>div+div{border-left:0;padding-left:0;border-top:1px solid var(--hair)}
.grid2>.label{padding:24px 0 0}
.grid2>.content{padding:12px 0 0;border-left:0}
.mini,.segs{margin-right:0}
.card{flex-basis:78%}
.apps{grid-template-columns:minmax(0,1fr)}
.apps>.gcard{height:420px}
.tech{min-height:720px}
.tech h2:not(.big){padding-top:72px}
}

/* Soluzioni: riquadri (dalla proposta 3). La colonna sinistra finisce sulla linea verticale tra etichetta e titolo */
.sb-bento{display:grid;grid-template-columns:calc(100% / 3) minmax(0,1fr);grid-template-rows:300px 300px;gap:20px;margin-top:56px}
.sb-t1{grid-column:2;grid-row:1/span 2}.sb-t2{grid-column:1;grid-row:1}.sb-t3{grid-column:1;grid-row:2}
/* Scheda Gradus (gcard): un solo comportamento per tutte le schede foto del sito. La disposizione la decide la griglia che le contiene (.sb-bento, .apps, ...). */
.gcard{position:relative;border-radius:16px;overflow:hidden;background:#302e2d;display:flex;flex-direction:column;justify-content:flex-end;padding:32px;box-sizing:border-box;isolation:isolate;color:#fff;text-decoration:none}
.gcard-bg{position:absolute;inset:0;z-index:-2;transition:transform var(--gcard-vel,400ms) var(--ease-out)}
.gcard-bg img{width:100%;height:100%;object-fit:cover;display:block}
.gcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(29,29,28,0) var(--gcard-scuro-inizio,30%),rgba(29,29,28,var(--gcard-scuro,.92)) 100%)}
.gcard::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% var(--gcard-glow-altezza,60%) at 50% 100%,rgba(194,6,58,var(--gcard-glow,.85)),rgba(194,6,58,0) 70%);opacity:0;transition:opacity var(--gcard-vel,400ms) var(--ease-out)}
.gcard-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.gcard h3{margin:0;font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-.03em}
.gcard--lg h3{font-size:56px}
.gcard-sub{margin:6px 0 0;font-size:15px;line-height:1.5;color:#b8b5b2}
.gcard-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-base) var(--ease-out)}
.gcard-more>div{overflow:hidden}
.gcard-more p{margin:0;padding-top:12px;font-size:17px;line-height:1.5;font-weight:300;color:#fff;max-width:420px}
.gcard-more span{display:inline-block;margin-top:14px;font-size:15px;font-weight:600;text-decoration:underline;text-decoration-color:#fff;text-decoration-thickness:2px;text-underline-offset:6px}
.gcard-round{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#1d1d1c;transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-base) var(--ease-out)}
.gcard:focus-visible .gcard-bg{transform:scale(1.06)}
.gcard:focus-visible::after{opacity:1}
.gcard:focus-visible .gcard-more{grid-template-rows:1fr}
.gcard:focus-visible .gcard-sub{display:none}
.gcard:focus-visible .gcard-round{background:#c2063a;color:#fff;transform:rotate(-45deg)}
/* gcard--open: testo già aperto a riposo, finché nessun'altra scheda dello stesso gruppo è attiva */
:not(:has(>.gcard:hover,>.gcard:focus-visible))>.gcard--open .gcard-more{grid-template-rows:1fr}
@media (prefers-reduced-motion:reduce){.gcard-bg,.gcard::after,.gcard-more,.gcard-round{transition:none}.gcard:hover .gcard-bg,.gcard:focus-visible .gcard-bg,.gcard:hover .gcard-round,.gcard:focus-visible .gcard-round{transform:none}}
@media (max-width:900px){
.sb-bento{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-rows:340px}
.sb-t1,.sb-t2,.sb-t3{grid-column:auto;grid-row:auto}
.sb-t1{order:-1}
.gcard h3,.gcard--lg h3{font-size:34px}
.gcard-more{grid-template-rows:1fr}
.gcard-sub{display:none}
}

/* Riduci movimento: niente spostamenti o scale, restano i cambi di colore (vedi Movimento nel design system) */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-property:color,background-color,border-color,text-decoration-color,opacity!important;transition-duration:var(--dur-fast)!important}}

/* Comparsa allo scroll (sezione Movimento del design system): la sezione intera, sfondo compreso, entra in dissolvenza e perde la sfocatura
   restando a tutta larghezza; il contenuto cresce dal 90% al 100%. Segue lo scroll in entrambe le direzioni. Nel canvas la tavola non scorre, quindi resta visibile ferma. */
@supports (animation-timeline: view()) {
  @media (prefers-reduced-motion: no-preference) {
    .reveal{margin-inline:-48px;padding-inline:48px;view-timeline-name:--sezione;animation:reveal-fondo linear both;animation-timeline:--sezione;animation-range:entry 0% entry 70%}
    .reveal>.wrap{animation:reveal-zoom linear both;animation-timeline:--sezione;animation-range:entry 0% entry 70%;transform-origin:50% 0}
  }
}
html,body{overflow-x:clip}
@keyframes reveal-fondo{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}
@keyframes reveal-zoom{from{transform:scale(.9)}to{transform:none}}

/* Menù principale (proposta 2, fascia sulla griglia). Desktop da 1200px: fascia sotto l'header. Sotto i 1200px: pannello a tutto schermo a due livelli */
.mn-nav{display:flex;gap:12px;font-size:14px;font-weight:500}
.mn-nv{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;font:inherit;font-weight:500;color:#fff;background:none;border:0;cursor:pointer}

.mn-nv svg{transition:transform 250ms cubic-bezier(.2,.8,.2,1)}
.mn-nv[aria-expanded="true"]{text-decoration:underline;text-decoration-color:#fff;text-decoration-thickness:2px;text-underline-offset:8px}
.mn-nv[aria-expanded="true"] svg{transform:rotate(180deg)}
.mn-nv:focus-visible,.mn-burger:focus-visible,.mn-mob button:focus-visible,.mn-mob a:focus-visible,.mn-band a:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:6px}
.mn-scrim{position:absolute;left:0;right:0;top:100%;height:100vh;height:100dvh;background:rgba(20,20,19,.6);animation:mnFade 200ms ease-out both}
.mn-band{position:absolute;left:0;right:0;top:100%;z-index:2;background:#1d1d1c;border-top:1px solid rgba(255,255,255,.12);animation:mnIn 250ms cubic-bezier(.2,.8,.2,1) both}
@keyframes mnFade{from{opacity:0}}
@keyframes mnIn{from{opacity:0;transform:translateY(-8px)}}
.mn-band-in{max-width:1360px;margin:0 auto;padding:40px 24px 48px;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr)}
.mn-band-l{padding-right:40px;display:flex;flex-direction:column;gap:16px}
.mn-band-l small{font-size:14px;line-height:20px;font-weight:500;color:#b8b5b2}
.mn-band-l p{margin:0;font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.mn-band-l a{align-self:flex-start;font-size:15px;font-weight:600;text-decoration:underline;text-decoration-color:#c2063a;text-decoration-thickness:2px;text-underline-offset:6px}
.mn-band-r{border-left:1px solid rgba(255,255,255,.16);padding-left:40px}
.mn-band-r ul,.mn-mob ul{list-style:none;margin:0;padding:0}
.mn-band-r ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px}
.mn-band-r li{border-bottom:1px solid #3d3b3a}
.mn-band-r li a{display:flex;align-items:center;justify-content:space-between;min-height:68px;font-size:24px;font-weight:600;letter-spacing:-.01em}
.mn-band-r li a svg{color:#b8b5b2;transition:color 150ms,transform 250ms cubic-bezier(.2,.8,.2,1)}
.mn-band-r li a:focus-visible svg{color:#fff;transform:translateX(4px)}

.mn-burger{display:none;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:none;border:0;color:#fff;cursor:pointer}
.mn-mob{position:absolute;top:0;left:0;right:0;height:100vh;height:100dvh;z-index:60;background:#1d1d1c;color:#fff;display:flex;flex-direction:column;overflow-y:auto;animation:mnFade 200ms ease-out both}
.mn-mob-hd{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 16px}
.mn-mob-hd img{display:block;height:24px;width:auto}
.mn-mob-hd button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:none;border:0;color:#fff;cursor:pointer}
.mn-lv1{padding:8px 20px 0}
.mn-lv1 li{border-bottom:1px solid #3d3b3a}
.mn-lv1 a,.mn-lv1 button{display:flex;width:100%;align-items:center;justify-content:space-between;min-height:68px;padding:0;background:none;border:0;color:#fff;font:inherit;font-size:26px;font-weight:600;letter-spacing:-.01em;text-align:left;cursor:pointer}
.mn-lv1 svg{color:#b8b5b2}
.mn-lv2-top{display:flex;align-items:center;gap:6px;min-height:52px;padding:0 20px;background:none;border:0;color:#b8b5b2;font:inherit;font-size:15px;font-weight:600;cursor:pointer;align-self:flex-start}
.mn-lv2-h{margin:4px 20px 8px;font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.02em}
.mn-lv2-all{align-self:flex-start;margin:0 20px 12px;font-size:15px;font-weight:600;text-decoration:underline;text-decoration-color:#c2063a;text-decoration-thickness:2px;text-underline-offset:6px}

.sb-hero-in{grid-template-columns:minmax(0,1fr);gap:8px;min-height:0}
.sb-hero-txt{padding-bottom:0}
.sb-h1{font-size:76px}
.sb-payoff{margin-top:16px;font-size:13px;letter-spacing:.26em}
.sb-claim{margin-top:24px;font-size:23px}
.sb-lead{font-size:16px}
.sb-cta{flex-direction:column;margin-top:28px}
.sb-cta .pill{width:100%}
.sb-hero-fig{margin-top:24px}
.sb-hero-fig img{height:400px}
.sb-sec{padding-top:64px}
.sb-plus{padding-top:48px}
.sb-plus-grid{grid-template-columns:minmax(0,1fr);margin-top:28px}
.sb-plus-i{grid-template-columns:48px minmax(0,1fr);gap:16px;padding:16px 0}
.sb-plus-i img{width:48px}
.sb-amb{margin-top:64px;height:420px}
.sb-amb figcaption{bottom:28px}
.sb-intro{padding-top:64px}
.sb-intro-body>p{font-size:17px}
.sb-facts dd{font-size:30px}
.sb-vers{margin-top:28px;margin-inline:-20px;padding-inline:20px;scroll-padding-inline:20px}
.sb-ver{flex-basis:86%}
.sb-ver-body{padding:22px 20px 24px}
.sb-story,.sb-fin-in{grid-template-columns:minmax(0,1fr);gap:24px;margin-top:48px}
.sb-story--rev .sb-story-img{order:0}
.sb-story-ico{width:48px;margin-bottom:16px}
.sb-story-txt>p,.sb-fin-lead{font-size:17px}
.sb-finsec{padding-top:72px}
.sb-fin-in{margin-top:0}
.sb-fin-img{aspect-ratio:4/3}
.sb-fin{gap:28px}
.sb-fin-g ul{flex-wrap:wrap;gap:12px}
.sb-fin-g li,.sb-sw{width:64px}
.sb-sw{height:64px}
/* tabella come schede: etichetta e due valori */
.sb-table thead{display:none}
.sb-table,.sb-table tbody,.sb-table tr,.sb-table th,.sb-table td{display:block;width:auto}
.sb-table tbody tr{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.sb-table tbody tr:first-child{border-top:2px solid #c2063a}
.sb-table tbody th,.sb-table tbody td{padding:0;border:0!important}
.sb-table tbody th{width:auto;margin-bottom:8px;font-size:13px}
.sb-table tbody td{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:12px;font-size:15px;padding:3px 0}
.sb-table tbody td::before{content:attr(data-col);font-size:13px;font-weight:500;color:#b8b5b2}
.sb-cat{padding:24px}
.sb-cat .pill{width:100%}
#richiesta{margin-top:64px}
#altri{padding-top:64px}
}

/* tabella a una colonna: le versioni stanno nel catalogo */
.sb-table--one tbody th{width:40%}
.sb-table--one tbody tr:first-child th,.sb-table--one tbody tr:first-child td{border-top:2px solid #c2063a}
/* finiture: testo a sinistra e foto a destra, per alternare con il blocco Iso Max */
.sb-fin-in--rev{grid-template-columns:minmax(0,8fr) minmax(0,4fr)}
.sb-fin-in--rev .sb-fin-img{order:2}
@media (max-width:1199px){.sb-fin-in--rev{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
@media (max-width:767px){.sb-fin-in--rev{grid-template-columns:minmax(0,1fr)}.sb-fin-in--rev .sb-fin-img{order:0}}
/* solo su mobile il riquadro del catalogo va dopo la tabella */
@media (max-width:767px){.sb-dati .sb-cat{order:2}}
/* solo su mobile: niente icone nei blocchi Tecnologia e Finiture */
@media (max-width:767px){#tecnologia .sb-story-ico,#finiture .sb-story-ico{display:none}}
/* hero mobile a tutto schermo: riempie la prima schermata del telefono (100svh, massimo 844px).
   Il forno occupa lo spazio che resta sotto i testi. "Richiedi informazioni" resta nella barra fissa in basso,
   quindi il fondo della hero lascia libera l'altezza di quella barra */
@media (max-width:767px){
.sb-hero{height:min(100svh,844px);min-height:600px;box-sizing:border-box;padding-top:92px;padding-bottom:calc(77px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.sb-hero .sb-hero-in{flex:1 1 auto;width:100%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto auto minmax(0,1fr);gap:0;align-items:start;padding-bottom:0!important}
.sb-hero .sb-hero-txt{display:contents}
.sb-hero .sf-crumbs ol{margin-bottom:12px;font-size:13px}
.sb-hero .sb-h1{font-size:64px}
.sb-hero .sb-payoff{margin-top:10px;font-size:12px;letter-spacing:.24em}
.sb-hero .sb-claim{margin-top:20px;font-size:20px;line-height:1.3;max-width:330px}
.sb-hero .sb-lead{display:none}
.sb-hero .sb-cta{flex-direction:row;margin-top:18px}
.sb-hero .sb-cta .pill-white{display:none}
.sb-hero .sb-cta .pill-line{width:auto;min-height:44px;padding:0 16px;font-size:14px;gap:8px;white-space:nowrap}
.sb-hero .sb-hero-fig{position:relative;align-self:stretch;margin:16px 0 0;min-height:160px}
.sb-hero .sb-hero-fig img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;object-position:50% 100%}
.sb-hero .sb-hero-fig::after{left:22%;right:22%;bottom:-12px;height:32px}
/* sfondo: bagliore circolare in pixel, centrato dietro il forno, così non si allunga sullo schermo verticale */
.sb-hero{background:radial-gradient(circle 300px at 50% 72%,#b3123f 0%,#8b0d2b 45%,rgba(139,13,43,0) 100%),linear-gradient(180deg,#5c0a1f 0%,#43081a 50%,#2a0510 80%,#1d1d1c 100%)}
}
@media (max-width:767px){.sb-table--one tbody th{width:auto}.sb-table--one tbody td{display:block;padding:0}.sb-table--one tbody td::before{content:none}}
</style>

<body>
<div id="dc-root"></div>

<script>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { ver: null, gi: 0, sent: false, err: {}, mnOpen: null, mnMob: false, mnLv: null, ft: null, fi: 0, am: 0 }; }
cards(rail) { return Array.prototype.slice.call(rail.querySelectorAll('.card')); }
onRail(e) {
const rail = e.currentTarget, r0 = rail.getBoundingClientRect().left;
let best = 0, bd = Infinity;
this.cards(rail).forEach((c, i) => { const d = Math.abs(c.getBoundingClientRect().left - r0 - 20); if (d < bd) { bd = d; best = i; } });

}

const wrap = e.currentTarget.closest('.wrap'); const rail = wrap && wrap.querySelector('.rail'); if (!rail) return;
const c = this.cards(rail)[i]; if (!c) return;
const smooth = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const win = doc.defaultView, head = doc.querySelector('.site-head'), bar = doc.querySelector('.sf-anchors');

let off = 16;
if (bar && win.getComputedStyle(bar).position === 'sticky') off += (parseFloat(win.getComputedStyle(bar).top) || 0) + bar.offsetHeight;
else if (head) off += head.offsetHeight;
// contenitore che scorre davvero: il primo antenato con scorrimento verticale, altrimenti la pagina
let box = el.parentElement;
while (box && box !== doc.body && box !== doc.documentElement) { const o = win.getComputedStyle(box).overflowY; if ((o === 'auto' || o === 'scroll') && box.scrollHeight > box.clientHeight) break; box = box.parentElement; }
const soft = win.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

else { box.scrollTo({ top: el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - off, behavior: soft }); }

check(f, v) {

const cur = (this.state.err || {})[f];

const msg = this.check(f, v);

}
submit(e) {
e.preventDefault();
const el = e.currentTarget.elements;
const vals = { nome: el.nome.value, email: el.email.value, att: el.attivita.value, priv: el.privacy.checked };
const err = {}; Object.keys(vals).forEach((k) => { err[k] = this.check(k, vals[k]); });
const first = ['nome', 'email', 'att', 'priv'].find((k) => err[k]);
if (first) { this.setState({ err }); const ids = { nome: 'sf-nome', email: 'sf-email', att: 'sf-att', priv: 'sf-priv' }; const f = e.currentTarget.querySelector('#' + ids[first]); if (f) f.focus(); return; }

renderVals() {
const err = this.state.err || {};
const ver = this.state.ver;

const mo = this.state.mnOpen, ml = this.state.mnLv;
const p = this.props;

gScuroIni: (p.scuro_inizio ?? 30) + '%',
mnSolOpen: mo === 'sol', mnSolExp: mo === 'sol' ? 'true' : 'false', mnSolT: () => this.setState({ mnOpen: mo === 'sol' ? null : 'sol' }), mnSolLv: ml === 'sol', mnSolGo: () => this.setState({ mnLv: 'sol' }),
mnForOpen: mo === 'for', mnForExp: mo === 'for' ? 'true' : 'false', mnForT: () => this.setState({ mnOpen: mo === 'for' ? null : 'for' }), mnForLv: ml === 'for', mnForGo: () => this.setState({ mnLv: 'for' }),
mnAppOpen: mo === 'app', mnAppExp: mo === 'app' ? 'true' : 'false', mnAppT: () => this.setState({ mnOpen: mo === 'app' ? null : 'app' }), mnAppLv: ml === 'app', mnAppGo: () => this.setState({ mnLv: 'app' }),
mnSerOpen: mo === 'ser', mnSerExp: mo === 'ser' ? 'true' : 'false', mnSerT: () => this.setState({ mnOpen: mo === 'ser' ? null : 'ser' }), mnSerLv: ml === 'ser', mnSerGo: () => this.setState({ mnLv: 'ser' }),

mnMobExp: this.state.mnMob ? 'true' : 'false',
mnMobT: () => this.setState({ mnMob: !this.state.mnMob, mnLv: null }),
mnLvRoot: ml === null,

mnKey: (e) => { if (e.key === 'Escape') this.setState({ mnOpen: null, mnMob: false, mnLv: null }); },

g1On: this.state.gi === 1 ? 'true' : 'false', g1Go: () => this.setState({ gi: 1 }),

goSez: (e) => this.goSez(e),

vClaOn: ver === 'classic' ? 'true' : 'false', vClaGo: pick('classic'), vClaLbl: ver === 'classic' ? 'Classic selezionata' : 'Scegli Classic',

eAttOn: !!err.att, eAttMsg: err.att || '', eAttInv: err.att ? 'true' : 'false', eAttBlur: this.onField('att', true), eAttChg: this.onField('att', true),

d2Cur: this.state.fi === 2 ? 'true' : 'false', d2Go: (e) => this.goCard(e, 2),

}

DCLite.mount(Component, "<div style=\"min-width:320px;background:#1d1d1c;color:#fff;font-family:'Montserrat',system-ui,sans-serif; --gcard-glow: {{gGlow}}; --gcard-glow-altezza: {{gGlowAlt}}; --gcard-scuro: {{gScuro}}; --gcard-scuro-inizio: {{gScuroIni}}; --gcard-vel: {{gVel}}\"><style>#contenuto section[id], #contenuto [id].sf-sec, footer[id]{scroll-margin-top:160px}<\/style>\n\n<!-- HEADER -->\n<a class=\"skip\" href=\"#contenuto\">Salta al contenuto<\/a>\n<header class=\"site-head\" onKeyDown=\"{{mnKey}}\">\n<div class=\"wrap bar\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-top: 2px\">\n<a href=\"#\" aria-label=\"Gradus, home\"><img src=\"../img/e52b0b2830a177d91570dc5492c7bdab.svg\" alt=\"Gradus perfect baking\" style=\"display:block;height:34px;width:auto\" width=\"576\" height=\"87\" fetchpriority=\"high\"><\/a><nav class=\"mn-nav\" aria-label=\"Principale\"><button class=\"mn-nv\" type=\"button\" aria-expanded=\"{{mnSolExp}}\" aria-controls=\"mn-sol\" onClick=\"{{mnSolT}}\">Soluzioni<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/button><button class=\"mn-nv\" type=\"button\" aria-expanded=\"{{mnForExp}}\" aria-controls=\"mn-for\" onClick=\"{{mnForT}}\">Forni<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/button><button class=\"mn-nv\" type=\"button\" aria-expanded=\"{{mnAppExp}}\" aria-controls=\"mn-app\" onClick=\"{{mnAppT}}\">Applicazioni<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg 18\" height=\"18\" aria-hidden=\"true\"><path d=\"M12 4v11M7 10l5 5 5-5M5 20h14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span>Scarica il catalogo<\/span><\/a><\/div>\n<\/div>\n<figure class=\"sb-hero-fig\" style=\"background: none; box-shadow: none; filter: none\"><img src=\"../img/8c8e54904126463d799763cfb40a5821.webp\" alt=\"CRATOS in mosaico nero su supporto, vista frontale\" width=\"1207\" height=\"1800\" fetchpriority=\"high\" style=\"filter: none; box-shadow: none\"><style>.sb-hero-fig::before,.sb-hero-fig::after{display:none !important;content:none !important}<\/style><\/figure>\n<\/div>\n<\/section>\n\n<nav class=\"sf-anchors\" aria-label=\"Contenuti della scheda\">\n<div class=\"wrap\"><a href=\"#plus\" onClick=\"{{goSez}}\">Plus<\/a><a href=\"#tecnologia\" onClick=\"{{goSez}}\">Tecnologia<\/a><a href=\"#finiture\" onClick=\"{{goSez}}\">Finiture<\/a><a href=\"#dati\" onClick=\"{{goSez}}\">Dati essenziali<\/a><a class=\"pill pill-red sf-anchors-cta\" href=\"#richiesta\" onClick=\"{{goSez}}\">Richiedi informazioni<\/a><\/div>\n<\/nav>\n\n<section class=\"sb-sec sb-intro\" aria-labelledby=\"t-intro\">\n<div class=\"wrap sb-intro-in\">\n<h2 class=\"sb-h2 sb-intro-h\" id=\"t-intro\">L’autenticità del forno a legna napoletano con un cuore elettrico.<\/h2>\n<div class=\"sb-intro-body\">\n<p>CRATOS offre tutte le prestazioni di cottura tipiche del tradizionale forno a legna, con una camera di cottura elettrica e soluzioni per il contenimento dei consumi. Cuoce fino a 9 pizze contemporaneamente con lo stesso risultato e, grazie alla camera alta 18 cm, anche ogni tipologia di pane.<\/p>\n<dl class=\"sb-facts\">\n<div><dt>Temperatura massima<\/dt><dd>515 °C<\/dd><dd class=\"sb-facts-s\">in 85 minuti<\/dd><\/div>\n<div><dt>Consumo medio orario<\/dt><dd>6,5 kWh<\/dd><dd class=\"sb-facts-s\">con Eco Power<\/dd><\/div>\n<div><dt>Pizze per infornata<\/dt><dd>9<\/dd><dd class=\"sb-facts-s\">da ø 30 cm<\/dd><\/div>\n<div><dt>Altezza della camera<\/dt><dd>18 cm<\/dd><dd class=\"sb-facts-s\">anche per il pane<\/dd><\/div>\n<\/dl>\n<\/div>\n<\/div>\n<\/section><figure class=\"sb-amb\">\n<img src=\"../img/13e5ede613ea1663df3609f2b06e21b0.webp\" alt=\"CRATOS in mosaico nero nella sala di un ristorante, con il pizzaiolo al lavoro\" width=\"2000\" height=\"1449\" loading=\"lazy\" decoding=\"async\">\n<figcaption class=\"wrap\"><span class=\"sb-amb-k\">CRATOS<\/span><span class=\"sb-amb-t\">Il forno a vista diventa parte dell’esperienza del locale.<\/span><\/figcaption>\n<\/figure><section class=\"sb-sec sb-plus\" id=\"plus\" aria-labelledby=\"t-plus\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Plus del prodotto<\/div><div class=\"content\"><h2 class=\"sb-h2\" id=\"t-plus\">Otto ragioni per sceglierlo.<\/h2><\/div><\/div>\n<ul class=\"sb-plus-grid\"><li class=\"sb-plus-i\"><img src=\"../img/f96dbf1763d654407cebc3d8f263ea70.svg\" alt=\"\" width=\"56\" height=\"57\" loading=\"lazy\"><div><h3>Biscotto di Sorrento<\/h3><p>Piano di cottura certificato<\/p><\/div><\/li><li class=\"sb-plus-i\"><img src=\"../img/36994a79916a1f21d047c3235b54b9c1.svg\" alt=\"\" width=\"56\" height=\"58\" loading=\"lazy\"><div><h3>Kit verticale e leggero<\/h3><p>Passa da una porta di 90 cm<\/p><\/div><\/li><li class=\"sb-plus-i\"><img src=\"../img/4fd60629acdd78eb9a290c8836002991.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\"><div><h3>Eco Power<\/h3><p>Consumo medio 6,5 kWh<\/p><\/div><\/li><li class=\"sb-plus-i\"><img src=\"../img/465207eb388b50594f6fecc1278c1251.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\"><div><h3>Iso Max<\/h3><p>Isolamento della camera<\/p><\/div><\/li><li class=\"sb-plus-i\"><img src=\"../img/861096d68c57bcbe0097c748a678cd35.svg\" alt=\"\" width=\"56\" height=\"60\" loading=\"lazy\"><div><h3>515 °C di temperatura massima<\/h3><p>Raggiunti in 85 minuti<\/p><\/div><\/li><li class=\"sb-plus-i\"><img src=\"../img/96d5dcfd46e996865476a4c9addc1118.svg\" alt=\"\" width=\"56\" height=\"59\" loading=\"lazy\"><div><h3>Ampia personalizzazione<\/h3><p>Mosaico e resina<\/p><\/div><\/li><li class=\"sb-plus-i\"><img src=\"../img/d5b392fbe098e9fd3dd97e24adcfe13f.svg\" alt=\"\" width=\"56\" height=\"59\" loading=\"lazy\"><div><h3>Doppia cupola<\/h3><\/div><\/li><li class=\"sb-plus-i\"><img src=\"../img/05c7393f96b6d85dd4941b5485cf3956.svg\" alt=\"\" width=\"56\" height=\"58\" loading=\"lazy\"><div><h3>4.0 Ready<span class=\"sb-ast\" aria-hidden=\"true\">*<\/span><\/h3><p>Predisposizione per l’industria 4.0<\/p><\/div><\/li><\/ul>\n<p class=\"sb-ast-note\"><span aria-hidden=\"true\">*<\/span> Optional<\/p>\n<\/div>\n<\/section>\n\n\n\n\n\n<section class=\"sb-sec\" id=\"tecnologia\" aria-labelledby=\"t-tec\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Tecnologia<\/div><div class=\"content\"><h2 class=\"sb-h2\" id=\"t-tec\">Cosa c’è dentro la cupola.<\/h2><\/div><\/div>\n\n<article class=\"sb-story sb-story--rev\">\n<div class=\"sb-story-img\"><img src=\"../img/f22bfc89f259ce239fff9ef6399ba364.jpg\" alt=\"Il pizzaiolo inforna una pizza in CRATOS; sul display si legge 515 gradi\" width=\"2000\" height=\"1125\" loading=\"lazy\" decoding=\"async\"><\/div>\n<div class=\"sb-story-txt\">\n<img class=\"sb-story-ico\" src=\"../img/96d5dcfd46e996865476a4c9addc1118.svg\" alt=\"\" width=\"56\" height=\"59\" loading=\"lazy\" style=\"width: 90px; height: auto\">\n<h3><\/h3><h2 class=\"sb-h2\" id=\"t-fin\" style=\"width: 552px\">Il forno tradizionale<br>napoletano.<\/h2>\n<p><span style=\"font-size: 19px\">La forma del Vesuvio, il mosaico, il marmo. CRATOS si vede dalla sala: scegli colore e finitura, in mosaico o in resina. Tutte le varianti sono nel catalogo.<\/span><\/p>\n\n<\/div>\n<\/article><article class=\"sb-story\">\n<div class=\"sb-story-img sb-story-img--kit\"><img src=\"../img/acce3c68db33bc4974d5eae6fbc6b190.webp\" alt=\"Schema del kit di trasporto verticale: forno e cupola, separati, sono larghi 90 cm e alti 210 cm\" width=\"1600\" height=\"1487\" loading=\"lazy\" decoding=\"async\"><\/div>\n<div class=\"sb-story-txt\">\n<img class=\"sb-story-ico\" src=\"../img/36994a79916a1f21d047c3235b54b9c1.svg\" alt=\"\" width=\"56\" height=\"58\" loading=\"lazy\" style=\"width: 90px; height: auto\">\n<h3>Passa da una porta di 90 cm.<\/h3>\n<p>L’unico forno a cupola che passa da una porta di 90 cm. Il sistema brevettato lo divide in due parti, da trasportare in verticale.<\/p>\n<div class=\"sb-sub\"><h4 lang=\"en\">Split dome<\/h4><p>Per gli accessi più difficili, CRATOS è disponibile anche con la cupola divisibile in due elementi: peso e ingombri si riducono, e il forno sale ai piani superiori dalle scale o con un ascensore standard.<\/p><\/div>\n<\/div>\n<\/article>\n\n<article class=\"sb-story sb-story--rev\">\n<div class=\"sb-story-img\"><img src=\"../img/60bc26d0e4f3e6d340c606d11f5a5908.webp\" alt=\"Il pizzaiolo inforna una pizza in CRATOS; sul display si legge 515 gradi\" width=\"2000\" height=\"1125\" loading=\"lazy\" decoding=\"async\"><\/div>\n<div class=\"sb-story-txt\">\n<img class=\"sb-story-ico\" src=\"../img/861096d68c57bcbe0097c748a678cd35.svg\" alt=\"\" width=\"56\" height=\"60\" loading=\"lazy\" style=\"width: 90px; height: auto\">\n<h3>515 °C in 85 minuti.<\/h3>\n<p>Il forno CRATOS raggiunge una temperatura massima di 515 °C (959 °F) in soli 85 minuti, con prestazioni di cottura perfette.<\/p>\n<div class=\"sb-sub\"><h4>Eco Power: -30% di risparmio energetico<\/h4><p>Il sistema Eco Power ottimizza la gestione di potenza, garantendo un risparmio del 30% a pieno carico senza indebolire la performance.<\/p><\/div>\n<\/div>\n<\/article>\n\n<article class=\"sb-story\">\n<div class=\"sb-story-img\"><img src=\"../img/edbd92435813aef131bed4a22cb26bd4.webp\" alt=\"Una mano appoggiata sul mosaico esterno di CRATOS acceso\" width=\"1654\" height=\"1000\" loading=\"lazy\" decoding=\"async\"><\/div>\n<div class=\"sb-story-txt\">\n<img class=\"sb-story-ico\" src=\"../img/465207eb388b50594f6fecc1278c1251.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\" style=\"width: 90px; height: auto\">\n<h3>Fuori, 40 °C.<\/h3>\n<p>Il sistema di isolamento Iso Max riduce la dispersione del calore verso l’esterno e mantiene una temperatura di circa 40 °C (104 °F) sulla superficie del forno, per la massima sicurezza nell’ambiente di lavoro.<\/p>\n<\/div>\n<\/article>\n<\/div>\n<\/section>\n\n\n\n<section class=\"sb-sec\" id=\"dati\" aria-labelledby=\"t-dati\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Dati essenziali<\/div><div class=\"content\"><h2 class=\"sb-h2\" id=\"t-dati\">Le misure di CRATOS.<\/h2><\/div><\/div>\n<div class=\"sb-dati\">\n<aside class=\"sb-cat\" id=\"catalogo\" aria-labelledby=\"t-cat\">\n<h3 id=\"t-cat\">Il resto è nel catalogo.<\/h3>\n<p>Versioni, struttura, pannello di controllo, optional e basi: la scheda completa di CRATOS è nel catalogo Gradus 2027.<\/p>\n<a class=\"pill pill-white\" href=\"#\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\"><path d=\"M12 4v11M7 10l5 5 5-5M5 20h14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span>Scarica il catalogo<\/span><\/a>\n<a class=\"lnk\" href=\"#richiesta\" onClick=\"{{goSez}}\">Oppure richiedi informazioni<\/a>\n<\/aside><div class=\"sb-dati-t\"><table class=\"sb-table sb-table--one\"><caption class=\"sf-sr\">Dati essenziali di CRATOS<\/caption><tbody><tr><th scope=\"row\">Camera di cottura (L × P × H)<\/th><td>930 × 945 × 180 mm<\/td><\/tr><tr><th scope=\"row\">Dimensioni esterne (L × P × H)<\/th><td>1600 × 1635 × 1380 mm<\/td><\/tr><tr><th scope=\"row\">Bocca (L × H)<\/th><td>525 × 150 mm<\/td><\/tr><tr><th scope=\"row\">Alimentazione<\/th><td>AC 400 V 3N 50/60 Hz<\/td><\/tr><tr><th scope=\"row\">Potenza installata<\/th><td>15,25 kW<\/td><\/tr><tr><th scope=\"row\">Pizze per infornata<\/th><td>9 da ø 30 cm<br>5 da ø 35 cm<br>4 da ø 45 cm<\/td><\/tr><tr><th scope=\"row\">Teglie 60 × 40 cm<\/th><td>3<\/td><\/tr><tr><th scope=\"row\">Peso del forno<\/th><td>510 kg<\/td><\/tr><\/tbody><\/table><p class=\"sb-table-note\">Supporto e cella di lievitazione: altezza 785 mm.<\/p><\/div>\n\n<\/div>\n<\/div>\n<\/section>\n<section class=\"sf-req-sec\" id=\"richiesta\" aria-labelledby=\"t-req\">\n<div class=\"wrap sf-req\">\n<div class=\"sf-req-txt\">\n<h2 id=\"t-req\">Parla di CRATOS con il team Gradus.<\/h2>\n<p>Raccontaci cosa produci e quanto: ti aiutiamo a scegliere versione, finitura e base, e ti inviamo il catalogo completo.<\/p>\n<ol class=\"sf-steps\">\n<li>Compili la richiesta, bastano un minuto e quattro campi.<\/li>\n<li>Il team Gradus ti ricontatta per capire volumi e spazi.<\/li>\n<li>Ricevi la configurazione e l’offerta.&nbsp;<\/li>\n<\/ol>\n<\/div>\n<div class=\"sf-form-box\" aria-live=\"polite\">\n<sc-if value=\"{{formOn}}\" hint-placeholder-val=\"{{ true }}\">\n<form class=\"sf-form\" novalidate=\"\" onSubmit=\"{{submit}}\">\n<input type=\"hidden\" name=\"forno\" value=\"CRATOS\">\n<p class=\"sf-for\">Richiesta per <b>CRATOS<\/b><\/p>\n<div class=\"sf-field\"><label for=\"sf-nome\">Nome e cognome<span class=\"sf-star\" aria-hidden=\"true\"> *<\/span><\/label><input class=\"sf-in\" id=\"sf-nome\" name=\"nome\" type=\"text\" required=\"\" aria-invalid=\"{{eNomeInv}}\" aria-describedby=\"sf-nome-err\" onBlur=\"{{eNomeBlur}}\" onChange=\"{{eNomeChg}}\" autocomplete=\"name\"><sc-if value=\"{{eNomeOn}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"sf-err\" id=\"sf-nome-err\">{{eNomeMsg}}<\/p><\/sc-if><\/div>\n<div class=\"sf-field\"><label for=\"sf-azienda\">Azienda<span class=\"sf-opt\"> (facoltativo)<\/span><\/label><input class=\"sf-in\" id=\"sf-azienda\" name=\"azienda\" type=\"text\" autocomplete=\"organization\"><\/div>\n<div class=\"sf-field\"><label for=\"sf-email\">Email<span class=\"sf-star\" aria-hidden=\"true\"> *<\/span><\/label><input class=\"sf-in\" id=\"s

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141413">
<meta name="color-scheme" content="dark">
<title>Gradus · Scheda prodotto CRATOS, due proposte</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#141413;--bar:#1d1d1c;--line:#3d3b3a;--muted:#b8b5b2;--red:#c2063a;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:Montserrat,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.vb{flex:0 0 auto;display:flex;align-items:center;gap:20px 28px;flex-wrap:wrap;padding:12px max(20px,env(safe-area-inset-left)) 12px max(20px,env(safe-area-inset-right));background:var(--bar);border-bottom:1px solid var(--line)}
.vb-id{display:flex;align-items:center;gap:16px;min-width:0;margin-right:auto}
.vb-id img{height:26px;width:auto;display:block}
.vb-t{display:flex;flex-direction:column;min-width:0;padding-left:16px;border-left:1px solid var(--line)}
.vb-t b{font-size:15px;font-weight:700;white-space:nowrap}
.vb-t span{font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:#262524;border:1px solid var(--line)}
.seg button{appearance:none;border:0;margin:0;min-height:40px;padding:0 18px;border-radius:999px;background:none;color:#d8d5d2;font:600 14px/1 Montserrat,system-ui,sans-serif;cursor:pointer;touch-action:manipulation;white-space:nowrap;transition:background-color 150ms var(--ease),color 150ms var(--ease)}
.seg button[aria-pressed="true"]{background:#fff;color:#1d1d1c}
.seg button:focus-visible,.vb-open:focus-visible{outline:3px solid #fff;outline-offset:2px}
.seg button .s{display:none}
.vb-open{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 4px;color:#fff;font-size:14px;font-weight:600;text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:6px;white-space:nowrap}
@media (hover:hover) and (pointer:fine){.seg button:not([aria-pressed="true"]):hover{background:rgba(255,255,255,.08);color:#fff}}
.stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage iframe{display:block;border:0;background:#1d1d1c}
.stage[data-device="desktop"] iframe{width:100%;height:100%}
.phone{position:relative;flex:0 0 auto;width:414px;height:868px;padding:12px;border-radius:52px;background:#0b0b0b;box-shadow:0 0 0 1px #3d3b3a,0 30px 80px rgba(0,0,0,.55);transform-origin:50% 50%}
.phone iframe{width:390px;height:844px;border-radius:40px}
.stage[data-device="desktop"] .phone{width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none;transform:none!important}
.stage[data-device="desktop"] .phone iframe{width:100%;height:100%;border-radius:0}
.note{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
.stage[data-device="desktop"] .note{display:none}
/* su un telefono vero: niente cornice, la pagina occupa lo schermo */
@media (max-width:760px){
  .vb{gap:10px;padding-top:10px;padding-bottom:10px}
  .vb-t,.vb-open,#dev{display:none}
  .vb-id{margin-right:0}
  .vb-id img{height:22px}
  .seg{flex:1 1 auto}
  .seg button{flex:1 1 0;padding:0 10px;font-size:13px}
  .seg button .l{display:none}
  .seg button .s{display:inline}
  .phone{width:100%!important;height:100%!important;padding:0!important;border-radius:0!important;box-shadow:none!important;transform:none!important}
  .phone iframe{width:100%!important;height:100%!important;border-radius:0!important}
  .note{display:none}
}
@media (prefers-reduced-motion:reduce){.seg button{transition:none}}
</style>
</head>
<body>
<header class="vb">
  <div class="vb-id"><img src="img/e52b0b2830a177d91570dc5492c7bdab.svg" alt="Gradus, perfect baking" width="160" height="34"><div class="vb-t"><b>Scheda prodotto CRATOS</b><span>Due proposte da approvare</span></div></div>
  <div class="seg" id="prop" role="group" aria-label="Proposta">
    <button type="button" data-p="completa" aria-pressed="true"><span class="l">Proposta 1 · Scheda completa</span><span class="s">Proposta 1</span></button>
    <button type="button" data-p="vetrina" aria-pressed="false"><span class="l">Proposta 2 · Vetrina</span><span class="s">Proposta 2</span></button>
  </div>
  <div class="seg" id="dev" role="group" aria-label="Dispositivo">
    <button type="button" data-d="desktop" aria-pressed="true">Desktop</button>
    <button type="button" data-d="mobile" aria-pressed="false">Mobile</button>
  </div>
  <a class="vb-open" id="open" href="completa/" target="_blank" rel="noopener">Apri a pagina intera</a>
</header>
<main class="stage" id="stage" data-device="desktop">
  <div class="phone" id="phone"><iframe id="frame" title="Anteprima della scheda prodotto CRATOS" src="completa/"></iframe></div>
  <p class="note">Anteprima di lavoro: i link interni e l’invio del modulo non sono attivi.</p>
</main>
<script>
(function () {
  var stage = document.getElementById('stage'), phone = document.getElementById('phone'),
      frame = document.getElementById('frame'), open = document.getElementById('open');
  var st = { p: 'completa', d: 'desktop' };
  function fromHash() {
    var h = (location.hash || '').replace('#', '').split('-');
    if (h[0] === 'completa' || h[0] === 'vetrina') st.p = h[0];
    if (h[1] === 'mobile' || h[1] === 'desktop') st.d = h[1];
  }
  function fit() {
    if (st.d !== 'mobile' || window.innerWidth <= 760) { phone.style.transform = ''; return; }
    var s = Math.min(1, (stage.clientHeight - 56) / 868, (stage.clientWidth - 32) / 414);
    phone.style.transform = 'scale(' + s.toFixed(3) + ')';
  }
  function apply(reload) {
    document.querySelectorAll('#prop button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.p === st.p)); });
    document.querySelectorAll('#dev button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.d === st.d)); });
    stage.dataset.device = st.d;
    var src = st.p + '/';
    if (reload || frame.getAttribute('src') !== src) frame.setAttribute('src', src);
    open.setAttribute('href', src);
    history.replaceState(null, '', '#' + st.p + '-' + st.d);
    fit();
  }
  document.getElementById('prop').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; st.p = b.dataset.p; apply();
  });
  document.getElementById('dev').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.dataset.d === st.d) return;
    st.d = b.dataset.d; apply(true); // ricarico: la pagina deve rileggere la larghezza dello schermo
  });
  window.addEventListener('resize', fit);
  fromHash(); apply();
})();
</script>
</body>
</html>

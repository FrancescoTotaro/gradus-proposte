/* Cosa trovi */
.gp-h2{margin:0;font-size:clamp(32px,3.4vw,48px);line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance;max-width:820px}
.gp-offer{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 40px}
.gp-offer li{display:flex;flex-direction:column;gap:14px;padding:32px 0;border-top:1px solid rgba(255,255,255,.16)}
.gp-offer svg{width:48px;height:48px}
.gp-offer h3{margin:0;font-size:24px;line-height:1.25;font-weight:700}
.gp-offer p{margin:0;font-size:16px;line-height:26px;color:#c9ccce}

/* Chiusure */
.gp-close{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:96px}
.gp-box{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:48px;border-radius:18px;box-sizing:border-box}
.gp-box--red{background:radial-gradient(90% 120% at 85% 110%,#b3123f 0%,#8b0d2b 45%,#4a0718 100%)}
.gp-box--ink{background:#262625}
.gp-box h2{margin:0;font-size:clamp(28px,2.6vw,38px);line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.gp-box p{margin:0;font-size:17px;line-height:27px;color:rgba(255,255,255,.9);max-width:480px}
.gp-box-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.gp-end{height:96px}

@media (hover:hover) and (pointer:fine){
.pill-red:hover{background:#a40531}
.pill-white:hover{background:#f1ece8}
.pill-line:hover{background:#fff;color:#1d1d1c}
.lnk:hover{text-decoration-thickness:3px;text-underline-offset:8px}
.sf-crumbs a:hover{text-decoration:underline;text-underline-offset:4px}
.gp-item:hover{border-color:rgba(255,255,255,.4)}
.gp-item[data-on="true"]:hover{border-color:#D2003C}
.gp-mk:hover svg{transform:scale(1.2);transform-origin:50% 100%}
}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{transition-property:color,background-color,border-color,opacity!important;transition-duration:var(--dur-fast)!important}
.pill:active,.gp-mk[data-on="true"] svg,.gp-mk:hover svg{transform:none}
}
@media (max-width:1199px){
.gp-finder{grid-template-columns:minmax(0,1fr)}
.gp-map{order:-1;height:640px}
.gp-close{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
.grid2{grid-template-columns:minmax(0,1fr)}
.grid2>.label{padding:24px 0 0}
.grid2>.content{padding:12px 0 0;border-left:0}
.gp-offer{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:767px){
html{scroll-padding-top:90px}
.wrap{padding-left:20px;padding-right:20px}
.gp-hero{padding:120px 0 40px}
.sf-crumbs ol{margin-bottom:16px;font-size:13px}
.gp-h1{font-size:40px;line-height:44px}
.gp-lead{margin-top:20px;font-size:18px;line-height:28px}
.gp-cta .pill{width:100%}
.gp-map{height:480px}
.gp-mk-l{font-size:12px;padding:4px 8px}
.gp-item{padding:20px 18px 16px}
.gp-meta{margin-left:46px}
.gp-offer{margin-top:24px}
.gp-offer li{flex-direction:row;align-items:flex-start;gap:16px;padding:20px 0}
.gp-offer svg{flex:0 0 40px;width:40px;height:40px}
.gp-offer h3{font-size:19px}
.gp-offer p{margin-top:6px;font-size:15px;line-height:24px}
.gp-close{margin-top:64px;gap:12px}
.gp-box{padding:28px 24px}
.gp-box-cta{flex-direction:column;align-self:stretch}
.gp-box-cta .pill{width:100%}
.gp-end{height:64px}
}

/* Apertura con foto: standard delle pagine Servizi (09/11) */
.sh-hero{position:relative;margin-top:-82px;height:720px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#141413}
.sh-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 50%}
.sh-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,20,19,.9) 0%,rgba(20,20,19,.6) 45%,rgba(20,20,19,0) 78%),linear-gradient(180deg,rgba(20,20,19,.55) 0%,rgba(20,20,19,0) 25%,rgba(20,20,19,0) 60%,#1d1d1c 100%)}
.sh-hero .wrap{position:relative;z-index:1;width:100%;padding-bottom:88px}
.sh-hero .gp-lead{color:#fff;max-width:580px}
.sh-hero .gp-geo-msg{color:#e4e7e9}
@media (min-width:1024px){.sh-hero .sh-hero-img{transform:translateX(18%);-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 28%);mask-image:linear-gradient(to right,transparent 0%,#000 28%)}}
@media (max-width:767px){
.sh-hero{height:min(100svh,844px);min-height:600px}
.sh-hero::after{background:linear-gradient(180deg,rgba(20,20,19,.5) 0%,rgba(20,20,19,0) 22%,rgba(20,20,19,.25) 40%,rgba(20,20,19,.9) 68%,#1d1d1c 100%)}
.sh-hero .wrap{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
}
/* Mobile: foto nella parte alta, così il punto sull'Italia resta sopra il testo (09/11) */
@media (max-width:767px){
.sh-hero .sh-hero-img{height:60%}
.sh-hero::after{background:linear-gradient(180deg,rgba(20,20,19,.5) 0%,rgba(20,20,19,0) 16%,rgba(20,20,19,0) 44%,rgba(20,20,19,.8) 54%,#1d1d1c 60%,#1d1d1c 100%)}
}

 class=\"gp-map-note\">Anteprima statica · sul sito: mappa interattiva © OpenStreetMap © CARTO<\/p>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- COSA TROVI -->\n<section class=\"gp-sec reveal\" id=\"servizi-point\" aria-labelledby=\"t-off\" style=\"padding-top: 104px; height: 355px\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Nei Gradus Point<\/div><div class=\"content\"><h2 class=\"gp-h2\" id=\"t-off\">Cosa trovi in un Gradus Point.<\/h2><\/div><\/div>\n<ul class=\"gp-offer\">\n<li><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><rect x=\"8\" y=\"10\" width=\"32\" height=\"24\" rx=\"3\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"><\/rect><path d=\"M8 18h32M18 40h12M24 34v6\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"><\/path><circle cx=\"24\" cy=\"26\" r=\"3.5\" fill=\"#D2003C\"><\/circle><\/svg><div><h3>Vendita e consulenza<\/h3><p>La gamma Gradus spiegata da chi la conosce, per scegliere il forno giusto per il tuo laboratorio.<\/p><\/div><\/li>\n<li><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><path d=\"M30 8a9 9 0 0 0-9 12L8 33a4 4 0 0 0 6 6l13-13a9 9 0 0 0 12-9l-6 6-6-2-2-6z\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linejoin=\"round\"><\/path><circle cx=\"11\" cy=\"36\" r=\"2\" fill=\"#D2003C\"><\/circle><\/svg><div><h3>Assistenza autorizzata<\/h3><p>Tecnici formati da Gradus per installazione, manutenzione e interventi sul tuo forno.<\/p><\/div><\/li>\n<li><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><path d=\"M24 6l14 8v18l-14 8-14-8V14z\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linejoin=\"round\"><\/path><path d=\"M10 14l14 8 14-8M24 22v18\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"><\/path><circle cx=\"24\" cy=\"22\" r=\"3.5\" fill=\"#D2003C\"><\/circle><\/svg><div><h3>Ricambi originali<\/h3><p>Componenti originali Gradus, con il codice del forno e la matricola.<\/p><\/div><\/li>\n<\/ul>\n<\/div>\n<\/section>\n\n<!-- CHIUSURE -->\n<section class=\"gp-sec reveal\" aria-label=\"Altri contatti\" style=\"padding-top: 0px\">\n<div class=\"wrap\">\n<div class=\"gp-close\">\n<div class=\"gp-box gp-box--red\"><h2>Non c’è un Gradus Point nella tua zona?<\/h2><p>L’assistenza Gradus è diretta: scrivici con il modello e la matricola del forno, oppure chiamaci.<\/p><div class=\"gp-box-cta\"><a class=\"pill pill-white\" href=\"../assistenza/#modulo-assistenza\">Richiedi assistenza<\/a><a class=\"pill pill-line\" href=\"tel:+390722354048\">+39 0722 354048<\/a><\/div><\/div>\n<div class=\"gp-box gp-box--ink\"><h2>Vuoi diventare Gradus Point?<\/h2><p>Se vendi e assisti attrezzature per pizzerie, panetterie e pasticcerie, parliamone.<\/p><div class=\"gp-box-cta\"><a class=\"pill pill-line\" href=\"../rivenditori/\">Diventa partner<\/a><\/div><\/div>\n<\/div>\n<div class=\"gp-end\"><\/div>\n<\/div>\n<\/section>\n<\/main>\n\n<dc-import name=\"Comp-Footer\" style=\"display: contents\" hint-size=\"100%,420px\"><\/dc-import>\n\n<\/div>", function (DCLogic) {

class Component extends DCLogic {
constructor(props) { super(props); this.state = { sel: null, me: null, geoState: 'idle' }; }
list() {
// dalla mappa del sito attuale gradus.restoitalia.it (05/11/2026); x e y sono la posizione sulla mappa illustrata
return [
{ name: 'Ferrari Grandi Cucine', city: 'Angolo Terme (BS)', addr: 'Ferrari Battista & C. Snc, Località Bià Sot, 25040 Angolo Terme (BS)', lat: 45.88996, lng: 10.15988, x: '32.57%', y: '17.80%', gmaps: 'https://maps.app.goo.gl/MXDtRzHjbcEPvK3SA' },
{ name: 'Master Sanremo S.r.l.', city: 'Sanremo (IM)', addr: 'Via Peirogallo 1, 18038 Sanremo (IM)', lat: 43.82156, lng: 7.78302, x: '15.59%', y: '35.47%', gmaps: 'https://maps.app.goo.gl/ke8AoPZLTpsRE8n36' },
{ name: 'DINAMICA SRL', city: 'Conversano (BA)', addr: 'Via O. Marangelli 9, Zona Artigianale, 70014 Conversano (BA)', lat: 40.97484, lng: 17.10390, x: '82.17%', y: '58.81%', gmaps: 'https://maps.app.goo.gl/VWui9pjvLt924oQAA' },
{ name: 'Farc Noleggio attrezzature', city: 'Messina (ME)', addr: 'Via Giuseppe Franza 11, 98124 Messina (ME)', lat: 38.16074, lng: 15.54199, x: '71.01%', y: '80.91%', gmaps: 'https://maps.app.goo.gl/376pDfdkw5qemYVx8' },
{ name: 'SEAN GROUP SRL', city: 'Giarre (CT)', addr: 'Via Vincenzo Pagano 5, 95014 Giarre (CT)', lat: 37.69473, lng: 15.17331, x: '68.38%', y: '84.49%', gmaps: 'https://maps.app.goo.gl/L3pqMD3rBM7Tw1mY8' }
];
}
km(a, b) {
const r = (d) => d * Math.PI / 180, R = 6371;
const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
return 2 * R * Math.asin(Math.sqrt(h));
}
geo(e) {
const win = (e && e.currentTarget && e.currentTarget.ownerDocument.defaultView) || window;
const nav = win.navigator;
if (!nav || !nav.geolocation) { this.setState({ geoState: 'na' }); return; }
this.setState({ geoState: 'wait' });
nav.geolocation.getCurrentPosition(
(pos) => this.setState({ me: { lat: pos.coords.latitude, lng: pos.coords.longitude }, geoState: 'ok' }),
() => this.setState({ geoState: 'no' }),
{ timeout: 8000, maximumAge: 600000 }
);
}
renderVals() {
const s = this.state;
let pts = this.list().map((p) => Object.assign({}, p));
if (s.me) { pts.forEach((p) => { p.km = this.km(s.me, p); }); pts.sort((a, b) => a.km - b.km); }
const msgs = { idle: '', wait: 'Cerco la tua posizione…', ok: 'Elenco ordinato dal più vicino.', no: 'Non abbiamo accesso alla tua posizione: scegli il centro dall’elenco o dalla mappa.', na: 'Il browser non condivide la posizione: scegli il centro dall’elenco o dalla mappa.' };
const selName = s.sel !== null ? s.sel : (s.me && pts[0] ? pts[0].name : null);
return {
geo: (e) => this.geo(e),
geoLbl: s.geoState === 'ok' ? 'Aggiorna la posizione' : 'Trova il più vicino',
geoMsg: msgs[s.geoState] || '',
points: pts.map((p, i) => ({
n: String(i + 1), name: p.name, city: p.city, addr: p.addr, gmaps: p.gmaps, x: p.x, y: p.y,
on: p.name === selName ? 'true' : 'false', onB: p.name === selName,
hasDist: typeof p.km === 'number', dist: typeof p.km === 'number' ? 'a ' + Math.round(p.km).toLocaleString('it-IT') + ' km' : '',
pick: () => this.setState({ sel: this.state.sel === p.name ? null : p.name })
}))
};
}
}

return Component;
});
DCLite.mount("Servizi-Gradus-Point");
</script>

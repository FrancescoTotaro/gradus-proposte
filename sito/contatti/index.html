/* Apertura */
.ct-hero{position:relative;margin-top:-82px;padding:168px 0 72px;background:radial-gradient(55% 90% at 88% 0%,rgba(194,6,58,.42) 0%,rgba(139,13,43,.18) 45%,rgba(29,29,28,0) 75%),#1d1d1c}

.ct-h1{margin:0;font-size:72px;line-height:1;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.ct-lead{margin:28px 0 0;font-size:20px;line-height:32px;color:#e4e7e9;max-width:600px}
.ct-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.ct-direct{padding:32px;border-radius:18px;background:#262625}
.ct-direct h2{margin:0 0 8px;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ct-direct dl{margin:0}
.ct-direct dl>div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--hair)}
.ct-direct dl>div:first-child{border-top:0}
.ct-direct svg.ct-ico{width:24px;height:24px;margin-top:2px}
.ct-direct dt{font-size:13px;line-height:18px;color:#c9ccce}
.ct-direct dd{margin:4px 0 0;font-size:18px;line-height:27px;font-weight:600}
.ct-direct dd a{display:inline-flex;align-items:center;min-height:32px}

/* Modulo */
.ct-sec{padding:96px 0 0}
.ct-h2{margin:0;font-size:clamp(32px,3.4vw,48px);line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance;max-width:820px}
.ct-intro{margin:20px 0 0;font-size:19px;line-height:1.6;color:#e4e7e9;max-width:640px}
.ct-form-wrap{margin-top:48px;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:40px;align-items:start}
.ct-aside{position:sticky;top:112px;display:flex;flex-direction:column;gap:16px}
.ct-steps{list-style:none;margin:0;padding:0;counter-reset:p}
.ct-steps li{counter-increment:p;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:16px 0;border-top:1px solid var(--hair);font-size:16px;line-height:25px;color:#e4e7e9}
.ct-steps li::before{content:counter(p,decimal-leading-zero);font-size:24px;line-height:1;font-weight:800;color:#D2003C;font-variant-numeric:tabular-nums}
.ct-box{padding:40px;border-radius:18px;background:#262625}

/* Scelta del motivo */
.ct-reasons{margin:0;padding:0;border:0;min-width:0}
.ct-reasons legend{padding:0;margin:0 0 16px;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

.ct-reason{position:relative;display:flex;flex-direction:column;gap:10px;min-height:120px;padding:16px;box-sizing:border-box;border-radius:14px;background:#1d1d1c;border:1.5px solid rgba(255,255,255,.18);cursor:pointer;transition:border-color var(--dur-fast) var(--ease-out),background-color var(--dur-fast) var(--ease-out)}

.ct-reason svg{width:32px;height:32px}
.ct-reason b{font-size:15px;line-height:20px;font-weight:700}
.ct-reason[data-on="true"]{border-color:#D2003C;background:#2f2e2d;box-shadow:inset 0 0 0 1px #D2003C}
.ct-reason:has(input:focus-visible){outline:3px solid #fff;outline-offset:3px}

/* Campi */
.ct-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 20px;margin-top:36px;padding-top:32px;border-top:1px solid var(--hair)}
.ct-for{grid-column:1/-1;margin:0;font-size:15px;color:#c9ccce}
.ct-for b{color:#fff}
.ct-f{display:flex;flex-direction:column;gap:8px;min-width:0}
.ct-f--full{grid-column:1/-1}
.ct-f label,.ct-f .ct-lbl{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.ct-star{color:#fff}
.ct-opt{font-weight:500;text-transform:none;letter-spacing:0;color:#c9ccce}
.ct-in{width:100%;min-height:52px;padding:12px 16px;box-sizing:border-box;border-radius:10px;border:1.5px solid #8a9096;background:#1d1d1c;font-size:16px;line-height:24px;transition:border-color var(--dur-fast) var(--ease-out)}
select.ct-in{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;background-size:18px;padding-right:44px}
textarea.ct-in{min-height:140px;resize:vertical}
.ct-in:focus{outline:3px solid #fff;outline-offset:2px;border-color:#fff}
.ct-in[aria-invalid="true"]{border:2px solid #D2003C}
.ct-hint{margin:0;font-size:13px;line-height:20px;color:#c9ccce}
.ct-err{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:14px;line-height:20px;color:#fff}
.ct-err::before{content:"!";flex:0 0 auto;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#D2003C;font-size:13px;font-weight:800;line-height:1}
.ct-check{grid-column:1/-1;display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start}
.ct-check input{width:22px;height:22px;margin:1px 0 0;accent-color:#c2063a}
.ct-check label{font-size:15px;line-height:24px;color:#e4e7e9;text-transform:none;letter-spacing:0;font-weight:400}
.ct-check .ct-err{grid-column:2}
.ct-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:8px}
.ct-req-note{margin:0;font-size:13px;color:#c9ccce}
.ct-alert{grid-column:1/-1;display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:16px 18px;border-radius:12px;border:2px dashed #D2003C;background:#3d1620}
.ct-alert::before{content:"!";display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#D2003C;font-size:13px;font-weight:800}
.ct-alert b{display:block;font-size:16px}
.ct-alert p{margin:4px 0 0;font-size:15px;line-height:24px}

/* Assistenza: rimando */
.ct-assist{margin-top:36px;padding:32px;border-radius:16px;background:radial-gradient(90% 120% at 85% 110%,#b3123f 0%,#8b0d2b 45%,#4a0718 100%)}
.ct-assist h3{margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.ct-assist p{margin:12px 0 0;font-size:17px;line-height:27px;color:rgba(255,255,255,.92);max-width:560px}
.ct-assist-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}

/* Conferma */
.ct-ok{display:flex;flex-direction:column;gap:16px}
.ct-ok-badge{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;padding:6px 14px 6px 8px;border-radius:999px;background:#12331f;color:#3fbf82;font-size:14px;font-weight:700}
.ct-ok-badge svg{width:22px;height:22px}
.ct-ok h3{margin:0;font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.ct-ok p{margin:0;font-size:17px;line-height:27px;color:#e4e7e9;max-width:560px}
.ct-recap{margin:8px 0 0;border-top:1px solid var(--hair)}
.ct-recap>div{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--hair)}
.ct-recap dt{font-size:14px;color:#c9ccce}
.ct-recap dd{margin:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.ct-ok-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}

/* Sedi */
.ct-sedi{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;margin-top:48px;align-items:stretch}
.ct-sedi-l{display:flex;flex-direction:column;gap:20px}
.ct-sede{padding:32px;border-radius:16px;background:#262625;display:flex;flex-direction:column;gap:12px}
.ct-sede h3{margin:0;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ct-sede address{font-style:normal;font-size:20px;line-height:30px;font-weight:600}
.ct-sede p{margin:0;font-size:15px;line-height:24px;color:#c9ccce}
.ct-sede .lnk{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;font-size:15px}
.ct-map{position:relative;min-height:520px;border-radius:18px;overflow:hidden;background:#121211;border:1px solid rgba(255,255,255,.08)}
.ct-map-img{position:absolute;width:max(260%,1700px);max-width:none;left:50%;top:50%;height:auto;aspect-ratio:2000/2360;transform:translate(-50.69%,-36.25%)}
.ct-map::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px 30px #121211}
.ct-mk{position:absolute;left:50%;top:50%;z-index:2;width:44px;height:66px;margin:-66px 0 0 -22px}
.ct-mk svg{display:block;width:44px;height:66px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.ct-mk-l{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:10px;padding:8px 14px;border-radius:8px;background:#fff;color:#1d1d1c;font-size:14px;line-height:18px;font-weight:700;white-space:nowrap;text-align:center}
.ct-mk-l small{display:block;font-size:12px;font-weight:500;color:#5c5a58}
.ct-map-note{position:absolute;z-index:2;left:16px;bottom:14px;margin:0;font-size:12px;color:#c9ccce}

/* Rimandi */
.ct-links{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.ct-links>li{display:flex}
.ct-link{position:relative;flex:1;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:20px;align-items:center;padding:28px;border-radius:16px;background:#262625;overflow:hidden;isolation:isolate}
.ct-link::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 120% at 100% 100%,rgba(194,6,58,.75),rgba(194,6,58,0) 70%);opacity:0;transition:opacity var(--dur-slow) var(--ease-out)}
.ct-link svg.ct-li{width:44px;height:44px}
.ct-link b{display:block;font-size:22px;line-height:1.2;font-weight:700}
.ct-link small{display:block;margin-top:6px;font-size:15px;line-height:22px;color:#c9ccce}
.ct-round{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;color:#1d1d1c;transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-base) var(--ease-out)}
.ct-link:focus-visible::after{opacity:1}
.ct-end{height:96px}

@media (hover:hover) and (pointer:fine){
.lnk:hover{text-decoration-thickness:3px;text-underline-offset:8px}
.pill-red:hover{background:#a40531}
.pill-white:hover{background:#f1ece8}
.pill-line:hover{background:#fff;color:#1d1d1c}
.sf-crumbs a:hover{text-decoration:underline;text-underline-offset:4px}
.ct-reason:hover{border-color:rgba(255,255,255,.6)}
.ct-reason[data-on="true"]:hover{border-color:#D2003C}
.ct-in:hover{border-color:#fff}
.ct-link:hover::after{opacity:1}
.ct-link:hover .ct-round{background:#c2063a;color:#fff;transform:rotate(-45deg)}
}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{transition-property:color,background-color,border-color,opacity!important;transition-duration:var(--dur-fast)!important}
.pill:active,.ct-link:hover .ct-round{transform:none}
}
@media (max-width:1199px){
.ct-hero-in{grid-template-columns:minmax(0,1fr);gap:40px}
.ct-form-wrap{grid-template-columns:minmax(0,1fr)}
.ct-aside{position:static}
.ct-reasons-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.ct-sedi{grid-template-columns:minmax(0,1fr)}
.ct-links{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
.grid2{grid-template-columns:minmax(0,1fr)}
.grid2>.label{padding:24px 0 0}
.grid2>.content{padding:12px 0 0;border-left:0}
}
@media (max-width:767px){
html{scroll-padding-top:90px}
.wrap{padding-left:20px;padding-right:20px}
.ct-hero{padding:120px 0 40px}
.sf-crumbs ol{margin-bottom:16px;font-size:13px}
.ct-h1{font-size:40px;line-height:44px}
.ct-lead{margin-top:20px;font-size:18px;line-height:28px}
.ct-cta .pill{width:100%}
.ct-direct{padding:24px}
.ct-sec{padding-top:64px}
.ct-intro{font-size:17px}
.ct-form-wrap{margin-top:28px;gap:24px}
.ct-box{padding:20px;border-radius:16px}
.ct-reasons-grid{grid-template-columns:minmax(0,1fr);gap:8px}
.ct-reason{flex-direction:row;align-items:center;min-height:60px;padding:12px 16px;gap:14px}
.ct-reason svg{width:28px;height:28px;flex:0 0 28px}
.ct-form{grid-template-columns:minmax(0,1fr);gap:20px;margin-top:28px;padding-top:24px}
.ct-actions .pill{width:100%}
.ct-assist{padding:24px}
.ct-assist h3{font-size:24px}
.ct-assist-cta{flex-direction:column}
.ct-assist-cta .pill{width:100%}
.ct-recap>div{grid-template-columns:minmax(0,1fr);gap:4px}
.ct-ok-cta .pill{width:100%}
.ct-sedi{margin-top:28px;gap:12px}
.ct-sede{padding:24px}
.ct-sede address{font-size:18px;line-height:28px}
.ct-map{min-height:360px}
.ct-map-img{width:1300px}
.ct-links{gap:12px;margin-top:28px}
.ct-link{grid-template-columns:36px minmax(0,1fr);padding:20px;gap:16px}
.ct-link svg.ct-li{width:36px;height:36px}
.ct-round{display:none}
.ct-end{height:64px}
.sf-sticky{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#1d1d1c;border-top:1px solid #4a4947}
.sf-sticky .pill{display:flex;width:100%;min-height:52px}
#servizi{padding-bottom:84px}
}
#contenuto [tabindex="-1"]:focus{outline:none}
</style>

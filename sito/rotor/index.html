: none; box-shadow: none\"><style>.sb-hero-fig::before,.sb-hero-fig::after{display:none !important;content:none !important}<\/style><\/figure>\n<\/div>\n<\/section>\n\n<dc-import name=\"Comp-Barra-sezione\" voci=\"{{voci}}\" style=\"display: contents\" hint-size=\"100%,65px\"><\/dc-import>\n\n<section class=\"sb-sec sb-intro reveal\" aria-labelledby=\"t-intro\">\n<div class=\"wrap sb-intro-in\">\n<h2 class=\"sb-h2 sb-intro-h\" id=\"t-intro\">Convezione e rotazione: calore uniforme dalla superficie al cuore del prodotto.<\/h2>\n<div class=\"sb-intro-body\">\n<p>ROTOR è il forno a convezione con carrello rotante per le piccole e medie produzioni di pasticceria professionale. Convezione e rotazione distribuiscono il calore su tutto il volume, dai formati piccoli a quelli più grandi, semplici o farciti. Con My Baking ti segue anche nella panificazione con farine a basso o nullo contenuto di glutine, che chiedono una cottura più graduale. Due modelli: ROTOR 710 (7 o 10 teglie) e ROTOR 1518 (15 o 18 teglie).<\/p>\n<dl class=\"sb-facts\">\n<div><dt>Teglie 60 × 40 per carrello<\/dt><dd>fino a 18<\/dd><dd class=\"sb-facts-s\">con ROTOR 1518<\/dd><\/div><div><dt>Risparmio a pieno carico<\/dt><dd>-40%<\/dd><dd class=\"sb-facts-s\">con Eco Power<\/dd><\/div><div><dt>Ricette programmabili<\/dt><dd>99<\/dd><dd class=\"sb-facts-s\">con My Baking<\/dd><\/div><div><dt>Modelli<\/dt><dd>2<\/dd><dd class=\"sb-facts-s\">ROTOR 1518 anche a gas<\/dd><\/div>\n<\/dl>\n<\/div>\n<\/div>\n<\/section><figure class=\"sb-amb reveal\">\n<img src=\"../img/1f1e405331fb88f3630f04729850877f.jpg\" alt=\"Un pasticcere tiene in mano un panettone appena sfornato\" width=\"1972\" height=\"986\" loading=\"lazy\" decoding=\"async\">\n<figcaption class=\"wrap\"><span class=\"sb-amb-k\">ROTOR<\/span><span class=\"sb-amb-t\">Dai formati piccoli ai prodotti farciti, la stessa cottura su ogni teglia.<\/span><\/figcaption>\n<\/figure><section class=\"sb-sec sb-plus reveal\" id=\"plus\" aria-labelledby=\"t-plus\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Plus del prodotto<\/div><div class=\"content\"><h2 class=\"sb-h2\" id=\"t-plus\">Cinque ragioni per sceglierlo.<\/h2><\/div><\/div>\n<ul class=\"sb-plus-grid sb-plus-grid--3\"><li class=\"sb-plus-i\"><a class=\"sb-plus-a\" href=\"#tec-eco-power\" onClick=\"{{goSez}}\"><img src=\"../img/4fd60629acdd78eb9a290c8836002991.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\"><div><h3>Eco Power<\/h3><p>-40% di energia a pieno carico<\/p><\/div><span class=\"sb-plus-go\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\"><path d=\"M12 5v14M6 13l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li><li class=\"sb-plus-i\"><a class=\"sb-plus-a\" href=\"#tec-cottura-3d\" onClick=\"{{goSez}}\"><img src=\"../img/9626b128a4e4f042398b6135a3194953.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\"><div><h3>Cottura 3D<\/h3><p>Convezione e rotazione<\/p><\/div><span class=\"sb-plus-go\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\"><path d=\"M12 5v14M6 13l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li><li class=\"sb-plus-i\"><a class=\"sb-plus-a\" href=\"#tec-my-baking\" onClick=\"{{goSez}}\"><img src=\"../img/12301eb88e6ac983009ad36553a6cd1f.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\"><div><h3>My Baking<\/h3><p>99 ricette programmabili<\/p><\/div><span class=\"sb-plus-go\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\"><path d=\"M12 5v14M6 13l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li><li class=\"sb-plus-i\"><a class=\"sb-plus-a\" href=\"#tec-bread-ready\" onClick=\"{{goSez}}\"><img src=\"../img/15ff68ba79e2d147817db8f27068947e.svg\" alt=\"\" width=\"56\" height=\"62\" loading=\"lazy\"><div><h3>Bread Ready<\/h3><p>Anche con farine a basso glutine<\/p><\/div><span class=\"sb-plus-go\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\"><path d=\"M12 5v14M6 13l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li><li class=\"sb-plus-i\"><a class=\"sb-plus-a\" href=\"#tec-40-ready\" onClick=\"{{goSez}}\"><img src=\"../img/05c7393f96b6d85dd4941b5485cf3956.svg\" alt=\"\" width=\"56\" height=\"58\" loading=\"lazy\"><div><h3>4.0 Ready<span class=\"sb-ast\" aria-hidden=\"true\">*<\/span><\/h3><p>Predisposizione per l’industria 4.0<\/p><\/div><span class=\"sb-plus-go\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\"><path d=\"M12 5v14M6 13l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li><\/ul>\n<p class=\"sb-ast-note\"><span aria-hidden=\"true\">*<\/span> Optional<\/p>\n<\/div>\n<\/section>\n\n<section class=\"sb-sec reveal\" id=\"tecnologia\" aria-labelledby=\"t-tec\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Tecnologia<\/div><div class=\"content\"><h2 class=\"sb-h2\" id=\"t-tec\">Come gira il calore.<\/h2><\/div><\/div>\n<article class=\"sb-story sb-story--rev\" id=\"tec-cottura-3d\">\n<div class=\"sb-story-img\"><img src=\"../img/2f271cf89c6a586d96044ac60171af4d.jpg\" alt=\"ROTOR aperto con il carrello pieno di cornetti dorati\" width=\"1600\" height=\"1000\" loading=\"lazy\" decoding=\"async\"><\/div>\n<div class=\"sb-story-txt\">\n<img class=\"sb-story-ico\" src=\"../img/9626b128a4e4f042398b6135a3194953.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\" style=\"width: 90px; height: auto\">\n<h3>Cottura 3D.<\/h3>\n<p>Ventilazione e rotazione insieme distribuiscono il calore in modo omogeneo su tutto il volume della camera: la cottura è uniforme tra il cuore e la superficie del prodotto, su ogni teglia del carrello.<\/p>\n\n<\/div>\n<\/article>\n<article class=\"sb-story\" id=\"tec-eco-power\">\n<div class=\"sb-story-img\"><img src=\"../img/29d6876bdb576df81f6206196173de07.jpg\" alt=\"ROTOR in funzione con il carrello di cornetti visibile dal vetro dello sportello\" width=\"1334\" height=\"833\" loading=\"lazy\" decoding=\"async\"><\/div>\n<div class=\"sb-story-txt\">\n<img class=\"sb-story-ico\" src=\"../img/4fd60629acdd78eb9a290c8836002991.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\" style=\"width: 90px; height: auto\">\n<h3>-40% di energia a pieno carico.<\/h3>\n<p>Il sistema Eco Power gestisce la potenza con un risparmio del 40% quando il forno lavora a pieno carico, senza togliere prestazioni. L’isolamento air-jacket limita la dispersione del calore.<\/p>\n\n<\/div>\n<\/article>\n<article class=\"sb-story sb-story--rev\" id=\"tec-my-baking\">\n<div class=\"sb-story-img\"><img src=\"../img/84ba8ab393717707eca8602fc41680ca.jpg\" alt=\"La mano di un pasticcere sul pannello touch di ROTOR, che segna 170 gradi\" width=\"1600\" height=\"1000\" loading=\"lazy\" decoding=\"async\"><\/div>\n<div class=\"sb-story-txt\">\n<img class=\"sb-story-ico\" src=\"../img/12301eb88e6ac983009ad36553a6cd1f.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\" style=\"width: 90px; height: auto\">\n<h3>99 ricette, a un tocco.<\/h3>\n<p>Con My Baking salvi la ricetta una volta e la richiami con un tocco, fino a 99 programmi, con programmi distinti per pane e pasticceria.<\/p>\n<\/div>\n<\/article>\n<div class=\"grid2 sb-more\"><div class=\"label\" id=\"t-more\">Altre tecnologie di ROTOR<\/div><div class=\"content\"><ul class=\"sb-more-grid\" aria-labelledby=\"t-more\"><li class=\"sb-plus-i\" id=\"tec-bread-ready\"><img src=\"../img/15ff68ba79e2d147817db8f27068947e.svg\" alt=\"\" width=\"56\" height=\"62\" loading=\"lazy\"><div><h3>Bread Ready<\/h3><p>Pensato per cuocere il pane con farine integrali e senza glutine, che chiedono una cottura più graduale e delicata.<\/p><\/div><\/li><li class=\"sb-plus-i\" id=\"tec-40-ready\"><img src=\"../img/05c7393f96b6d85dd4941b5485cf3956.svg\" alt=\"\" width=\"56\" height=\"58\" loading=\"lazy\"><div><h3>4.0 Ready (optional)<\/h3><p>Pronto per l’industria 4.0: dati di cottura e consumi consultabili da remoto.<\/p><\/div><\/li><\/ul><\/div><\/div>\n<\/div>\n<\/section>\n\n<section class=\"sb-sec reveal\" id=\"dati\" aria-labelledby=\"t-dati\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Dati essenziali<\/div><div class=\"content\"><h2 class=\"sb-h2\" id=\"t-dati\">Le misure di ROTOR.<\/h2><\/div><\/div>\n<div class=\"sb-dati\">\n<aside class=\"sb-cat\" id=\"catalogo\" aria-labelledby=\"t-cat\">\n<h3 id=\"t-cat\">Il resto è nel catalogo.<\/h3>\n<p>Struttura, pannello di controllo, cella di lievitazione e optional: la scheda completa di ROTOR è nel catalogo Gradus 2027.<\/p>\n<a class=\"pill pill-white\" href=\"#\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\"><path d=\"M12 4v11M7 10l5 5 5-5M5 20h14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span>Scarica il catalogo<\/span><\/a>\n<a class=\"lnk\" href=\"#richiesta\" onClick=\"{{goSez}}\">Oppure richiedi informazioni<\/a>\n<\/aside><div class=\"sb-dati-t\"><p class=\"sb-tscroll-hint\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\"><path d=\"M4 12h16M14 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>Scorri la tabella per vedere tutti i modelli<\/p><div class=\"sb-tscroll\" role=\"region\" aria-labelledby=\"t-tab\" tabindex=\"0\"><table class=\"sb-table2\"><caption class=\"sf-sr\" id=\"t-tab\">Dati essenziali dei modelli ROTOR<\/caption><thead><tr><th scope=\"col\"><span class=\"sf-sr\">Dato<\/span><\/th><th scope=\"col\"><span>ROTOR<\/span>710<\/th><th scope=\"col\"><span>ROTOR<\/span>1518 E<\/th><th scope=\"col\"><span>ROTOR<\/span>1518 G<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Alimentazione<\/th><td>Elettrica<\/td><td>Elettrica<\/td><td>Gas<\/td><\/tr><tr><th scope=\"row\">Dimensioni esterne (L × P × H, mm)<\/th><td>960 × 1350 × 1930<\/td><td>980 × 1190 × 2230<\/td><td>980 × 1500 × 2230<\/td><\/tr><tr><th scope=\"row\">Potenza<\/th><td>9,8 kW<\/td><td>23,5 kW<\/td><td>29.000 kcal max<\/td><\/tr><tr><th scope=\"row\">Tensione<\/th><td>AC 400 V 3N 50/60 Hz<\/td><td>AC 400 V 3N 50/60 Hz<\/td><td>AC 400 V 50/60 Hz<\/td><\/tr><tr><th scope=\"row\">Teglie 60 × 40 cm<\/th><td>7 o 10<\/td><td>15 o 18<\/td><td>15 o 18<\/td><\/tr><tr><th scope=\"row\">Distanza tra le teglie<\/th><td>100 o 75 mm<\/td><td>97 o 81 mm<\/td><td>97 o 81 mm<\/td><\/tr><tr><th scope=\"row\">Peso<\/th><td>410 kg con cella<\/td><td>550 kg<\/td><td>650 kg<\/td><\/tr><\/tbody><\/table><\/div><p class=\"sb-table-note\">Cella di lievitazione di ROTOR 710: 960 × 1200 × 580 mm, 1,0 kW, AC 230 V 1N 50/60 Hz, 4 teglie.<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<dc-import name=\"Comp-Richiesta\" forno=\"ROTOR\" titolo=\"Parla di ROTOR con il team Gradus.\" testo=\"Raccontaci cosa produci e quanto: ti aiutiamo a scegliere modello, alimentazione e cella di lievitazione, e ti inviamo il catalogo completo.\" style=\"display: contents\" hint-size=\"100%,969px\"><\/dc-import>\n<dc-import name=\"Comp-Altri-forni\" escludi=\"ROTOR\" style=\"display: contents\" hint-size=\"100%,756px\"><\/dc-import>\n<\/main>\n<div class=\"sf-sticky\"><a class=\"pill pill-red\" href=\"#richiesta\" onClick=\"{{goSez}}\">Richiedi informazioni<\/a><\/div>\n\n<dc-import name=\"Comp-Footer\" style=\"display: contents\" hint-size=\"100%,420px\"><\/dc-import>\n\n<\/div>", function (DCLogic) {

class Component extends DCLogic {
constructor(props) { super(props); this.state = {}; }
goSez(e) {
const a = e.currentTarget, id = (a.getAttribute('href') || '').slice(1), doc = a.ownerDocument, el = id && doc.getElementById(id);
if (!el) return;
e.preventDefault();
const win = doc.defaultView, head = doc.querySelector('.site-head'), bar = doc.querySelector('.sf-anchors');
// spazio occupato in alto da header e barra di sezione, più un margine di respiro
let off = 16;
if (bar && win.getComputedStyle(bar).position === 'sticky') off += (parseFloat(win.getComputedStyle(bar).top) || 0) + bar.offsetHeight;
else if (head) off += head.offsetHeight;
// contenitore che scorre davvero: il primo antenato con scorrimento verticale, altrimenti la pagina
let box = el.parentElement;
while (box && box !== doc.body && box !== doc.documentElement) { const o = win.getComputedStyle(box).overflowY; if ((o === 'auto' || o === 'scroll') && box.scrollHeight > box.clientHeight) break; box = box.parentElement; }
const soft = win.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
if (!box || box === doc.body || box === doc.documentElement) { win.scrollTo({ top: el.getBoundingClientRect().top + win.scrollY - off, behavior: soft }); }
else { box.scrollTo({ top: el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - off, behavior: soft }); }
if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1');
el.focus({ preventScroll: true });
}

renderVals() {
const p = this.props;
return {
voci: [{ href: '#plus', label: 'Plus' }, { href: '#tecnologia', label: 'Tecnologia' }, { href: '#dati', label: 'Dati essenziali' }],
gGlow: String(p.bagliore ?? 0.85),
gGlowAlt: (p.bagliore_altezza ?? 60) + '%',
gVel: (p.velocita ?? 400) + 'ms',
gScuro: String(p.scuro ?? 0.92),
gScuroIni: (p.scuro_inizio ?? 30) + '%',
goSez: (e) => this.goSez(e),
};
}
}

return Component;
});
DCLite.mount("Scheda-forno-ROTOR");
</script>

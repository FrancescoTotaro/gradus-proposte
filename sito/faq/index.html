['g1', 'g2', 'g3', 'g4'].forEach((k) => { g[k] = all[k].filter(hit); n += g[k].length; tot += all[k].length; });
return {
q: this.state.q,
setQ: (e) => this.setState({ q: e.target.value }),
g1: g.g1, g2: g.g2, g3: g.g3, g4: g.g4,
showG1: g.g1.length > 0, showG2: g.g2.length > 0, showG3: g.g3.length > 0, showG4: g.g4.length > 0,
none: n === 0,
countTxt: q ? (n === 1 ? '1 domanda trovata' : n + ' domande trovate') : tot + ' domande in 4 argomenti'
};
}
}

return Component;
});
DCLite.mount("Servizi-FAQ");
</script>

3\" width=\"29\" height=\"29\"><\/use><\/g><g class=\"rv-n rv-dealer\" style=\"--d:1.50s\"><rect class=\"rv-box\" x=\"129\" y=\"327\" width=\"64\" height=\"64\" rx=\"14\"><\/rect><use href=\"#rv-shop\" x=\"141\" y=\"339\" width=\"40\" height=\"40\"><\/use><\/g><g class=\"rv-n rv-client\" style=\"--d:1.95s\"><rect class=\"rv-box\" x=\"157\" y=\"444\" width=\"46\" height=\"46\" rx=\"11\"><\/rect><use href=\"#rv-pizza\" x=\"166\" y=\"453\" width=\"29\" height=\"29\"><\/use><\/g><g class=\"rv-n rv-client\" style=\"--d:2.15s\"><rect class=\"rv-box\" x=\"80\" y=\"394\" width=\"46\" height=\"46\" rx=\"11\"><\/rect><use href=\"#rv-pagnotta\" x=\"89\" y=\"403\" width=\"29\" height=\"29\"><\/use><\/g><g class=\"rv-n rv-client\" style=\"--d:2.35s\"><rect class=\"rv-box\" x=\"30\" y=\"317\" width=\"46\" height=\"46\" rx=\"11\"><\/rect><use href=\"#rv-torta\" x=\"38\" y=\"325\" width=\"29\" height=\"29\"><\/use><\/g><g class=\"rv-n rv-dealer\" style=\"--d:2.25s\"><rect class=\"rv-box\" x=\"129\" y=\"129\" width=\"64\" height=\"64\" rx=\"14\"><\/rect><use href=\"#rv-shop\" x=\"141\" y=\"141\" width=\"40\" height=\"40\"><\/use><\/g><g class=\"rv-n rv-client\" style=\"--d:2.70s\"><rect class=\"rv-box\" x=\"30\" y=\"157\" width=\"46\" height=\"46\" rx=\"11\"><\/rect><use href=\"#rv-pizza\" x=\"38\" y=\"166\" width=\"29\" height=\"29\"><\/use><\/g><g class=\"rv-n rv-client\" style=\"--d:2.90s\"><rect class=\"rv-box\" x=\"80\" y=\"80\" width=\"46\" height=\"46\" rx=\"11\"><\/rect><use href=\"#rv-pagnotta\" x=\"89\" y=\"89\" width=\"29\" height=\"29\"><\/use><\/g><g class=\"rv-n rv-client\" style=\"--d:3.10s\"><rect class=\"rv-box\" x=\"157\" y=\"30\" width=\"46\" height=\"46\" rx=\"11\"><\/rect><use href=\"#rv-torta\" x=\"166\" y=\"38\" width=\"29\" height=\"29\"><\/use><\/g><\/svg>\n\n<\/figure>\n<\/div>\n<\/section>\n\n<dc-import name=\"Comp-Barra-sezione\" voci=\"{{voci}}\" style=\"display: contents\" hint-size=\"100%,65px\"><\/dc-import>\n\n<!-- COSA RICEVI -->\n<section class=\"rv-sec reveal\" id=\"vantaggi\" aria-labelledby=\"t-vant\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Per i partner<\/div><div class=\"content\"><h2 class=\"rv-h2\" id=\"t-vant\">Cosa ricevi come rivenditore Gradus.<\/h2><p class=\"rv-intro\">Non solo un listino: gli strumenti per presentare la gamma, chiudere la trattativa e seguire il cliente nel tempo.<\/p><\/div><\/div>\n<ul class=\"rv-offer\">\n<li><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><rect x=\"10\" y=\"6\" width=\"28\" height=\"36\" rx=\"3\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"><\/rect><path d=\"M16 16h16M16 23h16M16 30h9\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"><\/path><circle cx=\"33\" cy=\"35\" r=\"6\" fill=\"#D2003C\"><\/circle><path d=\"M30.5 35l1.8 1.8 3.2-3.4\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><div><h3>Listino e condizioni dedicate<\/h3><p>Prezzi e condizioni riservati ai rivenditori, con un referente commerciale Gradus per le tue trattative.<\/p><\/div><\/li>\n<li><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><path d=\"M6 18l18-9 18 9-18 9z\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linejoin=\"round\"><\/path><path d=\"M13 22v9c0 3 5 6 11 6s11-3 11-6v-9\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"><\/path><path d=\"M42 18v12\" stroke=\"#D2003C\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\/path><circle cx=\"42\" cy=\"33\" r=\"2.4\" fill=\"#D2003C\"><\/circle><\/svg><div><h3>Formazione tecnica e commerciale<\/h3><p>Come funzionano i forni, come si installano e come si presentano al cliente: per il tuo team vendite e per i tecnici.<\/p><\/div><\/li>\n<li><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><rect x=\"6\" y=\"10\" width=\"26\" height=\"30\" rx=\"3\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"><\/rect><path d=\"M12 32l6-7 4 4 4-5 6 8\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linejoin=\"round\"><\/path><rect x=\"22\" y=\"6\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#1d1d1c\" stroke=\"#D2003C\" stroke-width=\"2\"><\/rect><path d=\"M30 11v6l4-3z\" fill=\"#D2003C\"><\/path><\/svg><div><h3>Materiali di vendita<\/h3><p>Catalogo, schede tecniche, foto e video della gamma, in italiano e in inglese, pronti per le tue presentazioni.<\/p><\/div><\/li>\n<li><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><rect x=\"6\" y=\"12\" width=\"36\" height=\"26\" rx=\"3\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"><\/rect><path d=\"M6 20h36\" stroke=\"#fff\" stroke-width=\"2\"><\/path><path d=\"M14 30c3-4 7-4 10 0s7 4 10 0\" fill=\"none\" stroke=\"#D2003C\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\/path><\/svg><div><h3>Prove sul prodotto del cliente<\/h3><p>Per le trattative più importanti, una prova di cottura sul prodotto del tuo cliente: il forno si sceglie guardando il risultato.<\/p><\/div><\/li>\n<li><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><path d=\"M30 8a9 9 0 0 0-9 12L8 33a4 4 0 0 0 6 6l13-13a9 9 0 0 0 12-9l-6 6-6-2-2-6z\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linejoin=\"round\"><\/path><circle cx=\"11\" cy=\"36\" r=\"2\" fill=\"#D2003C\"><\/circle><\/svg><div><h3>Assistenza e ricambi<\/h3><p>Supporto tecnico diretto e ricambi originali, per seguire il cliente anche dopo l’installazione.<\/p><\/div><\/li>\n<li><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><path d=\"M24 42s-13-12-13-22a13 13 0 0 1 26 0c0 10-13 22-13 22z\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linejoin=\"round\"><\/path><circle cx=\"24\" cy=\"20\" r=\"5\" fill=\"#D2003C\"><\/circle><\/svg><div><h3>Visibilità come punto Gradus<\/h3><p>Il tuo punto vendita fra i riferimenti Gradus sul sito, così i clienti della tua zona sanno a chi rivolgersi.<\/p><\/div><\/li>\n<\/ul>\n<\/div>\n<\/section>\n\n<!-- ARGOMENTI PER VENDERE -->\n<section class=\"rv-sec reveal\" id=\"gamma\" aria-labelledby=\"t-gamma\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">La gamma<\/div><div class=\"content rv-head\"><div><h2 class=\"rv-h2\" id=\"t-gamma\">Quattro famiglie, un argomento ciascuna.<\/h2><p class=\"rv-intro\">Per ogni forno, il cliente a cui proporlo e la frase con cui iniziare.<\/p><\/div><a class=\"lnk\" href=\"../forni/\">Confronta i forni<\/a><\/div><\/div>\n<ul class=\"rv-fam\">\n<li><a class=\"rv-card\" href=\"../cratos/\"><h3>CRATOS<\/h3><p class=\"rv-per\">Pizzerie napoletane e contemporanee<\/p><p class=\"rv-arg\">Il forno a cupola che si mostra in sala: fino a 515 °C, con la precisione dell’elettrico e finiture nei colori del locale.<\/p><figure><img src=\"../img/36047297d04548ddb78aa113b4540ba9.webp\" alt=\"\" width=\"1084\" height=\"1600\" loading=\"lazy\" decoding=\"async\"><\/figure><\/a><\/li>\n<li><a class=\"rv-card\" href=\"../jack/\"><h3>JACK<\/h3><p class=\"rv-per\">Pizzerie, panetterie e pasticcerie<\/p><p class=\"rv-arg\">Fino a 8 zone indipendenti: si accende solo quello che serve, e se una zona si ferma le altre continuano a cuocere.<\/p><figure><img src=\"../img/516b2adc3d9ef773ac2c8a0c83368c82.webp\" alt=\"\" width=\"1346\" height=\"1600\" loading=\"lazy\" decoding=\"async\"><\/figure><\/a><\/li>\n<li><a class=\"rv-card\" href=\"../modular/\"><h3>MODULAR<\/h3><p class=\"rv-per\">Laboratori che crescono<\/p><p class=\"rv-arg\">Si compone una camera alla volta: il cliente parte da quello che gli serve oggi e aggiunge camere quando cresce la produzione.<\/p><figure><img src=\"../img/013bb481a3aaeaf4cf7147dabd4630d1.webp\" alt=\"\" width=\"1186\" height=\"1600\" loading=\"lazy\" decoding=\"async\"><\/figure><\/a><\/li>\n<li><a class=\"rv-card\" href=\"../rotor/\"><h3>ROTOR<\/h3><p class=\"rv-per\">Panetterie e pasticcerie con volumi<\/p><p class=\"rv-arg\">Convezione e rotazione: la stessa cottura su ogni teglia del carrello, da 7 a 18 teglie, elettrico o a gas.<\/p><figure><img src=\"../img/b01fc8198a8db38cc1539c4e57967a95.webp\" alt=\"\" width=\"748\" height=\"1600\" loading=\"lazy\" decoding=\"async\"><\/figure><\/a><\/li>\n<\/ul>\n<\/div>\n<\/section>\n\n<!-- COME SI DIVENTA PARTNER -->\n<section class=\"rv-sec reveal\" id=\"come\" aria-labelledby=\"t-come\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Come funziona<\/div><div class=\"content\"><h2 class=\"rv-h2\" id=\"t-come\">Come si diventa partner.<\/h2><\/div><\/div>\n<ol class=\"rv-steps\">\n<li><span class=\"rv-num\" aria-hidden=\"true\">01<\/span><h3>Ci scrivi<\/h3><p>Compili la richiesta qui sotto con i dati della tua azienda e la zona in cui lavori.<\/p><\/li>\n<li><span class=\"rv-num\" aria-hidden=\"true\">02<\/span><h3>Ci conosciamo<\/h3><p>Un referente Gradus ti contatta per capire i tuoi clienti, i settori che segui e i volumi.<\/p><\/li>\n<li><span class=\"rv-num\" aria-hidden=\"true\">03<\/span><h3>Definiamo l’accordo<\/h3><p>Condizioni, materiali e formazione: concordiamo insieme come partire.<\/p><\/li>\n<li><span class=\"rv-num\" aria-hidden=\"true\">04<\/span><h3>Vendi con il nostro supporto<\/h3><p>Dalla prima trattativa hai il referente, le prove sul prodotto e l’assistenza Gradus.<\/p><\/li>\n<\/ol>\n<\/div>\n<\/section>\n\n<dc-import name=\"Comp-Richiesta\" forno=\"Rivenditore\" titolo=\"Diventiamo partner.\" testo=\"Raccontaci la tua azienda, la zona in cui lavori e i clienti che segui: ti ricontattiamo per presentarti la gamma e le condizioni per i rivenditori.\" style=\"display: contents\" hint-size=\"100%,969px\"><\/dc-import>\n<\/main>\n<div class=\"sf-sticky\"><a class=\"pill pill-red\" href=\"#richiesta\" onClick=\"{{goSez}}\">Diventa partner<\/a><\/div>\n\n<dc-import name=\"Comp-Footer\" style=\"display: contents\" hint-size=\"100%,420px\"><\/dc-import>\n\n<\/div>", function (DCLogic) {

const soft = win.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

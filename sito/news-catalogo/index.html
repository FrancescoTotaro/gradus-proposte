.ns-box h2{margin:0;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ns-dl p{margin:12px 0 0;font-size:16px;line-height:26px;color:#e4e7e9}
.ns-dl .pill{width:100%;margin-top:20px}
.ns-dl small{display:block;margin-top:10px;font-size:13px;line-height:20px;color:#c9ccce;text-align:center}
.ns-share{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.ns-share .pill{min-height:44px;padding:0 18px;font-size:14px}
.ns-share-ok{margin:12px 0 0;font-size:14px;line-height:20px;color:#e4e7e9}
.ns-ovens{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--hair)}
.ns-ovens li{border-bottom:1px solid var(--hair)}
.ns-ovens a{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;font-size:16px;font-weight:700}
.ns-ovens small{display:block;font-size:13px;line-height:18px;font-weight:500;color:#c9ccce}
.ns-ovens svg{flex:0 0 auto;transition:transform var(--dur-base) var(--ease-out)}

/* Altri aggiornamenti */
.ns-more{padding-top:96px}
.ns-more-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 40px;padding-top:28px;border-top:1px solid var(--hair)}
.ns-more-head h2{margin:0;font-size:clamp(30px,3vw,44px);line-height:1.1;font-weight:700;letter-spacing:-.03em}
.ns-more-head .lnk{font-size:15px;display:inline-flex;align-items:center;min-height:44px}
.ns-cards{list-style:none;margin:40px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.ns-card{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:center}
.ns-card-img{aspect-ratio:4/3;border-radius:14px;display:grid;place-items:center;padding:12px;box-sizing:border-box;text-align:center;font-size:13px;color:#c9ccce;background:repeating-linear-gradient(135deg,#262625 0 14px,#2c2b2a 14px 28px);overflow:hidden}
.ns-card-img img{width:100%;height:100%;object-fit:cover;display:block}
.ns-card-img--photo{padding:0}
.ns-card .ns-meta{font-size:13px}
.ns-card h3{margin:10px 0 0;font-size:22px;line-height:1.25;font-weight:700}
.ns-card span.lnk{display:inline-block;margin-top:12px;font-size:15px}
.ns-end{height:96px}

@media (hover:hover) and (pointer:fine){
.lnk:hover{text-decoration-thickness:3px;text-underline-offset:8px}
.pill-red:hover{background:#a40531}
.pill-white:hover{background:#f1ece8}
.pill-line:hover{background:#fff;color:#1d1d1c}
.sf-crumbs a:hover{text-decoration:underline;text-underline-offset:4px}
.ns-back:hover svg{transform:translateX(-4px)}
.ns-ovens a:hover svg{transform:translateX(4px)}
.ns-card:hover .lnk{text-decoration-thickness:3px;text-underline-offset:8px}
}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{transition-property:color,background-color,border-color,text-decoration-color,opacity!important;transition-duration:var(--dur-fast)!important}
.pill:active,.ns-back:hover svg,.ns-ovens a:hover svg{transform:none}
}
@media (max-width:1199px){
.ns-body-in{grid-template-columns:minmax(0,1fr);gap:48px}
.ns-side{position:static}
.ns-cards{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:767px){
html{scroll-padding-top:90px}
.wrap{padding-left:20px;padding-right:20px}
.ns-hero{padding:116px 0 32px}
.sf-crumbs ol{margin-bottom:12px;font-size:13px}
.ns-h1{font-size:36px;line-height:40px}
.ns-lead{margin-top:20px;font-size:18px;line-height:28px}
.ns-sec{padding-top:40px}
.ns-art>p{font-size:17px;line-height:28px}
.ns-art h2{margin-top:40px;font-size:26px}
.ns-brief{padding:24px;margin-bottom:40px}
.ns-quote p{font-size:21px}
.ns-box{padding:24px}
.ns-more{padding-top:64px}
.ns-cards{margin-top:28px;gap:28px}
.ns-card{grid-template-columns:minmax(0,1fr);gap:16px}
.ns-card-img{aspect-ratio:16/10}
.ns-end{height:64px}
.sf-sticky{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#1d1d1c;border-top:1px solid #4a4947}
.sf-sticky .pill{display:flex;width:100%;min-height:52px}
}
/* Altezza dell'apertura come la variante evento: 750 desktop, 700 tablet, 650 mobile */
.ns-hero{box-sizing:border-box;min-height:0!important;max-height:none!important}
@media (min-width:1200px){.ns-hero{height:750px!important}}
@media (min-width:768px) and (max-width:1199px){.ns-hero{height:700px!important}.ns-hero-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:40px!important}.ns-hero-grid>.ns-hero-photo{grid-column:2!important;grid-row:1 / span 5!important;margin:0!important}}
@media (max-width:767px){.ns-hero{height:650px!important}.ns-hero-grid>.ns-hero-photo{aspect-ratio:16 / 9!important;grid-row:1!important;margin:0 0 20px!important}}
.ns-hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:64px;align-items:center;align-content:center}
.ns-hero-grid>*{grid-column:1}
.ns-hero-grid>.ns-hero-photo{grid-column:2;grid-row:1 / span 5;align-self:center}
@media (max-width:1023px){.ns-hero-grid{grid-template-columns:minmax(0,1fr)}.ns-hero-grid>.ns-hero-photo{grid-column:1;grid-row:6;margin:32px 0 0}}
/* Hover sulle schede: bordo e bagliore come nei form */
.ns-card-img{outline:1px solid transparent;outline-offset:0;transition:outline-color 250ms cubic-bezier(.2,.8,.2,1),box-shadow 250ms cubic-bezier(.2,.8,.2,1)}
@media (hover:hover) and (pointer:fine){.ns-card:hover .ns-card-img{outline-color:#D52F5D;box-shadow:0 0 32px 4px rgba(213,47,93,.22)}}
</style>

DCLite.define("Gradus-News-Catalogo", "<div style=\"min-width:320px;background:#1d1d1c;color:#fff;font-family:'Montserrat',system-ui,sans-serif\">\n\n<dc-import name=\"Comp-Header\" style=\"display: contents\" hint-size=\"100%,81px\"><\/dc-import>\n<main id=\"contenuto\">\n\n<!-- 19B GRADUS: NEWS, DETTAGLIO (variante news) -->\n<article aria-labelledby=\"ns-titolo\">\n<header class=\"ns-hero\" style=\"position: relative; height: 750px; display: flex; align-items: center; overflow: hidden\">\n<div class=\"wrap ns-hero-grid\" style=\"position: relative; z-index: 1; width: 100%\">\n<img src=\"../img/22d7f9f753fcbb07655e54c45e0f40b6.jpg\" alt=\"Il catalogo Gradus 2027 aperto sul bancone di una pizzeria, tra impasto, pomodoro e mozzarella\" width=\"2000\" height=\"1131\" fetchpriority=\"high\" style=\"display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; object-position: 55% 50%; border-radius: 12px\" class=\"ns-hero-photo\">\n<nav class=\"sf-crumbs\" aria-label=\"Percorso\"><ol><li><a href=\"../home/\">Home<\/a><\/li><li><a href=\"../gradus/\">Gradus<\/a><\/li><li><a href=\"../news/\">News &amp; Eventi<\/a><\/li><li><span aria-current=\"page\">Catalogo 2027<\/span><\/li><\/ol><\/nav>\n<a class=\"ns-back\" href=\"../news/\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\"><path d=\"M19 12H5M11 6l-6 6 6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>Torna a News &amp; Eventi<\/a>\n<p class=\"ns-meta\"><span class=\"ns-tag ns-tag--news\">News<\/span><span>Pubblicato il 18/11/2026<\/span><span class=\"ns-meta-sep\" aria-hidden=\"true\"><\/span><span>3 minuti di lettura<\/span><\/p>\n<h1 class=\"ns-h1\" id=\"ns-titolo\" style=\"max-width: 760px\">È online il catalogo Gradus 2027.<\/h1>\n<p class=\"ns-lead\" style=\"max-width: 620px\">Quattro famiglie di forni, nuove tecnologie e tutte le misure aggiornate. Il catalogo si scarica gratis, in italiano e in inglese.<\/p>\n<\/div>\n<\/header>\n\n<section class=\"ns-sec reveal\" aria-label=\"Articolo\">\n<div class=\"wrap ns-body-in\">\n<div class=\"ns-art\">\n<p>Il nuovo catalogo raccoglie in un solo volume CRATOS, JACK, MODULAR e ROTOR, i forni Gradus per pizzeria, panetteria e pasticceria. Per ogni famiglia ci sono i plus del prodotto, i modelli e i dati tecnici, con una pagina di apertura dedicata.<\/p>\n\n<h2>Le novità di CRATOS<\/h2>\n<p>Il forno a cupola elettrico ora è in due modelli: CRATOS 6 e CRATOS 9, fino a 9 pizze per infornata. Con Installazione senza limiti la cupola si divide in due parti e passa da una porta di 90 cm: il forno sale ai piani anche dalle scale o con un ascensore standard.<\/p>\n<p>Il design resta iconico e personalizzabile, in mosaico o in resina, nei colori del locale.<\/p>\n\n<blockquote class=\"ns-quote\">\n<p class=\"ns-ph\">«[Citazione di un referente Gradus sul nuovo catalogo.]»<\/p>\n<footer>[Nome e cognome, ruolo]<\/footer>\n<\/blockquote>\n\n<h2>My Baking su tutta la gamma<\/h2>\n<p>Dal pannello touch salvi fino a 99 ricette e le richiami con un tocco: la stessa cottura con ogni operatore e in ogni turno. My Baking ora c’è su tutti e quattro i forni.<\/p>\n\n<figure class=\"ns-fig\"><img src=\"../img/ca9cf0441ee7bf48a731a560ca193148.jpg\" alt=\"JACK a due camere nel laboratorio a vista di una pizzeria\" width=\"2000\" height=\"1116\" loading=\"lazy\" decoding=\"async\"><figcaption>JACK in pizzeria: camere fino a 8 zone indipendenti e Produzione continua.<\/figcaption><\/figure>\n\n<h2>Dove trovarlo<\/h2>\n<p>Il catalogo si scarica dalla pagina <a class=\"lnk\" href=\"../catalogo/\">Catalogo<\/a>, senza registrazione. Per scegliere il forno giusto puoi rivolgerti al tuo rivenditore o al <a class=\"lnk\" href=\"../gradus-point/\">Gradus Point<\/a> più vicino.<\/p>\n<\/div>\n\n<div class=\"ns-side\">\n<section class=\"ns-box ns-dl\" aria-labelledby=\"t-cat\">\n<h2 id=\"t-cat\">Il catalogo 2027<\/h2>\n<p>Tutti i forni, i modelli e i dati tecnici in un PDF.<\/p>\n<a class=\"pill pill-red\" href=\"../catalogo/\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\"><path d=\"M12 4v11M7 10l5 5 5-5M5 20h14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span>Scarica il catalogo<\/span><\/a>\n<small>Italiano e inglese · PDF [peso]<\/small>\n<\/section>\n\n<section class=\"ns-box\" aria-labelledby=\"t-share\">\n<h2 id=\"t-share\">Condividi<\/h2>\n<div class=\"ns-share\">\n<button class=\"pill pill-line\" type=\"button\" onClick=\"{{copia}}\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\"><path d=\"M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\/path><\/svg><span>Copia link<\/span><\/button>\n<a class=\"pill pill-line\" href=\"#\">LinkedIn<\/a>\n<a class=\"pill pill-line\" href=\"#\">WhatsApp<\/a>\n<\/div>\n<p class=\"ns-share-ok\" role=\"status\">{{copiato}}<\/p>\n<\/section>\n\n<section class=\"ns-box\" aria-labelledby=\"t-forni\">\n<h2 id=\"t-forni\">I forni citati<\/h2>\n<ul class=\"ns-ovens\">\n<li><a href=\"../cratos/\"><span>CRATOS<small>Forno elettrico per pizza napoletana e classica<\/small><\/span><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/a><\/li>\n<li><a href=\"../jack/\"><span>JACK<small>Forno statico componibile<\/small><\/span><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/a><\/li>\n<li><a href=\"../modular/\"><span>MODULAR<small>Flessibilità e precisione<\/small><\/span><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/a><\/li>\n<li><a href=\"../rotor/\"><span>ROTOR<small>Forno rotativo a convezione<\/small><\/span><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/a><\/li>\n<\/ul>\n<\/section>\n<\/div>\n<\/div>\n<\/section>\n<\/article>\n\n<section class=\"ns-sec ns-more reveal\" aria-labelledby=\"t-altri\">\n<div class=\"wrap\">\n<div class=\"ns-more-head\"><h2 id=\"t-altri\">Altri aggiornamenti<\/h2><a class=\"lnk\" href=\"../news/\">Tutte le news<\/a><\/div>\n<ul class=\"ns-cards\">\n<li><a class=\"ns-card\" href=\"../news-sigep/\"><div class=\"ns-card-img ns-card-img--photo\"><img src=\"../img/522f8613238c03e741152287ea80820a.jpg\" alt=\"\" width=\"2000\" height=\"1449\" loading=\"lazy\" decoding=\"async\"><\/div><div><p class=\"ns-meta\"><span class=\"ns-tag\">Evento<\/span><span>23–27 gennaio 2027 · Rimini<\/span><\/p><h3>Gradus al Sigep World 2027.<\/h3><p class=\"ns-meta\" style=\"margin-top:8px\">Ci trovi alla 48ª edizione della fiera del foodservice.<\/p><span class=\"lnk\">Vedi l’evento<\/span><\/div><\/a><\/li>\n<li><a class=\"ns-card\" href=\"#\"><div class=\"ns-card-img\">Immagine se disponibile<\/div><div><p class=\"ns-meta\"><span class=\"ns-tag ns-tag--news\">News<\/span><span>[Data]<\/span><\/p><h3>[Titolo della news]<\/h3><p class=\"ns-meta\" style=\"margin-top:8px\">[Estratto breve]<\/p><span class=\"lnk\">Leggi<\/span><\/div><\/a><\/li>\n<\/ul>\n<div class=\"ns-end\"><\/div>\n<\/div>\n<\/section>\n<\/main>\n<div class=\"sf-sticky\"><a class=\"pill pill-red\" href=\"../catalogo/\">Scarica il catalogo<\/a><\/div>\n\n<dc-import name=\"Comp-Footer\" style=\"display: contents\" hint-size=\"100%,420px\"><\/dc-import>\n\n<\/div>", function (DCLogic) {

class Component extends DCLogic {
constructor(props) { super(props); this.state = { copiato: false }; }

}

return Component;
});

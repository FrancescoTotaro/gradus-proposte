<style>
:root{--red:#c2063a;--red-hover:#a40531;--red-on-dark:#D2003C;--hair:rgba(255,255,255,.16);--ease-out:cubic-bezier(.2,.8,.2,1);--dur-fast:150ms;--dur-base:250ms;--dur-slow:400ms}
body{margin:0;font-family:'Montserrat',system-ui,sans-serif;color:#fff;background:#1d1d1c}
html,body{overflow-x:clip}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;scroll-padding-top:150px}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}
a,button{touch-action:manipulation}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));box-sizing:border-box}
.label{font-size:14px;line-height:1.5;font-weight:500;color:#c9ccce}
.lnk{color:#fff;font-weight:600;text-decoration:underline;text-decoration-color:#c2063a;text-decoration-thickness:2px;text-underline-offset:6px;transition:color var(--dur-fast) var(--ease-out)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;box-sizing:border-box;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;-webkit-user-select:none;user-select:none;transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform 120ms var(--ease-out)}
.pill:active{transform:scale(.97)}
.pill-red{background:#c2063a;color:#fff;border:1px solid #e0587c}
.pill-white{background:#fff;color:#1d1d1c}
.pill-line{border:1.5px solid rgba(255,255,255,.7);color:#fff}
.grid2{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);border-top:1px solid var(--hair)}
.grid2>.label{padding:28px 40px 0 0}
.grid2>.content{padding:28px 0 0 40px;min-width:0;border-left:1px solid var(--hair)}
.sf-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
.sf-crumbs ol{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px;padding:0;list-style:none;font-size:14px;line-height:20px;color:rgba(255,255,255,.82)}
.sf-crumbs li+li::before{content:"\203A";margin-right:8px}
.sf-crumbs [aria-current]{color:#fff;font-weight:600}
.sf-sticky{display:none}
@supports (animation-timeline: view()){
@media (prefers-reduced-motion: no-preference){
.reveal{margin-inline:-48px;padding-inline:48px;view-timeline-name:--sezione;animation:reveal-fondo linear both;animation-timeline:--sezione;animation-range:entry 0% entry 70%}
.reveal>.wrap{animation:reveal-zoom linear both;animation-timeline:--sezione;animation-range:entry 0% entry 70%;transform-origin:50% 0}
}
@media (pointer:coarse) and (prefers-reduced-motion:no-preference){.reveal{animation-name:reveal-fondo-m}}
}
@keyframes reveal-fondo{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}
@keyframes reveal-fondo-m{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
@keyframes reveal-zoom{from{transform:scale(.9)}to{transform:none}}
.td-sec.reveal{margin-inline:-48px;padding-inline:48px}
#controllo,#ripetibilita,#performance,#semplicita,#design,#modelli{scroll-margin-top:160px}

/* Apertura con foto */
.td-hero{position:relative;margin-top:-82px;height:760px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#141413}
.td-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 50%}
.td-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,20,19,.92) 0%,rgba(20,20,19,.65) 42%,rgba(20,20,19,0) 75%),linear-gradient(180deg,rgba(20,20,19,.55) 0%,rgba(20,20,19,0) 25%,rgba(20,20,19,0) 60%,#1d1d1c 100%)}
.td-hero .wrap{position:relative;z-index:1;width:100%;padding-bottom:88px}
.td-h1{margin:0;font-size:72px;line-height:1;font-weight:800;letter-spacing:-.03em;max-width:820px;text-wrap:balance}
.td-lead{margin:28px 0 0;font-size:20px;line-height:32px;color:#fff;max-width:600px}
.td-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}

/* Sezioni */
.td-sec{padding:96px 0 0;background:#1d1d1c}
.td-h2{margin:0;font-size:clamp(32px,3.4vw,48px);line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance;max-width:820px}
.td-intro{margin:20px 0 0;font-size:19px;line-height:1.6;color:#e4e7e9;max-width:640px}

/* I quattro criteri in sintesi */
.td-crit{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 32px}
.td-crit li{border-top:1px solid var(--hair)}
.td-crit a{display:flex;flex-direction:column;gap:10px;padding:28px 0 8px;min-height:44px}
.td-crit-n{font-size:32px;line-height:1;font-weight:800;letter-spacing:-.02em;color:#D2003C;font-variant-numeric:tabular-nums}
.td-crit-k{font-size:13px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.td-crit-t{font-size:20px;line-height:1.35;font-weight:700}
.td-crit-arrow{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;font-weight:600;color:#c9ccce;transition:color var(--dur-fast) var(--ease-out)}
.td-crit-arrow svg{transition:transform var(--dur-base) var(--ease-out)}

/* Un blocco per criterio */
.td-story{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:64px;align-items:start;margin-top:56px}
.td-story--rev .td-story-img{order:2}
.td-story-img{position:sticky;top:164px;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:#141413}
.td-story-img img{width:100%;height:100%;object-fit:cover;display:block}
.td-k{display:flex;align-items:baseline;gap:14px;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.td-k b{font-size:32px;line-height:1;font-weight:800;letter-spacing:-.02em;color:#D2003C}
.td-story h2{margin:18px 0 0;font-size:clamp(32px,3.2vw,48px);line-height:1.08;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.td-story-txt>p{margin:18px 0 0;font-size:18px;line-height:1.6;color:#e4e7e9;max-width:520px}
.td-tech{list-style:none;margin:32px 0 0;padding:0;display:flex;flex-direction:column}
.td-tech li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;align-items:start;padding:20px 0;border-top:1px solid rgba(255,255,255,.14)}
.td-tech li:last-child{border-bottom:1px solid rgba(255,255,255,.14)}
.td-tech img,.td-tech svg{width:56px;height:auto;display:block}
.td-tech h3{margin:0;font-size:18px;line-height:1.3;font-weight:700}
.td-tech p{margin:6px 0 0;font-size:15px;line-height:24px;color:#c9ccce}
.td-on{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;padding:0;list-style:none;font-size:13px;line-height:20px;font-weight:700;letter-spacing:.06em}
.td-on a{display:inline-flex;align-items:center;min-height:24px;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-decoration-thickness:1px;text-underline-offset:4px}

/* Tabella tecnologie × forni */
.td-tscroll{margin-top:48px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#c2063a rgba(255,255,255,.12)}
.td-tscroll:focus-visible{outline:3px solid #fff;outline-offset:3px}
.td-table{width:100%;border-collapse:collapse}
.td-table thead th{padding:0 12px 16px;text-align:center;vertical-align:bottom}
.td-table thead th:first-child{text-align:left;padding-left:0}
.td-table thead a{display:inline-flex;flex-direction:column;align-items:center;gap:6px;font-size:18px;font-weight:800;letter-spacing:.06em;transition:color var(--dur-fast) var(--ease-out)}
.td-table thead a span{font-size:12px;font-weight:600;letter-spacing:0;color:#c9ccce;text-decoration:underline;text-decoration-color:#c2063a;text-decoration-thickness:2px;text-underline-offset:4px}
.td-table tbody tr:first-child>*{border-top:1px solid rgba(255,255,255,.16)}
.td-table tbody th,.td-table tbody td{padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.14);font-size:15px;line-height:1.45}
.td-table tbody th{padding-left:0;text-align:left;font-weight:600;width:34%}
.td-table tbody th small{display:block;font-size:13px;font-weight:500;color:#c9ccce}
.td-table tbody td{text-align:center;color:#8a9096}
.td-yes{display:inline-block;width:14px;height:14px;border-radius:50%;background:#D2003C;vertical-align:middle}
.td-opt{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:#fff}
.td-opt::before{content:"";width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px #D2003C}
.td-table-note{margin:14px 0 0;font-size:13px;line-height:20px;color:#c9ccce}
.td-tscroll-hint{display:none}
.td-models-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}

/* Fascia catalogo */
.td-catalogo{margin-top:96px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px;align-items:center;padding:56px;border-radius:18px;background:radial-gradient(90% 120% at 85% 110%,#b3123f 0%,#8b0d2b 45%,#4a0718 100%)}
.td-catalogo h2{margin:0;font-size:clamp(30px,3vw,44px);line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.td-catalogo p{margin:14px 0 0;font-size:17px;line-height:27px;color:rgba(255,255,255,.9);max-width:560px}
.td-catalogo-cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}
.td-end{height:24px}

@media (hover:hover) and (pointer:fine){

.pill-white:hover{background:#f1ece8}

}

*,*::before,*::after{transition-property:color,background-color,border-color,text-decoration-color,opacity!important;transition-duration:var(--dur-fast)!important}

}

@media (max-width:900px){

}

.td-lead{margin-top:20px;font-size:18px;line-height:28px}
.td-cta{margin-top:24px}

.td-sec{padding-top:64px}
.td-intro{font-size:17px}
.td-crit{grid-template-columns:minmax(0,1fr);margin-top:28px}
.td-crit a{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:20px 0}

.td-crit-t{flex-basis:100%;font-size:18px}
.td-crit-arrow{display:none}
.td-story{margin-top:32px;gap:24px}
.td-k b{font-size:26px}
.td-story h2{font-size:30px}
.td-story-txt>p{font-size:17px}

.td-tscroll{margin-right:-20px;padding-right:20px;margin-top:28px}

.td-table th:first-child{position:sticky;left:0;z-index:1;width:150px;min-width:150px;background:#1d1d1c;box-shadow:8px 0 12px -10px rgba(0,0,0,.9)}

.sf-sticky{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#1d1d1c;border-top:1px solid #4a4947}
.sf-sticky .pill{display:flex;width:100%;min-height:52px}
#servizi{padding-bottom:84px}
}
#contenuto [tabindex="-1"]:focus{outline:none}

li della cottura.<\/span><span class=\"td-crit-arrow\" aria-hidden=\"true\">Le tecnologie<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\"><path d=\"M12 5v14M6 13l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li>\n<li><a href=\"#ripetibilita\" onClick=\"{{goSez}}\"><span class=\"td-crit-n\">02<\/span><span class=\"td-crit-k\">Ripetibilità<\/span><span class=\"td-crit-t\">Un buon risultato conta quando puoi ripeterlo.<\/span><span class=\"td-crit-arrow\" aria-hidden=\"true\">Le tecnologie<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\"><path d=\"M12 5v14M6 13l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li>\n<li><a href=\"#performance\" onClick=\"{{goSez}}\"><span class=\"td-crit-n\">03<\/span><span class=\"td-crit-k\">Performance<\/span><span class=\"td-crit-t\">Reggere il picco <br>in ogni situazione.<\/span><span class=\"td-crit-arrow\" aria-hidden=\"true\">Le tecnologie<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\"><path d=\"M12 5v14M6 13l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li>\n<li><a href=\"#semplicita\" onClick=\"{{goSez}}\"><span class=\"td-crit-n\">04<\/span><span class=\"td-crit-k\">Semplicità<\/span><span class=\"td-crit-t\">Più controllo, senza più complessità.<\/span><span class=\"td-crit-arrow\" aria-hidden=\"true\">Le tecnologie<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\"><path d=\"M12 5v14M6 13l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li>\n<\/ol>\n<\/div>\n<\/section>\n\n<!-- 01 CONTROLLO -->\n<section class=\"td-sec reveal\" id=\"controllo\" aria-labelledby=\"t-c1\">\n<div class=\"wrap\">\n<article class=\"td-story\">\n<div class=\"td-story-img\"><img src=\"../img/21bceeb23e6aae26906f90d56039e573.jpg\" alt=\"La mano di un pizzaiolo sul pannello di controllo touch di JACK\" width=\"1600\" height=\"1000\" loading=\"lazy\" decoding=\"async\"><\/div>\n<div class=\"td-story-txt\">\n<p class=\"td-k\"><b>01<\/b>Controllo<\/p>\n<h2 id=\"t-c1\">Gestire le variabili della cottura.<\/h2>\n<p>Temperatura, potenza, tempi, zone e ricette diventano strumenti nelle mani dell’operatore.<\/p>\n<ul class=\"td-tech\">\n<li><img src=\"../img/3d5854579c267a0ee74c1ad5bcdf7367.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\"><div><h3>Gestione separata<\/h3><p>Cielo e platea regolati in modo indipendente, per bilanciare la cottura sopra e sotto il prodotto.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<li><img src=\"../img/43989a857c922dd57fc56facce58bdc3.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\"><div><h3>Eco Zone<\/h3><p>Accendi solo le zone della camera che usi: l’energia segue la quantità di prodotto.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<li><img src=\"../img/ab44bd4f7aed3b1fa1976e5d30454d1c.svg\" alt=\"\" width=\"56\" height=\"62\" loading=\"lazy\"><div><h3>Split Power<\/h3><p>Bilancia la potenza tra la parte anteriore e quella posteriore della camera.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<\/ul>\n<\/div>\n<\/article>\n<\/div>\n<\/section>\n\n<!-- 02 RIPETIBILITÀ -->\n<section class=\"td-sec reveal\" id=\"ripetibilita\" aria-labelledby=\"t-c2\">\n<div class=\"wrap\">\n<article class=\"td-story td-story--rev\">\n<div class=\"td-story-img\"><img src=\"../img/77531c5a825721e82532fcef4f988267.jpg\" alt=\"ROTOR aperto con il carrello pieno di cornetti dorati\" width=\"1600\" height=\"1000\" loading=\"lazy\" decoding=\"async\"><\/div>\n<div class=\"td-story-txt\">\n<p class=\"td-k\"><b>02<\/b>Ripetibilità<\/p>\n<h2 id=\"t-c2\">Un buon risultato conta quando puoi ripeterlo.<\/h2>\n<p>Per tutto il servizio, il giorno dopo, con operatori e volumi diversi.<\/p>\n<ul class=\"td-tech\">\n<li><img src=\"../img/12301eb88e6ac983009ad36553a6cd1f.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\"><div><h3>My Baking<\/h3><p>Fino a 99 ricette salvate e richiamate con un tocco, chiunque sia al forno.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<li><img src=\"../img/9626b128a4e4f042398b6135a3194953.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\"><div><h3>Cottura 3D<\/h3><p>Convezione e rotazione distribuiscono il calore su tutto il volume, teglia dopo teglia.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<li><img src=\"../img/62aced2ed9cced66e865686b34b3cec7.svg\" alt=\"\" width=\"56\" height=\"63\" loading=\"lazy\"><div><h3>Vapor Control<\/h3><p>Gestisce la saturazione del vapore in camera, per pane e lievitati.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<li><img src=\"../img/15ff68ba79e2d147817db8f27068947e.svg\" alt=\"\" width=\"56\" height=\"62\" loading=\"lazy\"><div><h3>Bread Ready<\/h3><p>Cicli di cottura graduali, anche con farine a basso o nullo contenuto di glutine.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<\/ul>\n<\/div>\n<\/article>\n<\/div>\n<\/section>\n\n<!-- 03 PERFORMANCE -->\n<section class=\"td-sec reveal\" id=\"performance\" aria-labelledby=\"t-c3\">\n<div class=\"wrap\">\n<article class=\"td-story\">\n<div class=\"td-story-img\"><img src=\"../img/375b9d332f4b59e679d407d8d56e3af3.webp\" alt=\"Una pizza napoletana in cottura sul piano in biscotto di Sorrento di CRATOS\" width=\"1024\" height=\"687\" loading=\"lazy\" decoding=\"async\"><\/div>\n<div class=\"td-story-txt\">\n<p class=\"td-k\"><b>03<\/b>Performance<\/p>\n<h2 id=\"t-c3\">Reggere il picco.<\/h2>\n<p>Cotture più rapide e potenza gestita meglio: più prodotto nello stesso turno, senza perdere qualità.<\/p>\n<ul class=\"td-tech\">\n<li><img src=\"../img/861096d68c57bcbe0097c748a678cd35.svg\" alt=\"\" width=\"56\" height=\"60\" loading=\"lazy\"><div><h3>515 °C in 85 minuti<\/h3><p>La temperatura della pizza napoletana, raggiunta con la tecnologia elettrica.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<li><img src=\"../img/f96dbf1763d654407cebc3d8f263ea70.svg\" alt=\"\" width=\"56\" height=\"57\" loading=\"lazy\"><div><h3>Biscotto di Sorrento<\/h3><p>Piano di cottura certificato, per le alte temperature della pizza napoletana.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<li><img src=\"../img/4fd60629acdd78eb9a290c8836002991.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\"><div><h3>Eco Power<\/h3><p>Gestisce la potenza a pieno carico e riduce i consumi, senza togliere prestazioni.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<li><img src=\"../img/c6e4a3775f96e8b4f36489eac970d973.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\"><div><h3>Produzione continua<\/h3><p>Le resistenze lavorano su zone indipendenti: se una si ferma, le altre continuano a cuocere.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<\/ul>\n<\/div>\n<\/article>\n<\/div>\n<\/section>\n\n<!-- 04 SEMPLICITÀ -->\n<section class=\"td-sec reveal\" id=\"semplicita\" aria-labelledby=\"t-c4\">\n<div class=\"wrap\">\n<article class=\"td-story td-story--rev\">\n<div class=\"td-story-img\"><img src=\"../img/66492fdb73a579044a300923dc5a0376.jpg\" alt=\"Le mani di un pizzaiolo usano lo smartphone accanto al pannello di controllo di JACK\" width=\"1508\" height=\"943\" loading=\"lazy\" decoding=\"async\"><\/div>\n<div class=\"td-story-txt\">\n<p class=\"td-k\"><b>04<\/b>Semplicità<\/p>\n<h2 id=\"t-c4\">Più controllo, senza più complessità.<\/h2>\n<p>La tecnologia gestisce ciò che è complesso, così il lavoro resta semplice.<\/p>\n<ul class=\"td-tech\">\n<li><img src=\"../img/2607dd4465502f8d5fddbdd106bab0d1.png\" alt=\"\" width=\"56\" height=\"65\" loading=\"lazy\" style=\"height: auto; aspect-ratio: auto; object-fit: contain\"><div><h3>Pannello touch da 5 pollici<\/h3><p>Ogni parametro di cottura su uno schermo a colori, con l’accensione settimanale programmabile.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<li><img src=\"../img/465207eb388b50594f6fecc1278c1251.svg\" alt=\"\" width=\"56\" height=\"56\" loading=\"lazy\"><div><h3>Iso Max<\/h3><p>Isolamento che riduce la dispersione del calore: fuori il forno resta intorno ai 40 °C.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<li><img src=\"../img/36994a79916a1f21d047c3235b54b9c1.svg\" alt=\"\" width=\"56\" height=\"58\" loading=\"lazy\"><div><h3>Kit verticale e leggero<\/h3><p>Il forno a cupola si divide in due parti e passa da una porta di 90 cm.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<li><img src=\"../img/05c7393f96b6d85dd4941b5485cf3956.svg\" alt=\"\" width=\"56\" height=\"58\" loading=\"lazy\"><div><h3>4.0 Ready (optional)<\/h3><p>Predisposizione per l’uso in un processo produttivo di industria 4.0.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<\/ul>\n<\/div>\n<\/article>\n<\/div>\n<\/section>\n\n<!-- DESIGN -->\n<section class=\"td-sec reveal\" id=\"design\" aria-labelledby=\"t-c5\">\n<div class=\"wrap\">\n<article class=\"td-story\">\n<div class=\"td-story-img\"><img src=\"../img/91d8209334ad7669e16f834a29a602cf.jpg\" alt=\"Una mano appoggiata sul mosaico esterno di CRATOS acceso\" width=\"1654\" height=\"1000\" loading=\"lazy\" decoding=\"async\" style=\"object-fit: cover\"><\/div>\n<div class=\"td-story-txt\">\n<p class=\"td-k\">Design<\/p>\n<h2 id=\"t-c5\">Un forno che si vede dalla sala.<\/h2>\n<p>Il forno a vista diventa parte del locale. Colori, materiali e finiture si scelgono sullo stile di chi lo usa.<\/p>\n<ul class=\"td-tech\">\n<li><img src=\"../img/96d5dcfd46e996865476a4c9addc1118.svg\" alt=\"\" width=\"56\" height=\"59\" loading=\"lazy\"><div><h3>Ampia personalizzazione<\/h3><p>CRATOS in mosaico o in resina; JACK sul colore e sullo stile del locale. Tutte le varianti sono nel catalogo.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<li><img src=\"../img/d5b392fbe098e9fd3dd97e24adcfe13f.svg\" alt=\"\" width=\"56\" height=\"59\" loading=\"lazy\"><div><h3>Doppia cupola<\/h3><p>La cupola divisibile in due elementi, per gli accessi più difficili.<\/p><ul class=\"td-on\" aria-label=\"Su quali forni\"><\/ul><\/div><\/li>\n<\/ul>\n<\/div>\n<\/article>\n<\/div>\n<\/section>\n\n<!-- DAL DETTAGLIO AL MODELLO -->\n<section class=\"td-sec reveal\" id=\"modelli\" aria-labelledby=\"t-mod\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Dal dettaglio al modello<\/div><div class=\"content\"><h2 class=\"td-h2\" id=\"t-mod\">Le tecnologie, forno per forno.<\/h2><p class=\"td-intro\">Trova la tecnologia che ti serve e apri la scheda del forno che la monta.<\/p><\/div><\/div>\n<p class=\"td-tscroll-hint\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\"><path d=\"M4 12h16M14 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg>Scorri la tabella per vedere tutti i forni<\/p>\n<div class=\"td-tscroll\" role=\"region\" aria-labelledby=\"t-tab\" tabindex=\"0\">\n<table class=\"td-table\">\n<caption class=\"sf-sr\" id=\"t-tab\">Tecnologie Gradus per forno<\/caption>\n<thead><tr><th scope=\"col\"><span class=\"sf-sr\">Tecnologia<\/span><\/th><th scope=\"col\"><a href=\"../cratos/\">CRATOS<span>Vedi il forno<\/span><\/a><\/th><th scope=\"col\"><a href=\"../jack/\">JACK<span>Vedi il forno<\/span><\/a><\/th><th scope=\"col\"><a href=\"../modular/\">MODULAR<span>Vedi il forno<\/span><\/a><\/th><th scope=\"col\"><a href=\"../rotor/\">ROTOR<span>Vedi il forno<\/span><\/a><\/th><\/tr><\/thead>\n<tbody>\n<tr><th scope=\"row\">Eco Power<small>Performance<\/small><\/th><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><\/tr>\n<tr><th scope=\"row\">My Baking<small>Ripetibilità<\/small><\/th><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><\/tr>\n<tr><th scope=\"row\">Gestione separata<small>Controllo<\/small><\/th><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><\/tr>\n<tr><th scope=\"row\">Split Power<small>Controllo<\/small><\/th><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><\/tr>\n<tr><th scope=\"row\">Eco Zone<small>Controllo<\/small><\/th><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><\/tr>\n<tr><th scope=\"row\">Produzione continua<small>Performance<\/small><\/th><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><\/tr>\n<tr><th scope=\"row\">Biscotto di Sorrento<small>Performance<\/small><\/th><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span class=\"td-opt\">Verace<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><\/tr>\n<tr><th scope=\"row\">Vapor Control<small>Ripetibilità<\/small><\/th><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><\/tr>\n<tr><th scope=\"row\">Cottura 3D<small>Ripetibilità<\/small><\/th><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><\/tr>\n<tr><th scope=\"row\">Bread Ready<small>Ripetibilità<\/small><\/th><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><\/tr>\n<tr><th scope=\"row\">Iso Max<small>Semplicità<\/small><\/th><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><\/tr>\n<tr><th scope=\"row\">Kit verticale e leggero<small>Semplicità<\/small><\/th><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><\/tr>\n<tr><th scope=\"row\">Ampia personalizzazione<small>Design<\/small><\/th><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span class=\"td-yes\"><\/span><span class=\"sf-sr\">Sì<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><td><span aria-hidden=\"true\">–<\/span><span class=\"sf-sr\">No<\/span><\/td><\/tr>\n<tr><th scope=\"row\">4.0 Ready<small>Semplicità<\/small><\/th><td><span class=\"td-opt\">Optional<\/span><\/td><td><span class=\"td-opt\">Optional<\/span><\/td><td><span class=\"td-opt\">Optional<\/span><\/td><td><span class=\"td-opt\">Optional<\/span><\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p class=\"td-table-note\">Il pallino pieno indica la tecnologia di serie; il cerchio vuoto indica una versione o un optional. Il dettaglio per modello è nel catalogo Gradus 2027.<\/p>\n\n\n<div class=\"td-catalogo\">\n<div><h2>Il dettaglio è nel catalogo.<\/h2><p>Versioni, misure, optional e dati tecnici di CRATOS, JACK, MODULAR e ROTOR: li trovi nel catalogo Gradus 2027.<\/p><\/div>\n<div class=\"td-catalogo-cta\"><a class=\"pill pill-white\" href=\"../catalogo/\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\"><path d=\"M12 4v11M7 10l5 5 5-5M5 20h14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span>Scarica il catalogo<\/span><\/a><a class=\"pill pill-line\" href=\"#richies

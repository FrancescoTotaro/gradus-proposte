.cb-risk-ans p{margin:8px 0 0;font-size:16px;line-height:25px;color:#fff}
.cb-method{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:start}
.cb-method-l{position:sticky;top:190px}
.cb-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cb-step{display:grid;grid-template-columns:150px minmax(0,1fr);gap:32px;align-items:start;padding:40px 0;border-top:1px solid rgba(255,255,255,.16)}
.cb-step:first-child{border-top:0;padding-top:0}
.cb-num{font-size:120px;line-height:.85;font-weight:800;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.35)}
.cb-step h3{margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.cb-step p{margin:12px 0 0;font-size:17px;line-height:27px;color:#e4e7e9;max-width:520px}
.cb-step small{display:inline-block;margin-top:14px;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.cb-race{margin-top:56px;padding:48px;border-radius:20px;background:#262625;border:1px solid #D52F5D;box-shadow:0 0 32px 4px rgba(213,47,93,.22)}
.cb-race-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.cb-race-head h3{margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.cb-race-head p{margin:8px 0 0;font-size:15px;line-height:24px;color:#c9ccce;max-width:620px}
.cb-play{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;border:1px solid #e0587c;background:#c2063a;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.cb-clock{margin:36px 0 0;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c9ccce;font-variant-numeric:tabular-nums}
.cb-clock b{font-size:40px;line-height:44px;letter-spacing:-.02em;color:#fff;margin-left:10px}
.cb-lanes{display:flex;flex-direction:column;gap:22px;margin-top:20px}
.cb-lane{display:grid;grid-template-columns:200px minmax(0,1fr) 170px;gap:24px;align-items:center}
.cb-lane-n{font-size:15px;line-height:20px;font-weight:700}
.cb-lane-n small{display:block;margin-top:4px;font-size:13px;font-weight:500;color:#c9ccce}
.cb-track{height:16px;border-radius:999px;background:#1d1d1c;overflow:hidden}
.cb-fill{height:100%;border-radius:999px;background:#5a5856}
.cb-fill--g{background:linear-gradient(90deg,#8b0d2b,#c2063a);box-shadow:0 0 18px rgba(194,6,58,.6)}
.cb-lane-v{font-size:15px;line-height:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.cb-lane-v span{display:block;font-size:13px;font-weight:500;color:#c9ccce}
.cb-results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:40px;padding-top:28px;border-top:1px solid rgba(255,255,255,.16)}
.cb-results>div{padding:0 32px;border-left:1px solid rgba(255,255,255,.16)}
.cb-results>div:first-child{padding-left:0;border-left:0}
.cb-results b{display:block;font-size:44px;line-height:48px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cb-results>div>span{display:block;margin-top:6px;font-size:15px;line-height:22px;color:#e4e7e9}
.cb-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#3a2a0d;color:#f0a23b;font-size:12px;line-height:16px;font-weight:600}
.cb-race-note{margin:24px 0 0;font-size:13px;line-height:20px;color:#c9ccce;max-width:900px}
.cb-calc{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:0;margin-top:56px;border-radius:20px;overflow:hidden;background:#262625}
.cb-calc-in{padding:48px;display:flex;flex-direction:column;gap:24px;background:#2f2e2d}
.cb-field{display:flex;flex-direction:column;gap:8px}
.cb-field label{font-size:14px;font-weight:600;color:#fff}
.cb-field input{width:100%;min-height:52px;box-sizing:border-box;padding:12px 16px;border-radius:12px;border:1.5px solid #8a9096;background:#1d1d1c;color:#fff;font:inherit;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.cb-field input:focus-visible{outline:3px solid #fff;outline-offset:2px;border-color:#fff}
.cb-field small{font-size:13px;color:#c9ccce}
.cb-calc-out{padding:48px;display:flex;flex-direction:column;gap:28px;background:radial-gradient(80% 90% at 90% 110%,rgba(194,6,58,.45) 0%,rgba(139,13,43,.15) 50%,rgba(38,38,37,0) 80%)}
.cb-out-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 32px}
.cb-out{min-width:0}
.cb-out .cb-val{display:block;margin:0;font-size:72px!important;line-height:1.05!important;font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;color:#fff}
.cb-out .cb-val *{font:inherit!important;letter-spacing:inherit!important;line-height:inherit!important}
.cb-out.cb-off .cb-val{color:#5a5856}
.cb-out span{display:block;margin-top:6px;font-size:15px;line-height:22px;color:#e4e7e9}
.cb-lock{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:12px;background:#3a2a0d;color:#f0a23b;font-size:14px;line-height:21px}
.cb-lock svg{flex:0 0 auto;margin-top:1px}
.cb-calc-out .pill{align-self:flex-start;min-height:52px}
/* I forni per il tuo format */
.cb-fmt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:56px}
.cb-fcard{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:680px;border-radius:20px;overflow:hidden;background:#141413;isolation:isolate}
.cb-fcard>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform var(--dur-slow) var(--ease-out)}
.cb-fcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(20,20,19,.96) 0%,rgba(20,20,19,.82) 38%,rgba(20,20,19,.2) 68%,rgba(20,20,19,0) 85%);transition:opacity var(--dur-base) var(--ease-out)}
.cb-fcard::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(139,13,43,.55) 0%,rgba(139,13,43,0) 60%);opacity:0;transition:opacity var(--dur-base) var(--ease-out)}
.cb-fcard-txt{padding:40px}
.cb-fcard h3{margin:12px 0 0;font-size:clamp(28px,2.6vw,38px);line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.cb-fcard-txt>p:not(.ap-k){margin:14px 0 0;font-size:16px;line-height:26px;color:#e4e7e9;max-width:520px}
.cb-fcard .ap-forni{max-width:none;margin-top:24px}
@media (hover:hover) and (pointer:fine){
.cb-play:hover{background:#a40531}
.cb-risk:hover{filter:drop-shadow(0 0 20px rgba(213,47,93,.5))}
.cb-fcard:hover>img{transform:scale(1.04)}
.cb-fcard:hover::after{opacity:1}
}
.cb-play:active{transform:scale(.97)}
.cb-play:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){
.cb-store{animation:none;background:#c2063a;color:#fff}
.cb-play:active{transform:none}
}
@media (max-width:1199px){
.cb-hero-in{grid-template-columns:minmax(0,1fr);gap:48px}
.cb-net{justify-self:start;max-width:520px}
.cb-risks{grid-template-columns:minmax(0,1fr)}
.cb-method{grid-template-columns:minmax(0,1fr);gap:40px}
.cb-method-l{position:static}
.cb-calc{grid-template-columns:minmax(0,1fr)}
.cb-fmt{grid-template-columns:minmax(0,1fr)}
.cb-fcard{min-height:560px}
}
@media (max-width:767px){
html{scroll-padding-top:140px}
.cb-hero{min-height:0;height:auto}
.cb-hero-in{padding-top:110px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));gap:32px}
.cb-h1{font-size:40px;line-height:44px}
.cb-lead{margin-top:20px;font-size:18px;line-height:28px}
.cb-net{gap:8px}
.cb-store{border-radius:10px}
.cb-hero .ap-cta .pill-white{display:none}
.cb-sec{padding-top:72px}
.cb-big{font-size:30px;line-height:36px}
.cb-risks{margin-top:32px;gap:12px}
.cb-risk-top{padding:24px}
.cb-risk-ans{padding:20px 24px}
.cb-risk-top h3{font-size:22px}
.cb-step{grid-template-columns:minmax(0,1fr);gap:8px;padding:28px 0}
.cb-num{font-size:72px}
.cb-step h3{font-size:24px}
.cb-race{padding:24px;margin-top:32px}
.cb-race-head h3{font-size:22px}
.cb-play{width:100%;justify-content:center}
.cb-clock b{font-size:32px}
.cb-lane{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}
.cb-lane .cb-track{grid-column:1/-1;grid-row:2}
.cb-results{grid-template-columns:minmax(0,1fr)}
.cb-results>div{padding:20px 0 0;margin-top:20px;border-left:0;border-top:1px solid rgba(255,255,255,.16)}
.cb-results>div:first-child{padding-top:0;margin-top:0;border-top:0}
.cb-results b{font-size:36px;line-height:40px}
.cb-calc{margin-top:32px}
.cb-calc-in,.cb-calc-out{padding:24px}
.cb-out-grid{grid-template-columns:minmax(0,1fr);gap:20px}
.cb-out .cb-val{font-size:52px!important}
.cb-calc-out .pill{align-self:stretch}
.cb-fmt{grid-template-columns:minmax(0,1fr);gap:16px;margin-top:32px}
.cb-fcard{min-height:0;background:#262625}
.cb-fcard>img{position:static;aspect-ratio:4/3;height:auto}
.cb-fcard::before,.cb-fcard::after{display:none}
.cb-fcard-txt{padding:24px}
.cb-fcard h3{font-size:26px}
}
</style>

DCLite.define("Soluzioni-Catene-B", "<div style=\"min-width:320px;background:#1d1d1c;color:#fff;font-family:'Montserrat',system-ui,sans-serif\">\n\n<dc-import name=\"Comp-Header\" style=\"display: contents\" hint-size=\"100%,81px\"><\/dc-import>\n<main id=\"contenuto\">\n\n<!-- 04 SOLUZIONI: CATENE, PROPOSTA B -->\n<section class=\"cb-hero\" aria-labelledby=\"cb-titolo\">\n<div class=\"wrap cb-hero-in\">\n<div>\n<nav class=\"sf-crumbs\" aria-label=\"Percorso\"><ol><li><a href=\"../home/\">Home<\/a><\/li><li><span>Soluzioni<\/span><\/li><li><span aria-current=\"page\">Catene<\/span><\/li><\/ol><\/nav>\n<h1 class=\"cb-h1\" id=\"cb-titolo\" style=\"color: #ffffff\">Il tuo standard. <span style=\"color: #D2003C\">In ogni punto vendita.<\/span><\/h1>\n<p class=\"cb-lead\">Quando la rete cresce, cambiano operatori, turni e ritmo del servizio. Gradus porta la tua cottura in ogni sede, e la tiene ferma.<\/p>\n<div class=\"ap-cta\"><a class=\"pill pill-red\" href=\"#test\" onClick=\"{{goSez}}\">Guarda il test<\/a><a class=\"pill pill-white\" href=\"#richiesta\" onClick=\"{{goSez}}\">Prenota il test sul tuo prodotto<\/a><\/div>\n<\/div>\n<div class=\"cb-net\" aria-hidden=\"true\">\n<sc-for list=\"{{stores}}\" as=\"s\" hint-placeholder-count=\"24\"><span class=\"cb-store\" style=\"animation-delay: {{s.d}}\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 10l1.5-5h13L20 10M4 10v9h16v-9M4 10h16M9 19v-5h6v5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/sc-for>\n<p class=\"cb-net-cap\">Ogni punto vendita, lo stesso programma di cottura.<\/p>\n<\/div>\n<\/div>\n<\/section>\n\n<dc-import name=\"Comp-Barra-sezione\" voci=\"{{voci}}\" style=\"display: contents\" hint-size=\"100%,65px\"><\/dc-import>\n\n<!-- IL PROBLEMA -->\n<section class=\"cb-sec reveal\" id=\"problema\" aria-labelledby=\"t-prob\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">La sfida della rete<\/div><div class=\"content\"><h2 class=\"cb-big\" id=\"t-prob\">Cambiano operatori, turni e ritmo. <em style=\"color: #D2003C\">La tua pizza non deve cambiare.<\/em><\/h2><\/div><\/div>\n<ul class=\"cb-risks\">\n<li class=\"cb-risk\"><div class=\"cb-risk-top\"><h3>L’operatore nuovo<\/h3><p>Primo turno, prima infornata, la pizza che identifica il tuo marchio.<\/p><\/div><div class=\"cb-risk-ans\" style=\"background: #D2003C; height: 101px\"><b>Con Gradus<\/b><p>Il programma è già salvato: con My Baking si richiama con un tocco.<\/p><\/div><\/li>\n<li class=\"cb-risk\"><div class=\"cb-risk-top\"><h3>Il picco del sabato sera<\/h3><p>Il forno pieno, il ritmo che sale, nessuno spazio per gli errori.<\/p><\/div><div class=\"cb-risk-ans\" style=\"background: #D2003C; height: 101px\"><b>Con Gradus<\/b><p>Zone, camere e teglie configurate sui volumi del punto vendita.<\/p><\/div><\/li>\n<li class=\"cb-risk\"><div class=\"cb-risk-top\"><h3>La sede appena aperta<\/h3><p>Una squadra nuova, un locale nuovo, lo stesso standard di sempre.<\/p><\/div><div class=\"cb-risk-ans\" style=\"background: #D2003C; height: 101px\"><b>Con Gradus<\/b><p>Configurazione, formazione e un referente dedicato dall’apertura in poi.<\/p><\/div><\/li>\n<\/ul>\n<\/div>\n<\/section>\n\n<!-- IL METODO -->\n<section class=\"cb-sec reveal\" id=\"metodo\" aria-labelledby=\"t-metodo\">\n<div class=\"wrap cb-method\">\n<div class=\"cb-method-l\">\n<p class=\"label\" style=\"margin: 0 0 16px\">Il metodo<\/p>\n<h2 class=\"ap-h2\" id=\"t-metodo\">Dal risultato al metodo.<\/h2>\n<p class=\"ap-intro\">Si parte dalla tua pizza e dal risultato che vuoi ottenere. Poi si definisce la cottura e si verifica come ripeterla nelle condizioni reali del punto vendita.<\/p>\n<\/div>\n<ol class=\"cb-steps\">\n<li class=\"cb-step\"><span class=\"cb-num\" aria-hidden=\"true\" style=\"color: #D2003C; -webkit-text-fill-color: #D2003C; -webkit-text-stroke: 0px\">01<\/span><div><h3>Definire il risultato<\/h3><p>Impasto, grammatura, farcitura e standard di cottura: i riferimenti da cui partire.<\/p><small>Il tuo prodotto<\/small><\/div><\/li>\n<li class=\"cb-step\"><span class=\"cb-num\" aria-hidden=\"true\" style=\"color: #D2003C; -webkit-text-fill-color: #D2003C; -webkit-text-stroke: 0px\">02<\/span><div><h3>Impostare la cottura<\/h3><p>Parametri, carichi e sequenze adatti al prodotto e al ritmo del servizio.<\/p><small>Il forno giusto per il format<\/small><\/div><\/li>\n<li class=\"cb-step\"><span class=\"cb-num\" aria-hidden=\"true\" style=\"color: #D2003C; -webkit-text-fill-color: #D2003C; -webkit-text-stroke: 0px\">03<\/span><div><h3>Richiamare il programma<\/h3><p>Con My Baking i programmi si salvano e si richiamano: l’operatore li trova pronti, in ogni sede.<\/p><small>Fino a 99 programmi<\/small><\/div><\/li>\n<li class=\"cb-step\"><span class=\"cb-num\" aria-hidden=\"true\" style=\"color: #D2003C; -webkit-text-fill-color: #D2003C; -webkit-text-stroke: 0px\">04<\/span><div><h3>Verificare la ripetibilità<\/h3><p>Il risultato si confronta tra cicli e carichi diversi, considerando preparazione e procedure.<\/p><small>Il Chain Performance Test<\/small><\/div><\/li>\n<\/ol>\n<\/div>\n<\/section>\n\n<!-- I FORNI PER IL TUO FORMAT -->\n<section class=\"cb-sec reveal\" id=\"forni\" aria-labelledby=\"t-forni\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">I forni<\/div><div class=\"content\"><h2 class=\"ap-h2\" id=\"t-forni\">I forni per il tuo format.<\/h2><p class=\"ap-intro\">Due esigenze diverse, due risposte Gradus: il forno che racconta il marchio in sala e il forno che regge i volumi del servizio.<\/p><\/div><\/div>\n<div class=\"cb-fmt\">\n<article class=\"cb-fcard\">\n<img src=\"../img/410e2fece85c0eeb570d3b06c106fb02.jpg\" alt=\"Il pizzaiolo inforna una pizza in CRATOS; sul display si legge 515 gradi\" width=\"2000\" height=\"1125\" loading=\"lazy\" decoding=\"async\">\n<div class=\"cb-fcard-txt\"><p class=\"ap-k\">Identità nel locale<\/p><h3>Il forno a vista come parte del format.<\/h3><p>CRATOS si vede dalla sala: la cupola, il mosaico o la resina nei colori del marchio diventano parte del carattere del punto vendita.<\/p>\n<ul class=\"ap-forni\"><li><a href=\"../cratos/\"><span><b>CRATOS<\/b><small>Forno a cupola, finiture personalizzabili<\/small><\/span><span class=\"ap-arrow\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li><\/ul><\/div>\n<\/article>\n<article class=\"cb-fcard\">\n<img src=\"../img/3cac967325c546dd9353d5a73cda5efe.jpg\" alt=\"JACK a due camere con le pizze in cottura e i pannelli di controllo accesi\" width=\"1600\" height=\"999\" loading=\"lazy\" decoding=\"async\">\n<div class=\"cb-fcard-txt\"><p class=\"ap-k\">Ritmo e capacità<\/p><h3>Il forno giusto per volumi e servizio.<\/h3><p>JACK e MODULAR si scelgono in base al prodotto, ai volumi e all’organizzazione del servizio: camere, zone e teglie si configurano sul punto vendita.<\/p>\n<ul class=\"ap-forni\"><li><a href=\"../jack/\"><span><b>JACK<\/b><small>Forno statico, fino a 8 zone<\/small><\/span><span class=\"ap-arrow\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li>\n<li><a href=\"../modular/\"><span><b>MODULAR<\/b><small>Forno componibile, una camera alla volta<\/small><\/span><span class=\"ap-arrow\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li><\/ul><\/div>\n<\/article>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- IL TEST -->\n<section class=\"cb-sec reveal\" id=\"test\" aria-labelledby=\"t-test\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Chain Performance Test<\/div><div class=\"content\"><h2 class=\"ap-h2\" id=\"t-test\">Guarda il test, poi fallo sul tuo prodotto.<\/h2><p class=\"ap-intro\">120 focacce da 1 kg, cotte a cicli da 4: un forno Gradus contro un forno elettrico concorrente.<\/p><\/div><\/div>\n<div class=\"cb-race\">\n<div class=\"cb-race-head\"><div><h3>Stesso carico, stessa focaccia.<\/h3><p>Avvia il confronto: un secondo di animazione vale tre minuti di forno.<\/p><\/div><button class=\"cb-play\" type=\"button\" onClick=\"{{play}}\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\"><path d=\"M7 5l12 7-12 7z\" fill=\"currentColor\"><\/path><\/svg>{{playLbl}}<\/button><\/div>\n<p class=\"cb-clock\" aria-live=\"polite\">Tempo di cottura <b>{{clock}}<\/b><\/p>\n<div class=\"cb-lanes\">\n<div class=\"cb-lane\"><p class=\"cb-lane-n\" style=\"margin:0\">Gradus<small>ciclo da 4 focacce<\/small><\/p><div class=\"cb-track\"><div class=\"cb-fill cb-fill--g\" style=\"width: {{gW}}\"><\/div><\/div><p class=\"cb-lane-v\" style=\"margin:0\">{{gTxt}}<span>8 min a ciclo<\/span><\/p><\/div>\n<div class=\"cb-lane\"><p class=\"cb-lane-n\" style=\"margin:0\">Forno concorrente<small>ciclo da 4 focacce<\/small><\/p><div class=\"cb-track\"><div class=\"cb-fill\" style=\"width: {{cW}}\"><\/div><\/div><p class=\"cb-lane-v\" style=\"margin:0\">{{cTxt}}<span>12 min a ciclo<\/span><\/p><\/div>\n<\/div>\n<div class=\"cb-results\">\n<div><b>+50%<\/b><span>di capacità produttiva a parità di carico<\/span><p style=\"margin:12px 0 0\"><\/p><\/div>\n<div><b>15,92 vs 23,88<\/b><span>kWh per 120 focacce, -33% di energia per prodotto<\/span><p style=\"margin:12px 0 0\"><\/p><\/div>\n<div><b>120/120<\/b><span>focacce a standard di cottura, in produzione continua<\/span><p style=\"margin:12px 0 0\"><\/p><\/div>\n<\/div>\n\n<\/div>\n<\/div>\n<\/section>\n\n<!-- LA STIMA SULLA TUA RETE -->\n<section class=\"cb-sec reveal\" id=\"stima\" aria-labelledby=\"t-stima\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Sulla tua rete<\/div><div class=\"content\"><h2 class=\"ap-h2\" id=\"t-stima\">Quanto vale sulla tua rete?<\/h2><p class=\"ap-intro\">Inserisci i numeri della tua catena: la stima applica i risultati del test ai tuoi volumi.<\/p><\/div><\/div>\n<div class=\"cb-calc\">\n<div class=\"cb-calc-in\">\n<div class=\"cb-field\"><label for=\"cb-pv\">Punti vendita<\/label><input id=\"cb-pv\" type=\"number\" inputmode=\"numeric\" min=\"1\" value=\"{{pv}}\" onChange=\"{{setPv}}\"><\/div>\n<div class=\"cb-field\"><label for=\"cb-fd\">Focacce o pizze in teglia al giorno, per punto vendita<\/label><input id=\"cb-fd\" type=\"number\" inputmode=\"numeric\" min=\"1\" value=\"{{fd}}\" onChange=\"{{setFd}}\"><\/div>\n<div class=\"cb-field\"><label for=\"cb-gg\">Giorni di apertura all’anno<\/label><input id=\"cb-gg\" type=\"number\" inputmode=\"numeric\" min=\"1\" max=\"366\" value=\"{{gg}}\" onChange=\"{{setGg}}\"><small>Per esempio 310, con un giorno di chiusura a settimana.<\/small><\/div>\n<\/div>\n<div class=\"cb-calc-out\" aria-live=\"polite\" style=\"display: flex; flex-direction: column; align-self: stretch; height: auto\">\n<div class=\"cb-out-grid\">\n<div class=\"cb-out {{outCls}}\"><p class=\"cb-val\">{{oreTxt}}<\/p><span>ore di forno liberate in un anno<\/span><\/div>\n<div class=\"cb-out {{outCls}}\"><p class=\"cb-val\">{{kwhTxt}}<\/p><span>kWh risparmiati in un anno<\/span><\/div>\n<div class=\"cb-out {{outCls}}\"><p class=\"cb-val\">{{capTxt}}<\/p><span>prodotti in più a parità di tempo<\/span><\/div>\n<div class=\"cb-out {{outCls}}\"><p class=\"cb-val\">{{totTxt}}<\/p><span>prodotti all’anno sulla rete<\/span><\/div>\n<\/div>\n<sc-if value=\"{{locked}}\" hint-placeholder-val=\"{{ true }}\" style=\"margin-top: auto; display: block\"><p class=\"cb-lock\" style=\"margin:0\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\"><path d=\"M12 8v5M12 16.5v.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\/path><circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><\/circle><\/svg><span>La stima si attiva quando Gradus conferma i dati e le condizioni del test. Per ora i risultati sono segnaposto.<\/span><\/p><\/sc-if>\n<sc-if value=\"{{unlocked}}\" hint-placeholder-val=\"{{ false }}\" style=\"margin-top: auto; display: block\"><p class=\"cb-lock\" style=\"margin:0\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\"><path d=\"M12 8v5M12 16.5v.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\/path><circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><\/circle><\/svg><span>Stima indicativa, basata su un test su focacce da 1 kg. Il risultato reale si misura sul tuo prodotto.<\/span><\/p><\/sc-if>\n\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- FASCIA CATALOGO -->\n<section class=\"ap-sec reveal\" id=\"catalogo\" aria-labelledby=\"t-cat\">\n<div class=\"wrap\">\n<div class=\"ap-catalogo\">\n<div><h2 id=\"t-cat\">Gradus per le catene, nel catalogo.<\/h2><p>Metodo, valore operativo e test sul prodotto, insieme alle schede di CRATOS, JACK e MODULAR: li trovi nel catalogo Gradus 2027.<\/p><\/div>\n<div class=\"ap-catalogo-cta\"><a class=\"pill pill-white\" href=\"#\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" aria-hidden=\"true\"><path d=\"M12 4v11M7 10l5 5 5-5M5 20h14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span>Scarica il catalogo<\/span><\/a><a class=\"pill pill-line\" href=\"#richiesta\" onClick=\"{{goSez}}\">Richiedi informazioni<\/a><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<dc-import name=\"Comp-Richiesta\" forno=\"Catena\" titolo=\"Parliamo della tua prossima apertura.\" testo=\"Raccontaci il tuo prodotto, quanti punti vendita hai e quali aprirai: ti proponiamo il test e la configurazione più adatta al tuo format.\" style=\"display: contents\" hint-size=\"100%,969px\"><\/dc-import>\n<\/main>\n<div class=\"sf-sticky\"><a class=\"pill pill-red\" href=\"#richiesta\" onClick=\"{{goSez}}\">Prenota il test<\/a><\/div>\n\n<dc-import name=\"Comp-Footer\" style=\"display: contents\" hint-size=\"100%,420px\"><\/dc-import>\n\n<\/div>", function (DCLogic) {

class Component extends DCLogic {
constructor(props) { super(props); this.state = { t: 0, running: false, pv: 10, fd: 200, gg: 310 }; this.timer = null; }
componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
play(e) {
const win = (e && e.currentTarget && e.currentTarget.ownerDocument.defaultView) || window;
if (this.timer) clearInterval(this.timer);
if (win.matchMedia && win.matchMedia('(prefers-reduced-motion: reduce)').matches) { this.setState({ t: 4000, running: false }); return; }
const t0 = Date.now();
this.setState({ t: 0, running: true });
this.timer = setInterval(() => {
const t = Math.min(4000, Date.now() - t0);
this.setState({ t, running: t < 4000 });
if (t >= 4000) { clearInterval(this.timer); this.timer = null; }
}, 50);
}
num(v, d) { const n = parseInt(v, 10); return isFinite(n) && n > 0 ? n : d; }
fmt(n) { return Math.round(n).toLocaleString('it-IT'); }
goSez(e) {
const a = e.currentTarget, id = (a.getAttribute('href') || '').slice(1), doc = a.ownerDocument, el = id && doc.getElementById(id);
if (!el) return;
e.preventDefault();
const win = doc.defaultView, head = doc.querySelector('.site-head'), bar = doc.querySelector('.sf-anchors');
let off = 16;
if (bar && win.getComputedStyle(bar).position === 'sticky') off += (parseFloat(win.getComputedStyle(bar).top) || 0) + bar.offsetHeight;
else if (head) off += head.offsetHeight;
let box = el.parentElement;
while (box && box !== doc.body && box !== doc.documentElement) { const o = win.getComputedStyle(box).overflowY; if ((o === 'auto' || o === 'scroll') && box.scrollHeight > box.clientHeight) break; box = box.parentElement; }
const soft = win.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
if (!box || box === doc.body || box === doc.documentElement) { win.scrollTo({ top: el.getBoundingClientRect().top + win.scrollY - off, behavior: soft }); }
else { box.scrollTo({ top: el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - off, behavior: soft }); }
if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1');
el.focus({ preventScroll: true });
}
renderVals() {
const s = this.state, t = s.t;
const min = t / 4000 * 12;
const g = Math.min(1, min / 8), c = Math.min(1, min / 12);
const stores = [];
for (let i = 0; i < 24; i++) stores.push({ d: (i * 0.3).toFixed(1) + 's' });
const attiva = this.props.stima_attiva !== false && this.props.stima_attiva !== 'false';
// stima dal test: 4 prodotti a ciclo, 8 contro 12 minuti, 15,92 contro 23,88 kWh su 120 prodotti
const tot = s.pv * s.fd * s.gg;
const ore = tot / 4 * (12 - 8) / 60;
const kwh = tot * (23.88 - 15.92) / 120;
const ph = '— —';
return {
stores,
voci: [{ href: '#problema', label: 'La sfida' }, { href: '#metodo', label: 'Metodo' }, { href: '#forni', label: 'Forni' }, { href: '#test', label: 'Test' }, { href: '#stima', label: 'Stima' }],
play: (e) => this.play(e),
playLbl: s.running ? 'In cottura…' : (t > 0 ? 'Riavvia il confronto' : 'Avvia il confronto'),
clock: min.toFixed(1).replace('.', ',') + ' min',
gW: (g * 100).toFixed(1) + '%', cW: (c * 100).toFixed(1) + '%',
gTxt: g >= 1 ? 'Ciclo completato' : (t > 0 ? 'In cottura' : 'Pronto'),
cTxt: c >= 1 ? 'Ciclo completato' : (t > 0 ? 'In cottura' : 'Pronto'),
pv: String(s.pv), fd: String(s.fd), gg: String(s.gg),
setPv: (e) => this.setState({ pv: this.num(e.target.value, 1) }),
setFd: (e) => this.setState({ fd: this.num(e.target.value, 1) }),
setGg: (e) => this.setState({ gg: Math.min(366, this.num(e.target.value, 1)) }),
locked: !attiva, unlocked: attiva,
outCls: attiva ? '' : 'cb-off',
oreTxt: attiva ? this.fmt(ore) : ph,
kwhTxt: attiva ? this.fmt(kwh) : ph,
capTxt: attiva ? '+50%' : ph,
totTxt: this.fmt(tot),
goSez: (e) => this.goSez(e)
};
}
}

return Component;
});
DCLite.mount("Soluzioni-Catene-B");
</script>

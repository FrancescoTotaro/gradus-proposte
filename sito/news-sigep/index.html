.ns-card{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:center}
.ns-card-img{aspect-ratio:4/3;border-radius:14px;display:grid;place-items:center;padding:12px;box-sizing:border-box;text-align:center;font-size:13px;color:#c9ccce;background:repeating-linear-gradient(135deg,#262625 0 14px,#2c2b2a 14px 28px)}
.ns-card .ns-meta{font-size:13px}
.ns-card h3{margin:10px 0 0;font-size:22px;line-height:1.25;font-weight:700}
.ns-card span.lnk{display:inline-block;margin-top:12px;font-size:15px}
.ns-end{height:96px}

@media (hover:hover) and (pointer:fine){
.lnk:hover{text-decoration-thickness:3px;text-underline-offset:8px}
.pill-red:hover{background:#a40531}
.pill-white:hover{background:#f1ece8}
.pill-line:hover{background:#fff;color:#1d1d1c}
.sf-crumbs a:hover{text-decoration:underline;text-underline-offset:4px}
.ns-back:hover svg{transform:translateX(-4px)}
.ns-links a:hover svg{transform:translate(2px,-2px)}
.ns-card:hover .lnk{text-decoration-thickness:3px;text-underline-offset:8px}
}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{transition-property:color,background-color,border-color,text-decoration-color,opacity!important;transition-duration:var(--dur-fast)!important}
.pill:active,.ns-back:hover svg,.ns-links a:hover svg{transform:none}
}
@media (max-width:1199px){
.ns-body-in{grid-template-columns:minmax(0,1fr);gap:48px}
.ns-event{position:static;order:-1}
.ns-cards{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:767px){
html{scroll-padding-top:90px}
.wrap{padding-left:20px;padding-right:20px}
.ns-hero{padding:116px 0 32px}
.sf-crumbs ol{margin-bottom:12px;font-size:13px}
.ns-h1{font-size:36px;line-height:40px}
.ns-lead{margin-top:20px;font-size:18px;line-height:28px}
.ns-cover{aspect-ratio:4/3;border-radius:14px}
.ns-sec{padding-top:40px}
.ns-art>p{font-size:17px;line-height:28px}
.ns-art h2{margin-top:40px;font-size:26px}
.ns-event{padding:24px}
.ns-more{padding-top:64px}
.ns-cards{margin-top:28px;gap:28px}
.ns-card{grid-template-columns:minmax(0,1fr);gap:16px}
.ns-card-img{aspect-ratio:16/10}
.ns-end{height:64px}
.sf-sticky{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#1d1d1c;border-top:1px solid #4a4947}
.sf-sticky .pill{display:flex;width:100%;min-height:52px}
#servizi{padding-bottom:84px}
}

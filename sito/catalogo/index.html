<style>
:root{--red:#c2063a;--red-hover:#a40531;--red-on-dark:#D2003C;--hair:rgba(255,255,255,.16);--ease-out:cubic-bezier(.2,.8,.2,1);--dur-fast:150ms;--dur-base:250ms;--dur-slow:400ms}
body{margin:0;font-family:'Montserrat',system-ui,sans-serif;color:#fff;background:#1d1d1c}

.wrap{max-width:1360px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));box-sizing:border-box}
.label{font-size:14px;line-height:1.5;font-weight:500;color:#c9ccce}

.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;box-sizing:border-box;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;-webkit-user-select:none;user-select:none;transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform 120ms var(--ease-out)}
.pill:active{transform:scale(.97)}
.pill-red{background:#c2063a;color:#fff;border:1px solid #e0587c}
.pill-white{background:#fff;color:#1d1d1c}
.pill-line{border:1.5px solid rgba(255,255,255,.7);color:#fff}
.pill small{font-size:13px;font-weight:500;opacity:.75}
.grid2{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);border-top:1px solid var(--hair)}
.grid2>.label{padding:28px 40px 0 0}

.sf-crumbs ol{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px;padding:0;list-style:none;font-size:14px;line-height:20px;color:rgba(255,255,255,.82)}

.sf-sticky{display:none}
@supports (animation-timeline: view()){
@media (prefers-reduced-motion: no-preference){
.reveal{margin-inline:-48px;padding-inline:48px;view-timeline-name:--sezione;animation:reveal-fondo linear both;animation-timeline:--sezione;animation-range:entry 0% entry 70%}
.reveal>.wrap{animation:reveal-zoom linear both;animation-timeline:--sezione;animation-range:entry 0% entry 70%;transform-origin:50% 0}
}

}
@keyframes reveal-fondo{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}
@keyframes reveal-fondo-m{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}

.ct-hero{position:relative;margin-top:-82px;overflow:hidden;background:radial-gradient(50% 80% at 78% 60%,rgba(194,6,58,.4) 0%,rgba(139,13,43,.16) 45%,rgba(29,29,28,0) 75%),#1d1d1c}
.ct-hero-in{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:64px;align-items:center;min-height:780px;padding-top:150px;padding-bottom:80px;box-sizing:border-box}
.ct-h1{margin:0;font-size:72px;line-height:1;font-weight:800;letter-spacing:-.03em;max-width:720px;text-wrap:balance}
.ct-lead{margin:28px 0 0;font-size:20px;line-height:32px;color:#e4e7e9;max-width:580px}
.ct-dl{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}

.ct-cover{justify-self:center;position:relative;width:min(100%,400px);aspect-ratio:210/297;border-radius:6px;overflow:hidden;background:radial-gradient(70% 55% at 50% 62%,#b3123f 0%,#8b0d2b 50%,#4a0718 100%);box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 80px rgba(194,6,58,.35);transform:rotate(-3deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.ct-cover img{width:62%;height:auto;display:block}
.ct-cover span{position:absolute;left:0;right:0;bottom:28px;text-align:center;font-size:15px;font-weight:600;letter-spacing:.3em}

/* Cosa trovi */
.ct-sec{padding:104px 0 0}
.ct-h2{margin:0;font-size:clamp(32px,3.4vw,48px);line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance;max-width:820px}
.ct-toc{list-style:none;margin:48px 0 0;padding:0;border-top:1px solid rgba(255,255,255,.16)}
.ct-toc li{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr) 120px;gap:24px;align-items:baseline;padding:22px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.ct-toc b{font-size:22px;line-height:28px;font-weight:800;letter-spacing:.04em}
.ct-toc span{font-size:16px;line-height:25px;color:#c9ccce}

.ct-sheet .lnk{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px}
.ct-note{margin:16px 0 0;font-size:13px;line-height:20px;color:#c9ccce}

@media (hover:hover) and (pointer:fine){

.pill-white:hover{background:#f1ece8}
.pill-line:hover{background:#fff;color:#1d1d1c}

}

.ig-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,20,19,.92) 0%,rgba(20,20,19,.7) 38%,rgba(20,20,19,.1) 70%),linear-gradient(180deg,rgba(20,20,19,.6) 0%,rgba(20,20,19,0) 25%,rgba(20,20,19,0) 60%,#1d1d1c 100%)}
.ig-hero .wrap{position:relative;z-index:1;width:100%;padding-bottom:88px}
.ig-h1{margin:0;font-size:72px;line-height:1;font-weight:800;letter-spacing:-.03em;max-width:820px;text-wrap:balance}
.ig-lead{margin:28px 0 0;font-size:20px;line-height:32px;color:#fff;max-width:600px}
.ig-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}

/* Sezioni */
.ig-sec{padding:96px 0 0;background:#1d1d1c}
.ig-h2{margin:0;font-size:clamp(32px,3.4vw,48px);line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance;max-width:820px}
.ig-intro{margin:20px 0 0;font-size:19px;line-height:1.6;color:#e4e7e9;max-width:640px}

/* Numeri */
.ig-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 32px;margin:48px 0 0}
.ig-facts>div{padding:24px 0 0;border-top:1px solid var(--hair)}
.ig-facts dt{font-size:14px;line-height:1.4;font-weight:500;color:#c9ccce}
.ig-facts dd{margin:12px 0 0;font-size:48px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:#D2003C;white-space:nowrap}

/* Le realtà del gruppo */
.ig-tree{margin-top:56px;display:flex;flex-direction:column;align-items:stretch}
.ig-node{position:relative;padding:32px;border-radius:16px;background:#262625;box-sizing:border-box}
.ig-node-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:center;background:radial-gradient(70% 140% at 100% 0%,rgba(194,6,58,.35),rgba(194,6,58,0) 70%),#262625}
.ig-tag{display:inline-block;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.ig-name{margin:12px 0 0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ig-node-top .ig-name{font-size:40px}
.ig-node p{margin:12px 0 0;font-size:16px;line-height:26px;color:#c9ccce}
.ig-node-top p{margin:0;font-size:18px;line-height:28px;color:#e4e7e9}
.ig-branch{position:relative;height:56px}
.ig-branch::before{content:"";position:absolute;left:50%;top:0;height:28px;border-left:1px solid rgba(255,255,255,.3)}
.ig-branch::after{content:"";position:absolute;left:calc(100% / 6);right:calc(100% / 6);top:28px;height:28px;border:1px solid rgba(255,255,255,.3);border-bottom:0;border-radius:12px 12px 0 0}
.ig-kids{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.ig-kids>li{display:flex}
.ig-kids .ig-node{flex:1;display:flex;flex-direction:column}
.ig-kids .ig-node .lnk{margin-top:auto;padding-top:20px;align-self:flex-start;font-size:15px}
.ig-node--here{box-shadow:inset 0 0 0 2px #D2003C;background:radial-gradient(90% 70% at 50% 110%,rgba(194,6,58,.45),rgba(194,6,58,0) 70%),#262625}
.ig-here{position:absolute;top:24px;right:24px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#D2003C;font-size:12px;line-height:16px;font-weight:700;color:#fff}
.ig-ext{margin-top:auto;padding-top:20px;font-size:13px;line-height:20px;color:#c9ccce}
/* Un gruppo, tre marchi: proposta A, la lamiera (09/11) */
.ig-mat{position:relative;margin-top:56px;height:420px;border-radius:18px;overflow:hidden;background:#141413;display:flex;align-items:center}
.ig-mat-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.ig-mat::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,20,19,.92) 0%,rgba(20,20,19,.75) 38%,rgba(20,20,19,.1) 72%)}
.ig-mat-txt{position:relative;z-index:1;max-width:560px;padding:0 56px}
.ig-mat-logo{margin:0}
.ig-mat-logo img{display:block;height:92px;width:auto}
.ig-mat-txt p{margin:28px 0 0;font-size:28px;line-height:1.3;font-weight:600;letter-spacing:-.01em;color:#fff;text-wrap:balance}
.ig-brands{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.ig-brands>li{display:flex;flex-direction:column;min-width:0}
.ig-brand-fig{position:relative;margin:0;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#262625}
.ig-brand-fig img{width:100%;height:100%;object-fit:cover;display:block}
.ig-brand-ph{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:14px;line-height:1.5;color:#c9ccce;background:repeating-linear-gradient(135deg,#262625 0 14px,#2c2b2a 14px 28px)}
.ig-brand--here .ig-brand-fig{box-shadow:inset 0 0 0 2px #D2003C}
.ig-brand--here .ig-here{top:20px;right:auto;left:20px}
.ig-brand-logo{display:flex;align-items:flex-end;height:60px;margin:28px 0 0}
.ig-brand-logo img{display:block;width:auto;max-width:100%}
.ig-bl-order{height:60px}
.ig-bl-resto{height:38px;margin-bottom:6px}
.ig-bl-gradus{height:22px;margin-bottom:10px}
.ig-brands p{margin:10px 0 0;font-size:16px;line-height:26px;color:#c9ccce}
.ig-brands p.ig-brand-k{margin-top:20px;font-size:18px;line-height:26px;font-weight:700;color:#fff}
.ig-brands p.ig-brand-ext{margin-top:auto;padding-top:16px;font-size:13px;line-height:20px}
.ig-brand-go{align-self:flex-start;margin-top:auto;padding-top:16px;display:inline-flex;align-items:center;min-height:44px;font-size:15px}
@media (max-width:1199px){
.ig-mat{height:380px}
.ig-mat-txt p{font-size:24px}
}
@media (max-width:767px){
.ig-mat{margin-top:32px;height:auto;min-height:420px;align-items:flex-end}
.ig-mat::after{background:linear-gradient(180deg,rgba(20,20,19,.1) 0%,rgba(20,20,19,.55) 40%,rgba(20,20,19,.95) 75%)}
.ig-mat-txt{padding:200px 24px 28px}
.ig-mat-logo img{height:72px}
.ig-mat-txt p{margin-top:20px;font-size:20px;line-height:1.35}
.ig-brands{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:16px -20px 0;padding:0 20px;scroll-padding-inline:20px;scrollbar-width:none;overscroll-behavior-x:contain}
.ig-brands::-webkit-scrollbar{display:none}
.ig-brands>li{flex:0 0 82%;scroll-snap-align:start}
.ig-brand-logo{height:52px;margin-top:20px}
.ig-bl-order{height:52px}
.ig-bl-resto{height:32px}
.ig-bl-gradus{height:19px}
}
/* Loghi del gruppo al posto dei nomi (09/11) */
.ig-logo{display:flex;align-items:flex-end;height:64px;margin-top:20px}
.ig-node-top .ig-logo{height:96px;margin-top:16px}
.ig-logo img{display:block;width:auto;max-width:100%}
.ig-logo-tecno{height:96px}
.ig-logo-order{height:60px}
.ig-logo-resto{height:38px;margin-bottom:6px}
.ig-logo-gradus{height:22px;margin-bottom:10px}
@media (max-width:767px){
.ig-logo{height:52px;margin-top:16px}
.ig-node-top .ig-logo{height:76px}
.ig-logo-tecno{height:76px}
.ig-logo-order{height:50px}
.ig-logo-resto{height:32px;margin-bottom:4px}
.ig-logo-gradus{height:19px;margin-bottom:8px}
}

/* Dal progetto al prodotto */
.ig-steps{list-style:none;margin:56px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;counter-reset:fase}
.ig-steps li{display:flex;flex-direction:column}
.ig-step-img{aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#141413}
.ig-step-img img{width:100%;height:100%;object-fit:cover;display:block}
.ig-step-n{display:block;margin-top:24px;font-size:32px;line-height:1;font-weight:800;letter-spacing:-.02em;color:#D2003C;font-variant-numeric:tabular-nums}
.ig-steps h3{margin:12px 0 0;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.ig-steps p{margin:10px 0 0;font-size:16px;line-height:26px;color:#c9ccce}
.ig-prod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 32px;margin:64px 0 0}
.ig-prod>div{padding:24px 0 0;border-top:1px solid var(--hair)}
.ig-prod dt{font-size:14px;line-height:1.4;font-weight:500;color:#c9ccce}
.ig-prod dd{margin:12px 0 0;font-size:40px;line-height:1;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Dove siamo */
.ig-sedi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:40px}
.ig-sede{padding:32px;border-radius:16px;background:#262625;display:flex;flex-direction:column;gap:12px}
.ig-sede h3{margin:0;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ig-sede address{font-style:normal;font-size:20px;line-height:30px;font-weight:600}
.ig-sede p{margin:0;font-size:15px;line-height:24px;color:#c9ccce}
.ig-sede .lnk{align-self:flex-start;margin-top:8px;font-size:15px;display:inline-flex;align-items:center;min-height:44px}

/* Continua */
.ig-next{list-style:none;margin:40px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.ig-next>li{display:flex}
.gcard{position:relative;flex:1;height:420px;border-radius:16px;overflow:hidden;background:#302e2d;display:flex;flex-direction:column;justify-content:flex-end;padding:32px;box-sizing:border-box;isolation:isolate;color:#fff}
.gcard-bg{position:absolute;inset:0;z-index:-2;transition:transform var(--dur-slow) var(--ease-out)}
.gcard-bg img{width:100%;height:100%;object-fit:cover;display:block}
.gcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(29,29,28,0) 30%,rgba(29,29,28,.92) 100%)}
.gcard::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 60% at 50% 100%,rgba(194,6,58,.85),rgba(194,6,58,0) 70%);opacity:0;transition:opacity var(--dur-slow) var(--ease-out)}
.gcard-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.gcard h3{margin:0;font-size:36px;line-height:1.05;font-weight:700;letter-spacing:-.03em}
.gcard-sub{margin:8px 0 0;font-size:15px;line-height:1.5;color:#e4e7e9}
.gcard-round{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#1d1d1c;transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-base) var(--ease-out)}
.gcard:focus-visible .gcard-bg{transform:scale(1.06)}
.gcard:focus-visible::after{opacity:1}
.gcard:focus-visible .gcard-round{background:#c2063a;color:#fff;transform:rotate(-45deg)}

/* Fascia contatti */
.ig-help{margin-top:96px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px;align-items:center;padding:56px;border-radius:18px;background:radial-gradient(90% 120% at 85% 110%,#b3123f 0%,#8b0d2b 45%,#4a0718 100%)}
.ig-help h2{margin:0;font-size:clamp(30px,3vw,44px);line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.ig-help p{margin:14px 0 0;font-size:17px;line-height:27px;color:rgba(255,255,255,.9);max-width:560px}
.ig-help-cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}
.ig-end{height:96px}

@media (hover:hover) and (pointer:fine){

}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{transition-property:color,background-color,border-color,text-decoration-color,opacity!important;transition-duration:var(--dur-fast)!important}

}

DCLite.define("Gradus-Il-Gruppo", "<div style=\"min-width:320px;background:#1d1d1c;color:#fff;font-family:'Montserrat',system-ui,sans-serif\">\n\n<dc-import name=\"Comp-Header\" style=\"display: contents\" hint-size=\"100%,81px\"><\/dc-import>\n<main id=\"contenuto\">\n\n<!-- 16 GRADUS: IL GRUPPO -->\n<section class=\"ig-hero\" aria-labelledby=\"ig-titolo\" style=\"height: 750px\">\n<img class=\"ig-hero-img\" src=\"../img/7b9c6836ef695b9821066985a6a051e6.jpg\" alt=\"Le persone di Tecno A Group davanti alla sede di Canavaccio, a Urbino\" width=\"1800\" height=\"1288\" fetchpriority=\"high\">\n<div class=\"wrap\">\n<nav class=\"sf-crumbs\" aria-label=\"Percorso\"><ol><li><a href=\"../home/\">Home<\/a><\/li><li><a href=\"../gradus/\">Gradus<\/a><\/li><li><span aria-current=\"page\">Il Gruppo<\/span><\/li><\/ol><\/nav>\n<h1 class=\"ig-h1\" id=\"ig-titolo\">Dietro ogni Gradus c’è un sistema industriale.<\/h1>\n<p class=\"ig-lead\">Gradus è un brand di Tecno A Group, realtà produttiva nata dalla lavorazione della lamiera e cresciuta integrando competenze, tecnologie e processi.<\/p>\n<div class=\"ig-cta\"><a class=\"pill pill-red\" href=\"#processo\" onClick=\"{{goSez}}\">Scopri come lavoriamo<\/a><a class=\"pill pill-line\" href=\"#realta\" onClick=\"{{goSez}}\">Le realtà del gruppo<\/a><\/div>\n<\/div>\n<\/section>\n\n<dc-import name=\"Comp-Barra-sezione\" voci=\"{{voci}}\" style=\"display: contents\" hint-size=\"100%,65px\"><\/dc-import>\n\n<!-- CHI SIAMO -->\n<section class=\"ig-sec reveal\" id=\"chi-siamo\" aria-labelledby=\"t-chi\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Chi siamo<\/div><div class=\"content\"><h2 class=\"ig-h2\" id=\"t-chi\">Progettazione, produzione e sviluppo sotto lo stesso tetto.<\/h2><p class=\"ig-intro\">Nello stabilimento di Canavaccio, a Urbino, specializzazioni diverse lavorano fianco a fianco. Così ogni forno Gradus nasce, si costruisce e si verifica nello stesso posto, con le stesse persone.<\/p><\/div><\/div>\n<dl class=\"ig-facts\">\n<div><dt>Fondazione di Tecno A<\/dt><dd>1998<\/dd><\/div>\n<div><dt>Superficie coperta<\/dt><dd>18.000 m²<\/dd><\/div>\n<div><dt>Dipendenti<\/dt><dd>104<\/dd><\/div>\n<div><dt>Paesi serviti<\/dt><dd>51<\/dd><\/div>\n<\/dl>\n<\/div>\n<\/section>\n\n<!-- LE REALTÀ DEL GRUPPO -->\n<section class=\"ig-sec reveal\" id=\"realta\" aria-labelledby=\"t-realta\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Il gruppo<\/div><div class=\"content\"><h2 class=\"ig-h2\" id=\"t-realta\">Un gruppo, tre marchi.<\/h2><p class=\"ig-intro\">Mercati diversi, la stessa competenza industriale nella lavorazione dei metalli.<\/p><\/div><\/div>\n<div class=\"ig-mat\">\n<img class=\"ig-mat-img\" src=\"../img/326eec09a6d9e52dc12813a8a3045335.jpg\" alt=\"Taglio laser di una lamiera nello stabilimento di Canavaccio\" width=\"738\" height=\"1315\" loading=\"lazy\" decoding=\"async\">\n<div class=\"ig-mat-txt\">\n<h3 class=\"ig-mat-logo\"><img src=\"../img/70fefa3f821eaf4782fd59b8e74f1bb6.png\" alt=\"Tecno A Group\" width=\"636\" height=\"384\"><\/h3>\n<p>Dal 1998 lavoriamo la lamiera. Oggi la stessa lamiera diventa tre prodotti diversi.<\/p>\n<\/div>\n<\/div>\n<ul class=\"ig-brands\" aria-label=\"I marchi del gruppo\">\n<li class=\"ig-brand--here\"><figure class=\"ig-brand-fig\"><img src=\"../img/4d0910a595f96b70c604148296d412fc.jpg\" alt=\"Forno Gradus JACK con il pannello di controllo\" width=\"1800\" height=\"1201\" loading=\"lazy\" decoding=\"async\"><\/figure><h3 class=\"ig-brand-logo\"><img src=\"../img/cec78bba0f21f9b7fcac8078afcdc67c.png\" alt=\"Gradus\" width=\"1140\" height=\"88\" class=\"ig-bl-gradus\" style=\"width: 319px; height: 25px\"><\/h3><p class=\"ig-brand-k\">Forni professionali<\/p><p>Forni per pizzeria, panetteria e pasticceria: CRATOS, JACK, MODULAR e ROTOR.<\/p><a class=\"lnk ig-brand-go\" href=\"../forni/\">Vedi i forni<\/a><\/li><li><figure class=\"ig-brand-fig\"><img src=\"../img/c1dc33820e4be65f3f3e3c066e681b06.jpg\" alt=\"Foto prodotto Resto Italia (segnaposto)\" width=\"1800\" height=\"1201\" style=\"display: block; width: 100%; height: 100%; aspect-ratio: 3/2; object-fit: cover\"><\/figure><h3 class=\"ig-brand-logo\"><img src=\"../img/667b358f93bfa7d5ff71d1ef6ed87cc8.png\" alt=\"Resto Italia\" width=\"816\" height=\"152\" class=\"ig-bl-resto\"><\/h3><p class=\"ig-brand-k\">Attrezzature per la ristorazione<\/p><p>Il marchio del gruppo dedicato alle attrezzature per la ristorazione professionale.<\/p><p class=\"ig-brand-ext\">Sito di Resto Italia: collegamento da confermare<\/p><\/li><li><figure class=\"ig-brand-fig\"><img src=\"../img/3b267f4d7a57b671503124a1d4eec319.webp\" alt=\"Foto prodotto Order System (segnaposto)\" width=\"1800\" height=\"1201\" style=\"display: block; width: 100%; height: 100%; aspect-ratio: 3/2; object-fit: cover; object-position: 71.4807% 50%\"><\/figure><h3 class=\"ig-brand-logo\"><img src=\"../img/bc55c1ccf5a705f6975c9dd3c540a5e8.png\" alt=\"Order System\" width=\"524\" height=\"240\" class=\"ig-bl-order\"><\/h3><p class=\"ig-brand-k\">Allestimenti per veicoli commerciali<\/p><p>Moduli, scaffalature e pianali per furgoni e officine mobili, progettati e prodotti a Urbino.<\/p><p class=\"ig-brand-ext\">Sito di Order System: collegamento da confermare<\/p><\/li>\n\n\n<\/ul>\n\n<\/div>\n<\/section>\n\n<!-- DAL PROGETTO AL PRODOTTO -->\n<section class=\"ig-sec reveal\" id=\"processo\" aria-labelledby=\"t-proc\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Come lavoriamo<\/div><div class=\"content\"><h2 class=\"ig-h2\" id=\"t-proc\">Dal progetto al prodotto.<\/h2><p class=\"ig-intro\">Quattro fasi, tutte in casa. Ogni passaggio resta sotto controllo, dal disegno al collaudo.<\/p><\/div><\/div>\n<ol class=\"ig-steps\">\n<li><div class=\"ig-step-img\"><img src=\"../img/a2bc9c607b0a0e384923dc13699dd960.jpg\" alt=\"Una progettista disegna la struttura di un forno al computer\" style=\"object-position: 60% 20%\" width=\"738\" height=\"492\" loading

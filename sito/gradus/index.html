/* Apertura interna */
.gr-hero{position:relative;margin-top:-82px;padding:168px 0 72px;background:radial-gradient(55% 90% at 88% 0%,rgba(194,6,58,.42) 0%,rgba(139,13,43,.18) 45%,rgba(29,29,28,0) 75%),#1d1d1c}
.gr-h1{margin:0;font-size:72px;line-height:1;font-weight:800;letter-spacing:-.03em;max-width:980px;text-wrap:balance}
.gr-lead{margin:28px 0 0;font-size:20px;line-height:32px;color:#e4e7e9;max-width:660px}

.gr-cards>li{display:flex}

.gcard-bg{position:absolute;inset:0;z-index:-2;transition:transform var(--dur-slow) var(--ease-out)}
.gcard-bg img{width:100%;height:100%;object-fit:cover;display:block}
.gcard::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(29,29,28,0) 30%,rgba(29,29,28,.92) 100%)}
.gcard::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 60% at 50% 100%,rgba(194,6,58,.85),rgba(194,6,58,0) 70%);opacity:0;transition:opacity var(--dur-slow) var(--ease-out)}
.gcard-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.gcard-k{display:block;margin-bottom:10px;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.gcard h2{margin:0;font-size:36px;line-height:1.05;font-weight:700;letter-spacing:-.03em}
.gcard-sub{margin:8px 0 0;font-size:15px;line-height:1.5;color:#e4e7e9}
.gcard-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-base) var(--ease-out)}
.gcard-more>div{overflow:hidden}
.gcard-more p{margin:0;padding-top:12px;font-size:17px;line-height:1.5;color:#fff;max-width:420px}
.gcard-more span{display:inline-block;margin-top:14px;font-size:15px;font-weight:600;text-decoration:underline;text-decoration-color:#fff;text-decoration-thickness:2px;text-underline-offset:6px}
.gcard-round{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#1d1d1c;transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-base) var(--ease-out)}
.gcard:focus-visible .gcard-bg{transform:scale(1.06)}
.gcard:focus-visible::after{opacity:1}
.gcard:focus-visible .gcard-more{grid-template-rows:1fr}
.gcard:focus-visible .gcard-sub{display:none}

.gr-help{margin-top:96px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px;align-items:center;padding:56px;border-radius:18px;background:radial-gradient(90% 120% at 85% 110%,#b3123f 0%,#8b0d2b 45%,#4a0718 100%)}
.gr-help h2{margin:0;font-size:clamp(30px,3vw,44px);line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.gr-help p{margin:14px 0 0;font-size:17px;line-height:27px;color:rgba(255,255,255,.9);max-width:560px}
.gr-help-cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}
.gr-end{height:96px}

@media (hover:hover) and (pointer:fine){
.pill-white:hover{background:#f1ece8}
.pill-line:hover{background:#fff;color:#1d1d1c}
.sf-crumbs a:hover{text-decoration:underline;text-underline-offset:4px}
.gcard:hover .gcard-bg{transform:scale(1.06)}
.gcard:hover::after{opacity:1}
.gcard:hover .gcard-more{grid-template-rows:1fr}
.gcard:hover .gcard-sub{display:none}
.gcard:hover .gcard-round{background:#c2063a;color:#fff;transform:rotate(-45deg)}
}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{transition-property:color,background-color,border-color,opacity!important;transition-duration:var(--dur-fast)!important}
.pill:active,.gcard:hover .gcard-bg,.gcard:focus-visible .gcard-bg,.gcard:hover .gcard-round,.gcard:focus-visible .gcard-round{transform:none}
}
@media (max-width:1199px){
.gr-cards{grid-template-columns:minmax(0,1fr)}
.gcard{height:400px}
.gr-facts{grid-template-columns:repeat(2,minmax(0,1fr))}
.gr-facts>div{padding-bottom:28px}
.gr-help{grid-template-columns:minmax(0,1fr)}
.gr-help-cta{justify-content:flex-start}
}
@media (max-width:900px){
.grid2{grid-template-columns:minmax(0,1fr)}
.grid2>.label{padding:24px 0 0}
.grid2>.content{padding:12px 0 0;border-left:0}
.gcard-more{display:none}
}
@media (max-width:767px){
html{scroll-padding-top:90px}
.wrap{padding-left:20px;padding-right:20px}
.gr-hero{padding:120px 0 40px}
.sf-crumbs ol{margin-bottom:16px;font-size:13px}
.gr-h1{font-size:40px;line-height:44px}
.gr-lead{margin-top:20px;font-size:18px;line-height:28px}
.gr-cards{gap:12px}
.gcard{height:320px;padding:24px}
.gcard h2{font-size:30px}
.gcard-more p{font-size:15px}
.gr-num{padding-top:64px}
.gr-facts{margin-top:28px;gap:0 20px}
.gr-facts>div{padding:20px 0}
.gr-facts dd{font-size:38px}
.gr-help{margin-top:64px;padding:28px 24px;gap:24px}
.gr-help-cta{flex-direction:column}
.gr-help-cta .pill{width:100%}
.gr-end{height:64px}
}
/* Altezza uniforme dell'apertura (11/11): 750 desktop, 700 tablet, 650 mobile */
.gr-hero{box-sizing:border-box;min-height:0!important;max-height:none!important}
@media (min-width:1200px){.gr-hero{height:750px!important}}
@media (min-width:768px) and (max-width:1199px){.gr-hero{height:700px!important}}
@media (max-width:767px){.gr-hero{height:650px!important}}
/* Mobile (11/11): nelle aperture con testo e immagine, immagine sopra e testo sotto */
@media (max-width:767px){.gr-hero{align-items:flex-end!important;padding:0 0 40px!important}.gr-hero>img{top:56px!important;left:0!important;right:0!important;width:100%!important;height:52vw!important;-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent 100%)!important;mask-image:linear-gradient(to bottom,#000 70%,transparent 100%)!important}.gr-h1{font-size:34px!important;line-height:38px!important}.gr-lead{margin-top:14px!important;font-size:16px!important;line-height:24px!important}.gr-hero .wrap>div{margin-top:20px!important}.gr-hero .wrap>div .pill-line{display:none}}
/* Mobile (11/11): foto a tutto campo come Applicazione Pizzeria */
@media (max-width:767px){.gr-hero{background:#1d1d1c!important;position:relative}.gr-hero >img{position:absolute!important;inset:0!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;height:100%!important;max-width:none!important;aspect-ratio:auto!important;object-fit:cover!important;transform:none!important;-webkit-mask-image:none!important;mask-image:none!important;object-position:72% 50%!important}.gr-hero::after{content:""!important;display:block!important;position:absolute!important;inset:0!important;top:0!important;height:auto!important;width:auto!important;pointer-events:none;z-index:0;background:linear-gradient(180deg,rgba(20,20,19,.5) 0%,rgba(20,20,19,0) 18%,rgba(20,20,19,.35) 32%,rgba(20,20,19,.9) 56%,#1d1d1c 100%)!important}.gr-hero .wrap{position:relative!important;z-index:1;padding-top:0!important;padding-bottom:40px!important;margin-top:0!important}}
/* Hover sulle schede (11/11): bordo e bagliore come nei form, solo al passaggio del mouse */
.gcard{outline:1px solid transparent;outline-offset:0;transition:outline-color 250ms cubic-bezier(.2,.8,.2,1),box-shadow 250ms cubic-bezier(.2,.8,.2,1)}
@media (hover:hover) and (pointer:fine){.gcard:hover{outline-color:#D52F5D;box-shadow:0 0 32px 4px rgba(213,47,93,.22)}}
</style>

<style>
:root{--red:#c2063a;--red-hover:#a40531;--red-on-dark:#D2003C;--ink:#1d1d1c;--ink-2:#262625;--ink-3:#141413;--hair:rgba(255,255,255,.16);--text-2:#c9ccce;--text-1:#ffffff;--ease:cubic-bezier(.2,.8,.2,1);--ease-out:cubic-bezier(.2,.8,.2,1);--ease-in:cubic-bezier(.4,0,1,1);--ease-inout:cubic-bezier(.4,0,.2,1);--dur-fast:150ms;--dur-base:250ms;--dur-slow:400ms;--dur-page:450ms}
body{margin:0;font-family:'Montserrat',system-ui,sans-serif;color:#fff;background:#1d1d1c}

.wrap{max-width:1360px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));box-sizing:border-box}

.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;box-sizing:border-box;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;-webkit-user-select:none;user-select:none;transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform 120ms var(--ease-out)}
.pill:active{transform:scale(.97)}
.pill-red{background:#c2063a;color:#fff;border:1px solid #e0587c}
.pill-white{background:#fff;color:#1d1d1c}
.pill-line{border:1.5px solid rgba(255,255,255,.7);color:#fff}
.grid2{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);border-top:1px solid var(--hair)}
.grid2>.label{padding:28px 40px 0 0}
.grid2>.content{padding:28px 0 0 40px;min-width:0;border-left:1px solid var(--hair)}
.sf-sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
.sf-crumbs ol{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px;padding:0;list-style:none;font-size:14px;line-height:20px;color:rgba(255,255,255,.82)}

.sf-sticky{display:none}

/* Comparsa allo scroll */
@supports (animation-timeline: view()){
@media (prefers-reduced-motion: no-preference){
.reveal{margin-inline:-48px;padding-inline:48px;view-timeline-name:--sezione;animation:reveal-fondo linear both;animation-timeline:--sezione;animation-range:entry 0% entry 70%}
.reveal>.wrap{animation:reveal-zoom linear both;animation-timeline:--sezione;animation-range:entry 0% entry 70%;transform-origin:50% 0}
}
@media (pointer:coarse) and (prefers-reduced-motion:no-preference){
.reveal{animation-name:reveal-fondo-m}
}
}
@keyframes reveal-fondo{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}
@keyframes reveal-fondo-m{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}

.ap-sec.reveal{margin-inline:-48px;padding-inline:48px}

/* Apertura con l'ambientata */
.ap-hero{position:relative;margin-top:-82px;height:760px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#141413}
.ap-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 50%}
.ap-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,20,19,.88) 0%,rgba(20,20,19,.55) 45%,rgba(20,20,19,0) 75%),linear-gradient(180deg,rgba(20,20,19,.55) 0%,rgba(20,20,19,0) 25%,rgba(20,20,19,0) 60%,#1d1d1c 100%)}
.ap-hero .wrap{position:relative;z-index:1;width:100%;padding-bottom:88px}
.ap-h1{margin:0;font-size:72px;line-height:1;font-weight:800;letter-spacing:-.03em;max-width:760px;text-wrap:balance}
.ap-tratto{display:flex;flex-direction:column;gap:8px;margin:28px 0 0}
.ap-tratto span{display:block;height:6px;border-radius:999px;background:#c2063a}
.ap-tratto span:nth-child(1){width:96px}.ap-tratto span:nth-child(2){width:176px}.ap-tratto span:nth-child(3){width:256px}
.ap-lead{margin:28px 0 0;font-size:20px;line-height:32px;color:#fff;max-width:600px}
.ap-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}

/* Sezioni */
.ap-sec{padding:96px 0 0;background:#1d1d1c}

.ap-intro{margin:20px 0 0;font-size:19px;line-height:1.6;color:#e4e7e9;max-width:640px}

/* Che pizza fai: blocchi foto e testo alternati */
.ap-stile{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:64px;align-items:center;margin-top:72px}
.ap-stile--rev{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.ap-stile--rev .ap-img{order:2}
.ap-img{border-radius:18px;overflow:hidden;aspect-ratio:16/10;background:#141413}
.ap-img img{width:100%;height:100%;object-fit:cover;display:block}
.ap-k{margin:0;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.ap-txt h3{margin:14px 0 0;font-size:clamp(30px,3vw,44px);line-height:1.08;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.ap-txt>p:not(.ap-k){margin:18px 0 0;font-size:18px;line-height:1.6;color:#e4e7e9;max-width:500px}
.ap-forni{list-style:none;margin:28px 0 0;padding:0;max-width:500px;border-top:1px solid rgba(255,255,255,.16)}

.ap-forni b{display:block;font-size:20px;line-height:24px;font-weight:800;letter-spacing:.06em}
.ap-forni small{display:block;margin-top:4px;font-size:14px;line-height:20px;color:#c9ccce}
.ap-arrow{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;color:#1d1d1c;transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-base) var(--ease-out)}

/* Cosa conta in panetteria */
.ap-plus{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 32px}
.ap-plus li{display:flex;flex-direction:column;gap:16px;padding:28px 0;border-top:1px solid rgba(255,255,255,.14)}
.ap-plus img{width:64px;height:auto;display:block}
.ap-plus h3{margin:0;font-size:20px;line-height:1.3;font-weight:700}
.ap-plus p{margin:0;font-size:15px;line-height:24px;color:#c9ccce}
.ap-ast{color:#c2063a}
.ap-note{margin:8px 0 0;font-size:13px;line-height:20px;color:#c9ccce}

/* Per le catene */
.ap-cat-chain{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:0;border-radius:18px;overflow:hidden;background:#262625}
.ap-cat-chain .ap-img{border-radius:0;aspect-ratio:auto;min-height:440px}
.ap-chain-txt{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:56px}
.ap-chain-txt h2{margin:14px 0 0;font-size:clamp(30px,3vw,44px);line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.ap-chain-txt>p:not(.ap-k){margin:18px 0 0;font-size:17px;line-height:27px;color:#e4e7e9;max-width:480px}
.ap-chain-txt .lnk{margin-top:28px;font-size:15px;display:inline-flex;align-items:center;min-height:44px}

.ap-catalogo{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px;align-items:center;padding:56px;border-radius:18px;background:radial-gradient(90% 120% at 85% 110%,#b3123f 0%,#8b0d2b 45%,#4a0718 100%)}

.ap-catalogo-cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}

@media (hover:hover) and (pointer:fine){

DCLite.define("Applicazione-Panetteria", "<div style=\"min-width:320px;background:#1d1d1c;color:#fff;font-family:'Montserrat',system-ui,sans-serif\">\n\n<dc-import name=\"Comp-Header\" style=\"display: contents\" hint-size=\"100%,81px\"><\/dc-import>\n<main id=\"contenuto\">\n\n<!-- 07 APPLICAZIONE: PANETTERIA -->\n<section class=\"ap-hero\" aria-labelledby=\"ap-titolo\">\n<img class=\"ap-hero-img\" src=\"../img/4b2beba74d8eabbbf72f3b8af86fae92.jpg\" alt=\"\" width=\"1067\" height=\"1600\" fetchpriority=\"high\" style=\"object-position: 50% 60%\">\n<div class=\"wrap\">\n<nav class=\"sf-crumbs\" aria-label=\"Percorso\"><ol><li><a href=\"../home/\">Home<\/a><\/li><li><span>Applicazioni<\/span><\/li><li><span aria-current=\"page\">Panetteria<\/span><\/li><\/ol><\/nav>\n<h1 class=\"ap-h1\" id=\"ap-titolo\">Il forno per la tua panetteria.<\/h1>\n\n<p class=\"ap-lead\">Pane comune, grandi pezzature, farine integrali e senza glutine: ogni impasto chiede la sua cottura. Parti da quello che sforni, il forno viene di conseguenza.<\/p>\n<div class=\"ap-cta\"><a class=\"pill pill-red\" href=\"#stili\" onClick=\"{{goSez}}\">Trova il tuo forno<\/a><a class=\"pill pill-white\" href=\"#richiesta\" onClick=\"{{goSez}}\">Richiedi informazioni<\/a><\/div>\n<\/div>\n<style>@media (min-width: 1024px){.ap-hero .ap-hero-img{transform:translateX(18%) !important;-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 28%);mask-image:linear-gradient(to right,transparent 0%,#000 28%)}}<\/style><\/section>\n\n<!-- CHE PANE FAI -->\n<section class=\"ap-sec reveal\" id=\"stili\" aria-labelledby=\"t-stili\" style=\"padding-top: 0px\">\n<div class=\"wrap\">\n<div class=\"grid2\"><div class=\"label\">Produzioni<\/div><div class=\"content\"><h2 class=\"ap-h2\" id=\"t-stili\">Che pane fai?<\/h2><p class=\"ap-intro\">Vapore, cicli di temperatura e capacità cambiano con il prodotto. Ecco da quale forno partire.<\/p><\/div><\/div>\n\n<article class=\"ap-stile\">\n<div class=\"ap-img\"><img src=\ glia del carrello, dalla superficie al cuore del prodotto. Da 7 a 18 teglie 60 × 40, elettrico o a gas.<\/p>\n<ul class=\"ap-forni\">\n<li><a href=\"../rotor/\"><span><b>ROTOR<\/b><small>Modelli 710 e 1518, elettrico o a gas<\/small><\/span><span class=\"ap-arrow\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li>\n<li><a href=\"../modular/\"><span><b>MODULAR<\/b><small>Aggiungi camere quando cresce la produzione<\/small><\/span><span class=\"ap-arrow\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li>\n<\/ul>\n<\/div>\n<\/article>\n\n<article class=\"ap-stile\">\n<div class=\"ap-img\"><img src=\"../img/7f9e39f2a2d643f154cfed0fe02d74a0.jpg\" alt=\"Mani che spolverano farina accanto a un cestino di panini ai semi\" width=\"1706\" height=\"853\" loading=\"lazy\" decoding=\"async\"><\/div>\n<div class=\"ap-txt\">\n<p class=\"ap-k\">Integrale e senza glutine<\/p>\n<h3>Farine speciali, cottura più graduale.<\/h3>\n<p>Le farine integrali, a basso o senza glutine chiedono una cottura più graduale e delicata. Bread Ready di ROTOR è pensato per questo: programmi dedicati, salvati con My Baking e richiamati con un tocco.<\/p>\n<ul class=\"ap-forni\">\n<li><a href=\"../rotor/\"><span><b>ROTOR<\/b><small>Con Bread Ready e programmi per pane e pasticceria<\/small><\/span><span class=\"ap-arrow\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/span><\/a><\/li>\n<\/ul>\n<\/div>\n<\/article>\n<\/div>\n
